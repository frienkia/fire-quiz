  h += '</div><p class="muted mt8">导出的 json 可以在另一台设备导入，换手机时错题本和成绩不丢。</p>';
  h += '<p class="muted mt16">说明：题库为按中级监控考纲整理的练习题库，非官方真题；涉及具体数值请以现行规范原文为准。多选题少选、多选、错选均不得分。答题、错题本、成绩均只保存在本机浏览器。</p>';
  h += '</div>';
  return h;
}

function viewExam(){
  var q = S.paper[S.idx];
  var t = typeOf(q);
  var a = S.ans[S.idx];
  var answeredCount = S.ans.filter(answered).length;
  var rev = S.practice && (t === 'm' ? S.locked[S.idx] : answered(a));
  var rightN = 0, wrongN = 0;
  if (S.practice){
    S.paper.forEach(function(x, i){
      var settled = typeOf(x) === 'm' ? S.locked[i] : answered(S.ans[i]);
      if (!settled) return;
      if (isRight(x, S.ans[i])) rightN++; else wrongN++;
    });
  }
  var h = '';
  h += '<div class="bar"><div class="inner">';
  h += '<span class="meta">第 <b>' + (S.idx+1) + '</b> / ' + S.paper.length + ' 题</span>';
  h += '<span class="meta">已答 <b id="answeredCount">' + answeredCount + '</b> 题</span>';
  if (S.practice) h += '<span class="meta">对 <b>' + rightN + '</b> · 错 <b>' + wrongN + '</b></span>';
  h += '<span class="meta">用时 <b id="clock">00:00</b></span>';
  h += '<span class="spacer"></span>';
  h += '<button class="btn" data-act="sheet">答题卡</button> ';
  h += S.practice
    ? '<button class="btn primary" data-act="finish">结束练习</button>'
    : '<button class="btn primary" data-act="submit">交卷</button>';
  h += '</div></div>';

  h += '<div class="wrap"><div class="card qwrap">';
  h += '<span class="chip">' + esc(q.cat) + '</span> <span class="chip type">' + (TNAME[t] || '单选') + '</span>';
  h += '<div class="stem">' + esc(q.stem) + '</div>';
  if (t === 'm' && !rev) h += '<div class="tip">多选题：选出全部正确选项后点「确认本题」查看结果</div>';
  h += '<div id="opts">';
  q.opts.forEach(function(text, i){
    var on = t === 'm' ? (Array.isArray(a) && a.indexOf(i) >= 0) : (a === i);
    var cls = 'opt';
    if (t === 'm') cls += ' sq';
    if (rev){
      var good = t === 'm' ? (q.ans.indexOf(i) >= 0) : (q.ans === i);
      if (good) cls += ' ok';
      else if (on) cls += ' bad';
      cls += ' lock';
    } else if (on){
      cls += ' on';
    }
    h += '<div class="' + cls + '" data-act="pick" data-i="' + i + '">';
    h += '<span class="tag">' + LETTER[i] + '</span><span>' + esc(text) + '</span></div>';
  });
  h += '</div>';
  h += '<div class="swipe-hint">← 左右滑动翻题 →</div>';

  if (rev){
    var good = isRight(q, a) || isRight(q, (S.locked[S.idx] ? a : a));
    h += '<div class="explain ' + (isRight(q, a) ? 'ok' : 'bad') + '">';
    h += '<div class="head">' + (isRight(q, a) ? '✓ 答对了' : '✗ 答错了') + '</div>';
    if (!isRight(q, a)) h += '<div>正确答案：<b>' + esc(ansText(q)) + '</b></div>';
    if (q.exp) h += '<div>' + esc(q.exp) + '</div>';
    h += '</div>';
  }

  h += '<div class="row mt24">';
  h += '<button class="btn" data-act="prev"' + (S.idx===0?' disabled':'') + '>上一题</button>';
  if (t === 'm' && S.practice && !rev && answered(a)){
    h += '<button class="btn primary" data-act="check">确认本题</button>';
  } else {
    h += '<button class="btn primary" data-act="next">' + (S.idx===S.paper.length-1 ? (S.practice ? '结束练习' : '最后一题') : '下一题') + '</button>';
  }
  h += '<span class="spacer"></span>';
  h += '<button class="btn" data-act="sheet">答题卡</button>';
  h += '</div>';

  if (S.sheet){
    h += '<div class="rule"></div><div class="row"><h2 style="margin:0">答题卡</h2><span class="muted">蓝色为已答，点击跳转</span></div><div class="sheet">';
    S.paper.forEach(function(x, i){
      var cls = answered(S.ans[i]) ? 'done' : '';
      if (i === S.idx) cls += ' cur';
      h += '<button class="' + cls + '" data-act="jump" data-i="' + i + '">' + (i+1) + '</button>';
    });
    h += '</div>';
  }
  h += '</div></div>';

  if (S.confirm){
    var left = S.paper.length - answeredCount;
    h += '<div class="mask"><div class="dlg"><h2>确认交卷</h2><p class="sub">共 ' + S.paper.length + ' 题，已答 ' + answeredCount + ' 题' + (left ? '，还有 <b>' + left + '</b> 题未作答' : '') + '。交卷后将立即评分。</p>';
    h += '<div class="row mt16"><button class="btn" data-act="cancel">再检查一下</button><button class="btn primary" data-act="do-submit">确认交卷</button></div></div></div>';
  }
  return h;
}

function viewResult(){
  var r = S.result;
  var h = '<div class="card">';
  var scoreMode = r.scoreMode;
  h += '<h1>' + (r.practice ? '练习结果' : '考试结果') + '</h1>';
  h += '<p class="sub">' + (r.practice ? '本轮抽题 ' + r.n + ' 道，已答 ' + r.done + ' 道' : '共 ' + r.n + ' 题') + ' · 用时 ' + fmt(r.sec) + '</p>';
  h += '<div class="mt16"><span class="score">' + (scoreMode ? r.score : r.rate) + '<small>' + (scoreMode ? ' 分' : '%') + '</small></span>';
  if (scoreMode) h += '<span class="badge ' + (r.score>=PASS?'ok':'no') + '">' + (r.score>=PASS?'合格':'未达标') + '</span>';
  h += '</div>';
  if (scoreMode){
    h += '<p class="muted mt8">得分 <b>' + r.pts + ' / ' + r.ptsTotal + '</b> 分（折算百分制）· 单选 1 分 · 多选 2 分 · 判断 1 分</p>';
  } else {
    h += '<p class="muted mt8">没做完整套，按已答的正确率统计；把 200 题做完才会折算分数。</p>';
  }
  h += '<div class="stat"><div><b>' + r.right + '</b>答对</div><div><b>' + r.wrong + '</b>答错</div><div><b>' + r.blank + '</b>未答</div><div><b>' + r.rate + '%</b>正确率</div></div>';
  var ts = r.types, tline = [];
  ['s','m','j'].forEach(function(k){
    if (ts[k] && ts[k].t) tline.push(TNAME[k] + ' ' + ts[k].r + '/' + ts[k].t + ' 题' + (scoreMode ? '（' + ts[k].p + '/' + ts[k].pt + ' 分）' : ''));
  });
  h += '<p class="muted mt8">' + tline.join('　·　') + '</p>';
  h += '<div class="rule"></div><h2>各模块得分</h2>';
  Object.keys(r.cats).sort().forEach(function(c){
    var s = r.cats[c], p = s.t ? Math.round(s.r / s.t * 100) : 0;
    h += '<div style="margin:10px 0"><div class="row" style="justify-content:space-between"><span class="muted">' + esc(c) + '</span><span class="muted">' + s.r + ' / ' + s.t + '　' + p + '%</span></div>';
    h += '<div style="height:6px;background:#eef1f6;border-radius:99px;overflow:hidden;margin-top:5px"><div style="height:100%;width:' + p + '%;background:#2563eb;border-radius:99px"></div></div></div>';
  });
  h += '<div class="rule"></div><h2>错题回顾（' + r.wrongItems.length + ' 题）</h2>';
  if (!r.wrongItems.length){
    h += '<p class="muted">' + (r.blank ? '没有答错的题，但有 ' + r.blank + ' 题未作答。' : '全部答对，太棒了。') + '</p>';
  } else {
    r.wrongItems.forEach(function(w, k){
      var q = w.q;
      h += '<div class="wrong"><div class="q">' + (k+1) + '. ' + esc(q.stem) + ' <span class="chip type">' + (TNAME[typeOf(q)] || '单选') + '</span></div>';
      h += '<div class="a">正确答案：<span class="yes">' + esc(ansText(q)) + '</span>　你的答案：<span class="no">' + esc(myText(q, w.a)) + '</span></div>';
      if (q.exp) h += '<div class="e">' + esc(q.exp) + '</div>';
      h += '</div>';
    });
  }
  h += '<div class="row mt24">';
  h += '<button class="btn primary" data-act="review">答题卡 · 逐题解析</button>';
  h += '<button class="btn" data-act="again">' + (r.practice ? '再练一套' : '再来一套') + '</button>';
  h += '<button class="btn" data-act="home">返回首页</button>';
  if (r.wrongItems.length) h += '<button class="btn" data-act="redo">重做这套错题</button>';
  h += '<button class="btn" data-act="export">导出错题</button></div>';
  h += '<p class="muted mt16">' + (r.wrongItems.length ? '错题已自动加入错题本（做对的题会从错题本移除）。' : '本套没有错题。') + '</p>';
  h += '</div>';
  return h;
}

function viewReview(){
  var r = S.result;
  var h = '<div class="card">';
  h += '<h1>答题卡 · 逐题解析</h1>';
  h += '<p class="sub">共 ' + r.n + ' 题 · 答对 ' + r.right + ' · 答错 ' + r.wrong + ' · 未答 ' + r.blank + '</p>';
  h += '<div class="row mt16"><div class="seg">';
  h += '<button data-act="filter" data-f="all" class="' + (S.filter==='all'?'on':'') + '">全部</button>';
  h += '<button data-act="filter" data-f="wrong" class="' + (S.filter==='wrong'?'on':'') + '">只看错题</button>';
  h += '</div><span class="spacer"></span><button class="btn" data-act="back">返回结果</button></div>';
  h += '<div class="rule"></div>';

  S.paper.forEach(function(q, i){
    var a = S.ans[i];
    var ok = isRight(q, a);
    if (S.filter === 'wrong' && (ok || !answered(a))) return;
    h += '<div class="rev"><div class="h"><span class="n">' + (i+1) + '.</span>';
    h += '<span class="chip type">' + (TNAME[typeOf(q)] || '单选') + '</span>';
    h += '<span class="chip">' + esc(q.cat) + '</span>';
    h += '<span class="chip ' + (ok ? '' : '') + '" style="background:' + (ok ? '#e8f7ee' : (answered(a) ? '#fdecec' : '#f1f4f9')) + ';color:' + (ok ? '#16a34a' : (answered(a) ? '#dc2626' : '#6b7280')) + '">' + (ok ? '答对' : (answered(a) ? '答错' : '未答')) + '</span>';
    h += '</div>';
    h += '<div class="q">' + esc(q.stem) + '</div>';
    h += '<div class="a">正确答案：<span class="yes">' + esc(ansText(q)) + '</span>　你的答案：<span class="no">' + esc(myText(q, a)) + '</span></div>';
    if (q.exp) h += '<div class="e">' + esc(q.exp) + '</div>';
    h += '</div>';
  });
  h += '</div>';
  return h;
}

function render(keepScroll){
  var y = window.scrollY;
  var app = document.getElementById('app');
  if (S.screen === 'setup') app.innerHTML = viewSetup();
  else if (S.screen === 'exam') app.innerHTML = viewExam();
  else if (S.screen === 'review') app.innerHTML = viewReview();
  else app.innerHTML = viewResult();
  window.scrollTo(0, keepScroll ? y : 0);
  if (S.screen === 'exam') startClock();
}

function startClock(){
  if (S.timer) return;
  S.timer = setInterval(function(){
    var el = document.getElementById('clock');
    if (!el) return;
    el.textContent = fmt(Math.floor((Date.now() - S.t0) / 1000));
  }, 1000);
}
function stopClock(){ if (S.timer){ clearInterval(S.timer); S.timer = null; } }

function startExam(ids){
  var paper;
  if (ids){
    var set = {};
    ids.forEach(function(x){ set[x] = 1; });
    paper = shuffle(BANK.filter(function(q){ return set[q.id]; }));
    if (!paper.length) return;
  } else {
    var n = S.practice ? 200 : S.size;
    paper = buildPaper(n, S.mode === 'balanced');
  }
  S.paper = paper;
  S.ans = paper.map(function(q){ return typeOf(q) === 'm' ? [] : null; });
  S.locked = paper.map(function(){ return false; });
  S.idx = 0;
  S.sheet = false;
  S.confirm = false;
  S.result = null;
  S.review = false;
  S.filter = 'all';
  S.t0 = Date.now();
  S.screen = 'exam';
  stopClock();
  saveSession();
  render();
  startClock();
  window.scrollTo(0,0);
}

function pick(i){
  var q = S.paper[S.idx];
  if (S.practice && S.locked[S.idx]) return;
  if (S.practice && typeOf(q) !== 'm' && answered(S.ans[S.idx])) return;
  if (typeOf(q) === 'm'){
    var cur = Array.isArray(S.ans[S.idx]) ? S.ans[S.idx].slice() : [];
    var k = cur.indexOf(i);
    if (k >= 0) cur.splice(k, 1); else cur.push(i);
    cur.sort();
    S.ans[S.idx] = cur;
    refreshOpts();
    saveSession();
    if (S.practice) render(true);
    return;
  }
  S.ans[S.idx] = i;
  saveSession();
  if (S.practice){ render(true); return; }
  refreshOpts();
}

function refreshOpts(){
  var q = S.paper[S.idx], t = typeOf(q), a = S.ans[S.idx];
  var box = document.getElementById('opts');
  if (box){
    Array.prototype.forEach.call(box.children, function(el, i){
      var on = t === 'm' ? (Array.isArray(a) && a.indexOf(i) >= 0) : (a === i);
      el.className = 'opt' + (on ? ' on' : '') + (t === 'm' ? ' sq' : '');
    });
  }
  var cnt = document.getElementById('answeredCount');
  if (cnt) cnt.textContent = S.ans.filter(answered).length;
}

function goto(i, dir){
  if (i < 0 || i >= S.paper.length) return;
  if (i === S.idx) return;
  if (S.navLock) return;
  S.navLock = false;
  if (dir === undefined) dir = i > S.idx ? 1 : -1;
  var wrap = document.querySelector('.qwrap');
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var doRender = function(){
    S.idx = i;
    saveSession();
    render(true);
    var w = document.querySelector('.qwrap');
    if (w && !reduce){
      w.classList.remove('anim-in-left', 'anim-in-right');
      w.classList.add(dir > 0 ? 'anim-in-right' : 'anim-in-left');
    }
  };
  if (wrap && !reduce){
    S.navLock = true;
    wrap.classList.remove('anim-in-left', 'anim-in-right');
    wrap.classList.add(dir > 0 ? 'anim-out-left' : 'anim-out-right');
    setTimeout(function(){ S.navLock = false; doRender(); }, 70);
  } else {
    doRender();
  }
}

function finish(){
  stopClock();
  var n = S.paper.length;
  var right = 0, wrong = 0, blank = 0, done = 0;
  var wrongItems = [];
  var cats = {}, types = { s:{r:0,t:0,p:0,pt:0}, m:{r:0,t:0,p:0,pt:0}, j:{r:0,t:0,p:0,pt:0} };
  var pts = 0, ptsTotal = 0;
  S.paper.forEach(function(q, i){
    var a = S.ans[i], t = typeOf(q), p = pointsOf(q);
    ptsTotal += p;
    cats[q.cat] = cats[q.cat] || { r: 0, t: 0 };
    cats[q.cat].t++;
    types[t] = types[t] || { r:0, t:0, p:0, pt:0 };
    types[t].t++; types[t].pt += p;
    if (!answered(a)){ blank++; return; }
    done++;
    if (isRight(q, a)){ right++; pts += p; cats[q.cat].r++; types[t].r++; types[t].p += p; }
    else { wrong++; wrongItems.push({ q: q, a: a }); }
  });
  var score = ptsTotal ? Math.round(pts / ptsTotal * 1000) / 10 : 0;
  var fullDone = done === n;
  // 练习模式没做完整套 -> 不算分数，按正确率；考试模式交卷 -> 一律按分数
  var scoreMode = S.practice ? fullDone : true;
  var rate = Math.round(right / (S.practice ? (done || 1) : n) * 1000) / 10;
  var sec = Math.floor((Date.now() - S.t0) / 1000);

  var book = load(LS.wrong, []);
  var set = new Set(book);
  S.paper.forEach(function(q, i){
    if (!answered(S.ans[i])) return;
    if (isRight(q, S.ans[i])) set.delete(q.id); else set.add(q.id);
  });
  save(LS.wrong, Array.from(set));

  var hist = load(LS.hist, []);
  hist.push({ t: Date.now(), n: n, score: scoreMode ? score : rate, mode: scoreMode ? 'score' : 'rate' });
  if (hist.length > 50) hist = hist.slice(-50);
  save(LS.hist, hist);

  S.paper.forEach(function(q){ SEEN.add(q.id); });
  var seenArr = Array.from(SEEN);
  if (seenArr.length > 900) seenArr = seenArr.slice(-900);
  save(LS.seen, seenArr);

  clearSession();
  S.result = { n: n, done: done, right: right, wrong: wrong, blank: blank, score: score, sec: sec,
               rate: rate, pts: pts, ptsTotal: ptsTotal, scoreMode: scoreMode, fullDone: fullDone,
               cats: cats, wrongItems: wrongItems, types: types, practice: S.practice };
  S.screen = 'result';
  S.confirm = false;
  render();
}

function exportWrong(){
  var r = S.result, lines = [];
  lines.push('消防设施操作员（中级·监控）错题本');
  lines.push('导出时间：' + new Date().toLocaleString());
  lines.push('');
  r.wrongItems.forEach(function(w, k){
    var q = w.q;
    lines.push((k+1) + '. [' + q.cat + '·' + (TNAME[typeOf(q)] || '单选') + '] ' + q.stem);
    q.opts.forEach(function(t, i){ lines.push('   ' + LETTER[i] + '．' + t); });
    lines.push('   正确答案：' + ansText(q) + '　你的答案：' + myText(q, w.a));
    if (q.exp) lines.push('   解析：' + q.exp);
    lines.push('');
  });
  var blob = new Blob([lines.join('\n')], { type: 'text/plain;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '错题本_' + new Date().toISOString().slice(0,10) + '.txt';
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}

/* ---------- 交互 ---------- */
document.addEventListener('click', function(e){
  var el = e.target.closest ? e.target.closest('[data-act]') : null;
  if (!el) return;
  var act = el.getAttribute('data-act');
  if (act === 'pmode'){ S.practice = el.getAttribute('data-p') === '1'; render(); }
  else if (act === 'size'){ S.size = parseInt(el.getAttribute('data-n'), 10); render(); }
  else if (act === 'mode'){ S.mode = el.getAttribute('data-m'); render(); }
  else if (act === 'start'){ startExam(null); }
  else if (act === 'pick'){ pick(parseInt(el.getAttribute('data-i'), 10)); }
  else if (act === 'check'){ S.locked[S.idx] = true; render(true); }
  else if (act === 'prev'){ goto(S.idx - 1); }
  else if (act === 'next'){
    if (S.idx < S.paper.length - 1) goto(S.idx + 1);
    else finish();
  }
  else if (act === 'finish'){ finish(); }
  else if (act === 'sheet'){ S.sheet = !S.sheet; render(true); }
  else if (act === 'jump'){ S.idx = parseInt(el.getAttribute('data-i'), 10); S.sheet = false; render(true); }
  else if (act === 'submit'){ S.confirm = true; render(true); }
  else if (act === 'cancel'){ S.confirm = false; render(true); }
  else if (act === 'do-submit'){ finish(); }
  else if (act === 'again'){ startExam(null); }
  else if (act === 'home'){ S.screen = 'setup'; S.sheet = false; S.review = false; render(); }
  else if (act === 'review'){ S.screen = 'review'; S.filter = 'all'; render(); }
  else if (act === 'back'){ S.screen = 'result'; render(); }
  else if (act === 'filter'){ S.filter = el.getAttribute('data-f'); render(); }
  else if (act === 'redo'){
    if (S.result && S.result.wrongItems.length) startExam(S.result.wrongItems.map(function(w){ return w.q.id; }));
    else startExam(load(LS.wrong, []));
  }
  else if (act === 'export'){ exportWrong(); }
  else if (act === 'resume'){ resumeSession(); }
  else if (act === 'discard'){ clearSession(); render(); }
  else if (act === 'exportdata'){ exportData(); }
  else if (act === 'importdata'){ var fi = document.getElementById('impfile'); if (fi) fi.click(); }
});

document.addEventListener('change', function(e){
  if (e.target && e.target.id === 'fresh'){ S.fresh = e.target.checked; }
  if (e.target && e.target.id === 'impfile' && e.target.files && e.target.files[0]){ importData(e.target.files[0]); }
});

var TOUCH = null;
document.addEventListener('touchstart', function(e){
  if (S.screen !== 'exam' || S.confirm || S.sheet){ TOUCH = null; return; }
  if (!e.touches || e.touches.length !== 1){ TOUCH = null; return; }
  var t = e.touches[0];
  TOUCH = { x: t.clientX, y: t.clientY, t: Date.now() };
}, { passive: true });

document.addEventListener('touchend', function(e){
  if (!TOUCH || S.screen !== 'exam' || S.confirm || S.sheet){ TOUCH = null; return; }
  var t = e.changedTouches && e.changedTouches[0];
  if (!t){ TOUCH = null; return; }
  var dx = t.clientX - TOUCH.x;
  var dy = t.clientY - TOUCH.y;
  var dt = Date.now() - TOUCH.t;
  TOUCH = null;
  if (dt > 800) return;
  if (Math.abs(dx) < 60) return;
  if (Math.abs(dx) < Math.abs(dy) * 1.3) return;
  if (dx < 0){
    if (S.idx < S.paper.length - 1){ goto(S.idx + 1); }
  } else {
    if (S.idx > 0){ goto(S.idx - 1); }
  }
}, { passive: true });

document.addEventListener('touchcancel', function(){ TOUCH = null; }, { passive: true });

document.addEventListener('keydown', function(e){
  if (S.screen === 'exam' && !S.confirm){
    var k = e.key;
    if (k >= '1' && k <= '4'){ pick(parseInt(k,10) - 1); }
    else if (k === 'ArrowLeft'){ goto(S.idx - 1); }
    else if (k === 'ArrowRight' || k === 'Enter'){ if (S.idx < S.paper.length - 1) goto(S.idx + 1); }
    else if (k === 'Escape'){ S.sheet = false; render(true); }
  }
});

render();
})();
</script>
</body>
</html>
