<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>消防设施操作员（中级·监控）模拟考试</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="消防刷题">
<style>
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;background:#f3f5f9;color:#1f2937;font:15px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:26px 16px 72px}
.card{background:#fff;border:1px solid #e6eaf2;border-radius:16px;padding:24px 26px;box-shadow:0 4px 16px rgba(31,41,55,.05)}
h1{font-size:21px;margin:0 0 6px;font-weight:650}
h2{font-size:16px;margin:0 0 10px;font-weight:650}
.sub{color:#6b7280;font-size:13.5px;margin:0}
.rule{height:1px;background:#eef1f6;margin:18px 0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;border:1px solid #dfe4ee;border-radius:10px;overflow:hidden}
.seg button{border:0;background:#fff;padding:8px 18px;font-size:14px;cursor:pointer;color:#374151}
.seg button+button{border-left:1px solid #dfe4ee}
.seg button.on{background:#2563eb;color:#fff}
.chip{font-size:12px;color:#2563eb;background:#eef4ff;border-radius:999px;padding:2px 10px;display:inline-block}
.chip.type{color:#475569;background:#f1f4f9}
.opt{display:flex;gap:12px;align-items:flex-start;border:1px solid #e2e7f0;border-radius:12px;padding:12px 14px;margin:10px 0;cursor:pointer;transition:.12s;user-select:none}
.opt:hover{border-color:#b9cdf8;background:#f8fbff}
.opt.on{border-color:#2563eb;background:#f2f7ff}
.opt.ok{border-color:#16a34a;background:#f2fbf5}
.opt.bad{border-color:#dc2626;background:#fdf4f4}
.opt.lock{cursor:default}
.opt .tag{flex:0 0 24px;height:24px;border-radius:50%;border:1px solid #cbd5e1;display:flex;align-items:center;justify-content:center;font-size:13px;color:#475569;margin-top:2px}
.opt.sq .tag{border-radius:6px}
.opt.on .tag{background:#2563eb;border-color:#2563eb;color:#fff}
.opt.ok .tag{background:#16a34a;border-color:#16a34a;color:#fff}
.opt.bad .tag{background:#dc2626;border-color:#dc2626;color:#fff}
.btn{border:1px solid #dfe4ee;background:#fff;border-radius:10px;padding:9px 18px;font-size:14px;cursor:pointer;color:#374151}
.btn:hover{border-color:#b9cdf8}
.btn.primary{background:#2563eb;border-color:#2563eb;color:#fff}
.btn.primary:hover{background:#1d4ed8}
.btn.danger{background:#fff;border-color:#f3c6c6;color:#dc2626}
.btn:disabled{opacity:.4;cursor:not-allowed}
.bar{position:sticky;top:0;z-index:9;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid #eef1f6}
.bar .inner{max-width:860px;margin:0 auto;padding:11px 16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.bar .meta{font-size:13.5px;color:#6b7280}
.bar .meta b{color:#1f2937}
.spacer{flex:1}
.stem{font-size:17px;font-weight:600;line-height:1.85;margin:14px 0 6px}
.tip{font-size:12.5px;color:#6b7280;margin-bottom:4px}
@keyframes q-out-left{from{opacity:1;transform:none}to{opacity:0;transform:translateX(-26%)}}
@keyframes q-out-right{from{opacity:1;transform:none}to{opacity:0;transform:translateX(26%)}}
@keyframes q-in-left{from{opacity:0;transform:translateX(-26%)}to{opacity:1;transform:none}}
@keyframes q-in-right{from{opacity:0;transform:translateX(26%)}to{opacity:1;transform:none}}
.card.qwrap{will-change:transform,opacity}
.qwrap.anim-out-left{animation:q-out-left .07s linear both}
.qwrap.anim-out-right{animation:q-out-right .07s linear both}
.qwrap.anim-in-left{animation:q-in-left .12s cubic-bezier(.22,.61,.36,1) both}
.qwrap.anim-in-right{animation:q-in-right .12s cubic-bezier(.22,.61,.36,1) both}
@media(prefers-reduced-motion:reduce){.qwrap{animation:none!important}}
.swipe-hint{display:none;text-align:center;font-size:12px;color:#9ca3af;margin-top:6px;letter-spacing:2px}
@media(max-width:640px){.swipe-hint{display:block}}
.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px;margin-top:12px}
.sheet button{height:40px;border:1px solid #e2e7f0;background:#fff;border-radius:8px;cursor:pointer;font-size:13px;color:#374151}
.sheet button.done{background:#eef4ff;border-color:#c7dbff;color:#2563eb}
.sheet button.cur{outline:2px solid #2563eb;outline-offset:1px}
.score{font-size:54px;font-weight:700;line-height:1.05;letter-spacing:-1.5px}
.score small{font-size:18px;font-weight:500;color:#6b7280;letter-spacing:0}
.badge{display:inline-block;border-radius:999px;padding:3px 12px;font-size:13px;margin-left:10px;vertical-align:8px}
.badge.ok{background:#e8f7ee;color:#16a34a}
.badge.no{background:#fdecec;color:#dc2626}
.stat{display:flex;gap:26px;flex-wrap:wrap;margin-top:12px;font-size:13.5px;color:#6b7280}
.stat b{display:block;font-size:19px;color:#1f2937;font-weight:650}
.wrong{border:1px solid #eef1f6;border-radius:12px;padding:14px 16px;margin:12px 0}
.wrong .q{font-weight:600;line-height:1.8}
.wrong .a{font-size:13.5px;color:#6b7280;margin-top:6px}
.wrong .a .no{color:#dc2626}
.wrong .a .yes{color:#16a34a;font-weight:600}
.wrong .e{font-size:13.5px;color:#374151;background:#f7f9fc;border-radius:8px;padding:8px 10px;margin-top:8px;line-height:1.75}
.explain{border-radius:12px;padding:12px 14px;margin:14px 0 4px;font-size:13.8px;line-height:1.85}
.explain.ok{background:#f2fbf5;border:1px solid #cdebd6}
.explain.bad{background:#fdf4f4;border:1px solid #f2d2d2}
.explain .head{font-weight:650;margin-bottom:4px}
.list{list-style:none;padding:0;margin:6px 0 0}
.list li{display:flex;justify-content:space-between;font-size:13.5px;color:#4b5563;padding:6px 0;border-bottom:1px dashed #eef1f6}
.muted{color:#6b7280;font-size:13px}
.mt8{margin-top:8px}.mt16{margin-top:16px}.mt24{margin-top:24px}
.mask{position:fixed;inset:0;background:rgba(17,24,39,.35);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.dlg{background:#fff;border-radius:14px;padding:22px 24px;max-width:380px;width:100%}
.rev{border:1px solid #eef1f6;border-radius:12px;padding:14px 16px;margin:10px 0}
.rev .h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.rev .n{font-weight:650;font-size:14px}
.rev .q{font-weight:600;line-height:1.8}
.rev .a{font-size:13.5px;color:#6b7280;margin-top:6px}
.rev .e{font-size:13.4px;color:#374151;background:#f7f9fc;border-radius:8px;padding:8px 10px;margin-top:8px;line-height:1.8}
@media(max-width:640px){
  body{font-size:14.5px}
  .wrap{padding:12px 10px 64px}
  .card{padding:16px 14px;border-radius:14px}
  h1{font-size:19px}
  .bar .inner{padding:8px 10px;gap:8px 12px}
  .bar .meta{font-size:12.5px}
  .btn{padding:8px 13px;font-size:13.5px}
  .opt{padding:11px 12px;margin:8px 0}
  .stem{font-size:16px;line-height:1.8}
  .seg button{padding:7px 12px;font-size:13.5px}
  .sheet{grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
  .sheet button{height:38px}
  .score{font-size:44px}
  .stat{gap:18px}
}
</style>
</head>

销营业执照"],"ans":2,"exp":"消防法第六十七条规定逾期不改正的，对直接负责人员给予处分或警告。"},{"id":"Q0012","cat":"法律法规与职业道德","g":"重点单位-职责","t":"s","stem":"消防安全重点单位除履行一般单位职责外，还应当履行的职责是（　）。","opts":["每年开展一次演练","每季度检测消防设施","配备专职消防队员","实行每日防火巡查"],"ans":3,"exp":"重点单位还应确定管理人、建档案、每日巡查、岗前培训并每半年演练。"},{"id":"Q0013","cat":"法律法规与职业道德","g":"消防法-责任人","t":"s","stem":"依据消防法，单位的主要负责人是本单位的（　）。","opts":["消防安全责任人","消防安全管理人","消防工作联系人","防火巡查负责人"],"ans":0,"exp":"消防法第十六条明确单位主要负责人为本单位消防安全责任人。"},{"id":"Q0014","cat":"法律法规与职业道德","g":"消防法-建设工程","t":"s","stem":"依法应当进行消防设计审查的建设工程，未经审查或审查不合格擅自施工的，应当（　）。","opts":["限期补办手续","责令停止施工并处罚款","通报批评","不予处理"],"ans":1,"exp":"消防法第五十八条规定责令停止施工，并处三万元以上三十万元以下罚款。"},{"id":"Q0015","cat":"法律法规与职业道德","g":"消防法-建设工程","t":"s","stem":"依法应当进行消防验收的建设工程，未经消防验收擅自投入使用的，处（　）罚款。","opts":["五千元以上五万元以下","一千元以上五千元以下","三万元以上三十万元以下","五百元以上二千元以下"],"ans":2,"exp":"消防法第五十八条对未经消防验收擅自投入使用规定三万元至三十万元罚款。"},{"id":"Q0016","cat":"法律法规与职业道德","g":"消防法-场所许可","t":"s","stem":"公众聚集场所投入使用、营业前，应当向（　）申请消防安全检查。","opts":["住房和城乡建设主管部门","公安机关治安部门","市场监督管理部门","消防救援机构"],"ans":3,"exp":"消防法规定公众聚集场所投入使用、营业前应经消防救援机构许可。"},{"id":"Q0017","cat":"法律法规与职业道德","g":"消防法-罚款五千","t":"s","stem":"单位消防设施、器材配置不符合国家标准，责令改正，处（　）罚款。","opts":["五千元以上五万元以下","一万元以上十万元以下","三万元以上三十万元以下","五百元以上二千元以下"],"ans":0,"exp":"消防法第六十条对消防设施未保持完好有效等行为规定五千元至五万元罚款。"},{"id":"Q0018","cat":"法律法规与职业道德","g":"消防法-罚款五千","t":"s","stem":"个人占用、堵塞、封闭疏散通道的，处警告或者（　）罚款。","opts":["一千元以下","五百元以下","二千元以下","五千元以下"],"ans":1,"exp":"消防法第六十条规定个人有妨碍安全疏散行为处警告或五百元以下罚款。"},{"id":"Q0019","cat":"法律法规与职业道德","g":"消防法-拘留","t":"s","stem":"过失引起火灾尚不构成犯罪的，处（　）拘留。","opts":["五日以上十日以下","十五日以上二十日以下","十日以上十五日以下","三日以上七日以下"],"ans":2,"exp":"消防法第六十四条规定过失引起火灾尚不构成犯罪的处十至十五日拘留。"},{"id":"Q0020","cat":"法律法规与职业道德","g":"消防法-拘留","t":"s","stem":"在火灾发生后阻拦报警，尚不构成犯罪的，可以处（　）。","opts":["五日以下拘留","警告","一千元以下罚款","十日以上十五日以下拘留"],"ans":3,"exp":"阻拦报警属消防法第六十四条列举情形，处十至十五日拘留可并处罚款。"},{"id":"Q0021","cat":"法律法规与职业道德","g":"消防法-拘留","t":"s","stem":"指使或者强令他人违反消防安全规定冒险作业，尚不构成犯罪的，应当（　）。","opts":["处十日以上十五日以下拘留","处警告","处二千元以下罚款","责令停产停业"],"ans":0,"exp":"该行为列入消防法第六十四条， ,"ans":2,"exp":"三提示包括提示火灾危险性、逃生路线与安全出口位置、器材位置及使用方法。"},{"id":"Q1707","cat":"法律法规与职业道德","g":"判-消防方针","t":"j","stem":"消防工作贯彻预防为主、防消结合的方针。","opts":["正确","错误"],"ans":0,"exp":"预防为主、防消结合是我国消防工作的基本方针，写入消防法总则。"},{"id":"Q1708","cat":"法律法规与职业道德","g":"判-工作原则","t":"j","stem":"消防工作坚持部门统一领导、单位依法监管、公民积极参与的原则。","opts":["正确","错误"],"ans":1,"exp":"应为政府统一领导、部门依法监管、单位全面负责、公民积极参与。"},{"id":"Q1709","cat":"法律法规与职业道德","g":"判-监管主体","t":"j","stem":"公安机关对全国的消防工作实施监督管理。","opts":["正确","错误"],"ans":1,"exp":"机构改革后由国务院应急管理部门对全国消防工作实施监督管理。"},{"id":"Q1710","cat":"法律法规与职业道德","g":"判-安全责任人","t":"j","stem":"非法人单位的主要负责人不是本单位的消防安全责任人。","opts":["正确","错误"],"ans":1,"exp":"法人单位的法定代表人或非法人单位的主要负责人是消防安全责任人。"},{"id":"Q1711","cat":"法律法规与职业道德","g":"判-安全管理人","t":"j","stem":"消防安全重点单位可以不设消防安全管理人。","opts":["正确","错误"],"ans":1,"exp":"消防安全重点单位应当确定消防安全管理人，负责日常消防安全管理。"},{"id":"Q1712","cat":"法律法规与职业道德","g":"判-防火巡查","t":"j","stem":"其他单位应当至少每月进行一次防火巡查。","opts":["正确","错误"],"ans":1,"exp":"消防安全重点单位每日巡查，其他单位至少每季度一次防火巡查。"},{"id":"Q1713","cat":"法律法规与职业道德","g":"判-防火巡查","t":"j","stem":"消防安全重点单位应当每日进行防火巡查。","opts":["正确","错误"],"ans":0,"exp":"重点单位火灾风险高，巡查频次按每日一次执行。"},{"id":"Q1714","cat":"法律法规与职业道德","g":"判-消防演练","t":"j","stem":"其他单位应当至少每季度组织一次灭火和应急疏散演练。","opts":["正确","错误"],"ans":1,"exp":"其他单位每年至少组织一次演练，每季度一次要求过高。"},{"id":"Q1715","cat":"法律法规与职业道德","g":"判-报警义务","t":"j","stem":"任何人发现火灾都应当立即报警。","opts":["正确","错误"],"ans":0,"exp":"报警义务是法定义务，任何单位和个人都不得阻拦报警。"},{"id":"Q1716","cat":"法律法规与职业道德","g":"判-报警义务","t":"j","stem":"单位发生火灾应先自行扑救，扑救不成功再报警。","opts":["正确","错误"],"ans":1,"exp":"发生火灾应立即报警，同时组织扑救，不得等扑救失败再报警。"},{"id":"Q1717","cat":"法律法规与职业道德","g":"判-上岗培训","t":"j","stem":"单位应当对新上岗和进入新岗位的员工进行上岗前的消防安全培训。","opts":["正确","错误"],"ans":0,"exp":"上岗前培训是员工掌握岗位消防技能的必要环节。"},{"id":"Q1718","cat":"法律法规与职业道德","g":"判-消防检测","t":"j","stem":"单位应当每年至少对建筑消防设施进行一次全面检测。","opts":["正确","错误"],"ans":0,"exp":"年度全面检测可委托具备条件的机构实施，记录应存档备查。"},{"id":"Q1719","cat":"法律法规与职业道德","g":"判-控制室值班","t":"j","stem":"消防控制室应实行每日24h值班制度，每班值班人员不应少于2人。","opts":["正确","错误"],"ans":0,"exp":"24h双人值班才能保证报警处置和操作互相配合。"},{"id":"Q1720","cat":"法律法规与职业道德","g":"判-持证上岗","t":"j","stem":"消防设施操作员可以先上岗值班，随后再取得职业资格证书。","opts":["正确","错误"],"ans":1,"exp":"消防设施操作员属准入类职业，必须持证上岗。"},{"id":"Q1721","cat":"法律法规与职业道德","g":"判-罚款单位","t":"j","stem":"损坏、挪用或者擅自拆除、停用消防设施的，责令改正，处五千元以上五万元以下罚款。","opts":["正确","错误"],"ans":0,"exp":"该行为属消防法规定的违法行为，对单位按五千至五万元处罚。"},{"id":"Q1722","cat":"法律法规与职业道德","g":"判-罚款单位","t":"j","stem":"占用、堵塞、封闭疏散通道的，处五百元以上五千元以下罚款。","opts":["正确","错误"],"ans":1,"exp":"对单位应处五千元以上五万元以下罚款，五百至五千元是个人罚款幅度。"},{"id":"Q1723","cat":"法律法规与职业道德","g":"判-谎报火警","t":"j","stem":"谎报火警的，处警告、罚款或者十日以下拘留。","opts":["正确","错误"],"ans":0,"exp":"谎报火警浪费救援力量，消防法规定了拘留等处罚。"},{"id":"Q1724","cat":"法律法规与职业道德","g":"判-过失火灾","t":"j","stem":"过失引起火灾尚不构成犯罪的，处十日以上十五日以下拘留，可以并处五百元以下罚款。","opts":["正确","错误"],"ans":0,"exp":"过失引起火灾未构成犯罪的，按消防法给予拘留并可并处罚款。"},{"id":"Q1725","cat":"法律法规与职业道德","g":"判-明火作业","t":"j","stem":"禁止在具有火灾、爆炸危险的场所吸烟、使用明火。","opts":["正确","错误"],"ans":0,"exp":"此类场所使用明火极易引发爆炸燃烧，属禁止性规定。"},{"id":"Q1726","cat":"法律法规与职业道德","g":"判-明火作业","t":"j","stem":"电焊、气焊等具有火灾危险作业的人员，经单位内部培训后即可上岗。","opts":["正确","错误"],"ans":1,"exp":"此类作业人员必须持证上岗，内部培训不能替代特种作业资格。"},{"id":"Q1727","cat":"法律法规与职业道德","g":"判-设计审查","t":"j","stem":"建设工程消防设计审查验收由公安机关消防机构负责。","opts":["正确","错误"],"ans":1,"exp":"现由住房和城乡建设主管部门负责消防设计审查和验收。"},{"id":"Q1728","cat":"法律法规与职业道德","g":"判-职业守则","t":"j","stem":"消防设施操作员应当遵守遵纪守法、诚实守信、爱岗敬业、钻研业务的职业守则。","opts":["正确","错误"],"ans":0,"exp":"职业守则是本职业从业人员的基本行为规范。"},{"id":"Q1729","cat":"法律法规与职业道德","g":"判-值班纪律","t":"j","stem":"值班期间遇有个人事务，值班人员可以短时间离岗处理。","opts":["正确","错误"],"ans":1,"exp":"值班期间不得擅自离岗、脱岗，否则发生火警将无人处置。"},{"id":"Q1911","cat":"法律法规与职业道德","g":"多-方针原则","t":"m","stem":"我国消防工作贯彻的方针和原则包括（　）。","opts":["预防为主、防消结合的方针","政府统一领导、部门依法监管","单位全面负责、公民积极参与","以救为主、防消结合的方针"],"ans":[0,1,2],"exp":"消防法第二条规定方针为预防为主、防消结合，原则为政府统一领导、部门依法监管、单位全面负责、公民积极参与；D错。"},{"id":"Q1912","cat":"法律法规与职业道德","g":"多-方针原则","t":"m","stem":"消防法规定，任何单位和个人都有的义务包括（　）。","opts":["维护消防安全","保护消防设施","预防火灾、报告火警","参加有组织的灭火工作"],"ans":[0,1,2],"exp":"前三项任何单位和个人都有；参加有组织灭火工作的义务限于单位和成年人，未成年人除外，D错。"},{"id":"Q1913","cat":"法律法规与职业道德","g":"多-单位职责","t":"m","stem":"机关、团体、企业、事业等单位应履行的消防安全职责包括（　）。","opts":["落实消防安全责任制，制定消防安全制度和操作规程","按国家标准配置消防设施器材并定期检验维修","每两年对建筑消防设施进行一次全面检测","对全体职工每月组织一次消防演练"],"ans":[0,1],"exp":"消防法第十六条要求每年至少一次全面检测，C的两年错；演练按预案定期组织，每月一次无依据，D错。"},{"id":"Q1914","cat":"法律法规与职业道德","g":"多-单位职责","t":"m","stem":"属于消防法第十六条规定的单位职责有（　）。","opts":["保障疏散通道、安全出口、消防车通道畅通","组织防火检查，及时消除火灾隐患","组织进行有针对性的消防演练","设立本单位的消防技术服务机构"],"ans":[0,1,2],"exp":"前三项均为第十六条职责；委托技术服务机构是可选做法，不是必须自设机构，D错。"},{"id":"Q1915","cat":"法律法规与职业道德","g":"多-单位职责","t":"m","stem":"同一建筑物由两个以上单位管理或使用时，正确的做法有（　）。","opts":["各自管理各自区域，共用部位不再确定责任人","明确各方的消防安全责任","确定责任人对共用的疏散通道、安全出口统一管理","确定责任人对共用消防设施、消防车通道统一管理"],"ans":[1,2,3],"exp":"消防法第十八条要求明确各方责任，并对共用疏散通道、出口、设施和车道统一管理；A违反该条。"},{"id":"Q1916","cat":"法律法规与职业道德","g":"多-重点单位","t":"m","stem":"消防安全重点单位确定后，应当（　）。","opts":["向当地消防救援机构备案","确定消防安全管理人组织实施管理","对职工进行岗前消防安全培训","每季度向消防救援机构报告消防工作情况"],"ans":[0,1,2],"exp":"重点单位应备案、确定管理人、开展岗前培训与定期演练；按季报告无法律规定，D错。"},{"id":"Q1917","cat":"法律法规与职业道德","g":"多-禁止行为","t":"m","stem":"下列行为中，违反消防法第二十八条规定的有（　）。","opts":["擅自拆除消防设施","埋压、圈占、遮挡消火栓","在消防车通道上停放私家车","定期对灭火器进行维修"],"ans":[0,1,2],"exp":"前三项分别属擅自拆除消防设施、遮挡消火栓、占用消防车通道，均违法；定期维修灭火器是应尽义务，D错。"},{"id":"Q1918","cat":"法律法规与职业道德","g":"多-禁止行为","t":"m","stem":"关于明火作业和持证上岗，符合消防法规定的有（　）。","opts":["电焊、气焊等具有火灾危险作业的人员必须持证上岗","自动消防系统的操作人员可由经口头交代的临时工担任","禁止在具有火灾、爆炸危险的场所吸烟、使用明火","因施工需使用明火作业的，应事先办理审批手续"],"ans":[0,2,3],"exp":"第二十一条规定禁火、明火审批和持证上岗；自动消防系统操作人员必须持证上岗，B错。"},{"id":"Q1919","cat":"法律法规与职业道德","g":"多-报警义务","t":"m","stem":"关于火灾报警，符合消防法规定的有（　）。","opts":["任何人发现火灾都应当立即报警","任何单位、个人都应当无偿为报警提供便利","严禁谎报火警","发现火灾应先报告领导，由领导决定是否报警"],"ans":[0,1,2],"exp":"第四十四条规定立即报警、无偿提供便利、严禁谎报；层层请示会延误报警，D错。"},{"id":"Q1920","cat":"法律法规与职业道德","g":"多-报警义务","t":"m","stem":"火灾现场总指挥根据扑救需要有权决定的事项包括（　）。","opts":["使用各种水源","截断电力、可燃气体和可燃液体的输送","划定警戒区，实行局部交通管制","命令周边居民承担灭火救援费用"],"ans":[0,1,2],"exp":"前三项为第四十五条赋予火灾现场总指挥的权力；灭火救援费用不向居民摊派，D错。"},{"id":"Q1921","cat":"法律法规与职业道德","g":"多-处罚规定","t":"m","stem":"消防法规定，尚不构成犯罪时可处拘留的行为有（　）。","opts":["指使或者强令他人违反消防安全规定，冒险作业","过失引起火灾","火灾发生后阻拦报警","定期组织消防演练"],"ans":[0,1,2],"exp":"第六十四条对前三项行为规定可处拘留并处罚款；组织演练是法定义务，D不会受罚。"},{"id":"Q1922","cat":"法律法规与职业道德","g":"多-处罚规定","t":"m","stem":"单位有下列行为之一的，责令改正并处五千元以上五万元以下罚款（　）。","opts":["消防设施、器材未保持完好有效","占用、堵塞、封闭疏散通道、安全出口","埋压、圈占、遮挡消火栓","按规定每年开展一次全面检测"],"ans":[0,1,2],"exp":"第六十条对前三项行为规定责令改正并处五千元以上五万元以下罚款；依法检测是应尽义务，D不属处罚情形。"},{"id":"Q1923","cat":"法律法规与职业道德","g":"多-单位检查演练","t":"m","stem":"按照机关团体企业事业单位消防安全管理规定，正确的有（　）。","opts":["其他单位应至少每月进行一次防火检查","重点单位应至少每半年组织一次灭火和应急疏散演练","所有单位均应至少每季度组织一次演练","消防安全重点单位应每日进行防火巡查"],"ans":[0,1,3],"exp":"61号令规定重点单位每日巡查、其他单位每月防火检查、重点单位至少每半年演练一次；季度演练无此要求，C错。"},{"id":"Q1924","cat":"法律法规与职业道德","g":"多-单位检查演练","t":"m","stem":"灭火和应急疏散预案演练应包括的内容有（　）。","opts":["火灾事故经济损失评估","报警和接警处置程序","应急疏散的组织程序和措施","扑救初起火灾的程序和措施"],"ans":[1,2,3],"exp":"预案含报警接警、疏散组织、初起火灾扑救、通讯联络与安全防护等；损失评估属火灾调查，A错。"},{"id":"Q1925","cat":"法律法规与职业道德","g":"多-职业道德","t":"m","stem":"消防设施操作员应遵守的职业道德规范包括（　）。","opts":["遵纪守法、爱岗敬业","诚实守信、服务群众","钻研业务、精益求精","按客户要求隐瞒消防设施故障"],"ans":[0,1,2],"exp":"职业道德要求遵纪守法、爱岗敬业、诚实守信、钻研业务等；隐瞒故障违背职业操守和法律规定，D错。"},{"id":"Q1926","cat":"法律法规与职业道德","g":"多-职业道德","t":"m","stem":"值班中体现职业责任的做法有（　）。","opts":["如实填写值班和检查记录","发现隐患及时报告并处置","为图省事将控制器长期置于手动状态","严格执行操作规程"],"ans":[0,1,3],"exp":"严守规程、如实记录、及时报告处置是职业责任；长期手动会使联动功能失效，C属违规。"},{"id":"Q1927","cat":"法律法规与职业道德","g":"多-职业资格","t":"m","stem":"关于消防设施操作员职业资格，正确的有（　）。","opts":["中级对应国家职业资格四级","取得证书后无需参加继续教育","属于消防行业特有职业","共设五个等级"],"ans":[0,2,3],"exp":"该职业设五级至一级共五个等级，中级即四级；持证后仍需按规定参加继续教育，B错。"},{"id":"Q2645","cat":"法律法规与职业道德","g":"判2-法规-方针原则","t":"j","stem":"消防工作实行预防为主、防消结合的方针，按照谁主管、谁负责和谁受益、谁负担的原则开展。","opts":["正确","错误"],"ans":1,"exp":"方针无误，但消防法规定的原则是政府统一领导、部门依法监管、单位全面负责、公民积极参与。"},{"id":"Q2646","cat":"法律法规与职业道德","g":"判2-法规-责任人","t":"j","stem":"单位的主要负责人是本单位的消防安全责任人，对本单位的消防安全工作全面负责。","opts":["正确","错误"],"ans":0,"exp":"主要负责人即法定代表人或实际控制人，是法定的消防安全责任人。"},{"id":"Q2647","cat":"法律法规与职业道德","g":"判2-法规-管理人","t":"j","stem":"消防安全管理人由当地消防救援机构指定，并直接对消防救援机构负责。","opts":["正确","错误"],"ans":1,"exp":"管理人由本单位消防安全责任人确定，对责任人负责，消防救援机构只依法监督。"},{"id":"Q2648","cat":"法律法规与职业道德","g":"判2-法规-重点单位备案","t":"j","stem":"消防安全重点单位应当确定消防安全管理人，并将责任人、管理人报当地消防救援机构备案。","opts":["正确","错误"],"ans":0,"exp":"重点单位须确定管理人并报备，便于消防救援机构实施重点监管。"},{"id":"Q2649","cat":"法律法规与职业道德","g":"判2-法规-重点单位巡查","t":"j","stem":"非消防安全重点单位无需开展防火巡查，只需每年组织一次防火检查即可。","opts":["正确","错误"],"ans":1,"exp":"重点单位每日巡查，其他单位也应组织巡查，并按月或按季开展防火检查。"},{"id":"Q2650","cat":"法律法规与职业道德","g":"判2-法规-巡查频次","t":"j","stem":"商场在营业高峰时段的防火巡查，其间隔时间最长不得超过两小时。","opts":["正确","错误"],"ans":0,"exp":"公众聚集场所营业期间至少每两小时巡查一次，营业结束还应检查现场。"},{"id":"Q2651","cat":"法律法规与职业道德","g":"判2-法规-巡查频次","t":"j","stem":"医院、养老院、寄宿制学校、托儿所、幼儿园应当加强夜间防火巡查。","opts":["正确","错误"],"ans":0,"exp":"此类场所人员行动能力弱，规范要求重点加强夜间巡查。"},{"id":"Q2652","cat":"法律法规与职业道德","g":"判2-法规-巡查记录","t":"j","stem":"防火巡查记录只需巡查人员签名，不需要主管人员签字确认。","opts":["正确","错误"],"ans":1,"exp":"巡查人员和主管人员都应在记录上签名，才能体现逐级负责。"},{"id":"Q2653","cat":"法律法规与职业道德","g":"判2-法规-防火检查","t":"j","stem":"某事业单位的防火检查记录显示其每季度检查一次，这一频次符合规定要求。","opts":["正确","错误"],"ans":0,"exp":"机关、团体、事业单位至少每季度一次；企业等其他单位应至少每月一次。"},{"id":"Q2654","cat":"法律法规与职业道德","g":"判2-法规-防火检查","t":"j","stem":"防火检查应当填写检查记录，检查人员和被检查部门负责人应当在记录上签名。","opts":["正确","错误"],"ans":0,"exp":"检查记录要双签，既查问题也明确整改责任部门。"},{"id":"Q2655","cat":"法律法规与职业道德","g":"判2-法规-防火检查","t":"j","stem":"防火巡查和防火检查内容相同，已做巡查的单位可以不再组织防火检查。","opts":["正确","错误"],"ans":1,"exp":"巡查侧重当场纠正违章，检查更全面，二者不能相互替代。"},{"id":"Q2656","cat":"法律法规与职业道德","g":"判2-法规-演练频次","t":"j","stem":"消防安全重点单位的演练频次要求高于一般单位，前者每半年不少于一次。","opts":["正确","错误"],"ans":0,"exp":"重点单位每半年、其他单位每年至少一次，演练后还应总结完善预案。"},{"id":"Q2657","cat":"法律法规与职业道德","g":"判2-法规-演练频次","t":"j","stem":"消防演练的频次要求对所有单位一律相同，均为每年至少组织一次。","opts":["正确","错误"],"ans":1,"exp":"重点单位须每半年一次，只有其他单位才是每年至少一次。"},{"id":"Q2658","cat":"法律法规与职业道德","g":"判2-法规-设施年检","t":"j","stem":"单位应当对建筑消防设施每年至少进行一次全面检测，检测记录应完整准确、存档备查。","opts":["正确","错误"],"ans":0,"exp":"这是消防法规定的单位法定职责，检测记录须存档备查。"},{"id":"Q2659","cat":"法律法规与职业道德","g":"判2-法规-设施年检","t":"j","stem":"建筑消防设施经消防验收合格后，投入使用期间可以不再进行年度检测。","opts":["正确","错误"],"ans":1,"exp":"验收只反映初始状态，使用中设施会老化，仍须每年检测一次。"},{"id":"Q2660","cat":"法律法规与职业道德","g":"判2-法规-罚则单位","t":"j","stem":"某商场擅自停用火灾自动报警系统，消防救援机构可依法对其处五千元以上五万元以下罚款。","opts":["正确","错误"],"ans":0,"exp":"擅自停用消防设施适用五千元至五万元罚款，消防法第六十条有明确规定。"},{"id":"Q2661","cat":"法律法规与职业道德","g":"判2-法规-罚则单位","t":"j","stem":"某单位堵塞疏散通道被责令改正后拒不改正，强制清除所需费用应由消防救援机构列支。","opts":["正确","错误"],"ans":1,"exp":"强制执行费用由违法行为人承担，执法机关不负担该费用。"},{"id":"Q2662","cat":"法律法规与职业道德","g":"判2-法规-罚则单位","t":"j","stem":"单位埋压、圈占、遮挡消火栓的，最高可以处五十万元罚款。","opts":["正确","错误"],"ans":1,"exp":"该行为适用五千元以上五万元以下罚款，五十万元没有法律依据。"},{"id":"Q2663","cat":"法律法规与职业道德","g":"判2-法规-个人罚则","t":"j","stem":"个人占用、堵塞、封闭疏散通道、安全出口的，处警告或者五百元以下罚款。","opts":["正确","错误"],"ans":0,"exp":"对个人的这类行为，消防法规定警告或者五百元以下罚款。"},{"id":"Q2664","cat":"法律法规与职业道德","g":"判2-法规-个人罚则","t":"j","stem":"个人在具有火灾、爆炸危险的场所吸烟、使用明火，情节严重的可处五日以下拘留。","opts":["正确","错误"],"ans":0,"exp":"消防法第六十三条规定，情节严重时可处五日以下拘留。"},{"id":"Q2665","cat":"法律法规与职业道德","g":"判2-法规-临时查封","t":"j","stem":"消防救援机构发现火灾隐患不及时消除可能严重威胁公共安全的，可对危险部位或场所临时查封。","opts":["正确","错误"],"ans":0,"exp":"消防法第五十四条赋予消防救援机构临时查封的职权。"},{"id":"Q2666","cat":"法律法规与职业道德","g":"判2-法规-火灾调查","t":"j","stem":"火灾扑灭后，消防救援机构有权根据需要封闭火灾现场，调查火灾原因、统计火灾损失。","opts":["正确","错误"],"ans":0,"exp":"封闭现场、调查原因、统计损失都是消防救援机构的法定职责。"},{"id":"Q2667","cat":"法律法规与职业道德","g":"判2-法规-火灾调查","t":"j","stem":"火灾现场的保护范围由起火单位自行划定，其他单位和个人不得擅自进入。","opts":["正确","错误"],"ans":1,"exp":"保护范围由消防救援机构根据需要划定，起火单位应配合保护现场。"},{"id":"Q2668","cat":"法律法规与职业道德","g":"判2-法规-火灾等级","t":"j","stem":"造成10人以上30人以下死亡，或者5000万元以上1亿元以下直接财产损失的火灾属于重大火灾。","opts":["正确","错误"],"ans":0,"exp":"重大火灾还含50人以上100人以下重伤的情形，注意与较大火灾区分。"},{"id":"Q2669","cat":"法律法规与职业道德","g":"判2-法规-火灾等级","t":"j","stem":"某起火灾造成5人死亡、直接财产损失2000万元，按等级划分应定为重大火灾。","opts":["正确","错误"],"ans":1,"exp":"5人死亡、2000万元损失属于较大火灾；重大火灾为10人以上30人以下死亡。"},{"id":"Q2670","cat":"法律法规与职业道德","g":"判2-法规-火灾等级","t":"j","stem":"造成30人以上死亡，或者100人以上重伤的火灾属于特别重大火灾。","opts":["正确","错误"],"ans":0,"exp":"特别重大火灾还包括1亿元以上直接财产损失的情形。"},{"id":"Q2671","cat":"法律法规与职业道德","g":"判2-法规-责任制","t":"j","stem":"地方各级人民政府主要负责人对本行政区域内的消防工作负全面领导责任。","opts":["正确","错误"],"ans":0,"exp":"消防安全责任制实施办法明确政府主要负责人为消防工作第一责任人。"},{"id":"Q2672","cat":"法律法规与职业道德","g":"判2-法规-责任制","t":"j","stem":"行业主管部门只在火灾事故发生后参与调查，平时不承担本行业的消防安全监管职责。","opts":["正确","错误"],"ans":1,"exp":"部门依法监管是消防工作原则，行业主管部门负有日常监管职责。"},{"id":"Q2673","cat":"法律法规与职业道德","g":"判2-法规-设计审查","t":"j","stem":"特殊建设工程的消防设计未经依法审查或者审查不合格的，建设、施工单位不得施工。","opts":["正确","错误"],"ans":0,"exp":"消防设计审查是施工的前置条件，未经审查合格不得开工。"},{"id":"Q2674","cat":"法律法规与职业道德","g":"判2-法规-设计审查","t":"j","stem":"依法应当进行消防验收的建设工程，可以先投入使用，再补办消防验收手续。","opts":["正确","错误"],"ans":1,"exp":"未经消防验收或者验收不合格的禁止投入使用，不存在先使用后补办。"},{"id":"Q2675","cat":"法律法规与职业道德","g":"判2-法规-消防产品","t":"j","stem":"国内销售的消防产品，有国家标准就必须执行国家标准，无国标时才执行行业标准。","opts":["正确","错误"],"ans":0,"exp":"消防产品实行标准准入，国标优先、行业标准补充，禁止销售不合格产品。"},{"id":"Q2676","cat":"法律法规与职业道德","g":"判2-法规-消防产品","t":"j","stem":"新研制且尚无国家、行业标准的消防产品，只要企业自检合格即可生产销售。","opts":["正确","错误"],"ans":1,"exp":"此类产品须按规定经技术鉴定符合消防安全要求后方可生产、销售、使用。"},{"id":"Q2677","cat":"法律法规与职业道德","g":"判2-法规-报警义务","t":"j","stem":"任何单位、个人都应当有偿为火灾报警提供便利，不得阻拦报警。","opts":["正确","错误"],"ans":1,"exp":"法律规定是无偿提供便利，收费报警违法，且严禁谎报火警。"},{"id":"Q2678","cat":"法律法规与职业道德","g":"判2-法规-报警义务","t":"j","stem":"发现火灾后及时报警是每个公民的法定义务，报假警则要承担法律责任。","opts":["正确","错误"],"ans":0,"exp":"报警义务法定，谎报火警扰乱秩序，将依法受到处罚。"},{"id":"Q2679","cat":"法律法规与职业道德","g":"判2-法规-专职消防队","t":"j","stem":"生产、储存易燃易爆危险品的大型企业应当建立单位专职消防队。","opts":["正确","错误"],"ans":0,"exp":"消防法列举了应当建立专职消防队的单位类型，此类大型企业属其一。"},{"id":"Q2680","cat":"法律法规与职业道德","g":"判2-法规-志愿消防队","t":"j","stem":"志愿消防队只能由消防救援机构组建，单位不得自行建立。","opts":["正确","错误"],"ans":1,"exp":"单位、村委会、居委会可根据需要建立志愿消防队等多种形式的消防组织。"},{"id":"Q2681","cat":"法律法规与职业道德","g":"判2-法规-动火作业","t":"j","stem":"在人员密集场所营业期间进行电焊等明火作业，应办理动火审批并采取相应消防安全措施。","opts":["正确","错误"],"ans":0,"exp":"明火作业须先审批、再作业，并落实现场看护等防范措施。"},{"id":"Q2682","cat":"法律法规与职业道德","g":"判2-法规-动火作业","t":"j","stem":"因施工需要动用明火时，只要作业人员持有操作证，就可以不办理审批手续。","opts":["正确","错误"],"ans":1,"exp":"持证只说明操作资格，明火作业仍须办理动火审批手续。"},{"id":"Q2683","cat":"法律法规与职业道德","g":"判2-法规-大型活动","t":"j","stem":"举办大型群众性活动，承办人应当依法向消防救援机构申请安全许可。","opts":["正确","错误"],"ans":1,"exp":"安全许可向公安机关申请，消防救援机构负责活动场所的消防监督检查。"},{"id":"Q2684","cat":"法律法规与职业道德","g":"判2-法规-处罚种类","t":"j","stem":"消防行政处罚种类包括警告、罚款、责令停产停业、暂扣或吊销许可证以及行政拘留等。","opts":["正确","错误"],"ans":0,"exp":"这些是消防执法中常见的处罚种类，由消防救援机构依法适用。"},{"id":"Q2685","cat":"法律法规与职业道德","g":"判2-法规-处罚程序","t":"j","stem":"消防救援机构作出行政处罚后，才需要告知当事人处罚的事实、理由和依据。","opts":["正确","错误"],"ans":1,"exp":"告知应在作出处罚决定之前进行，否则属于程序违法。"},{"id":"Q2686","cat":"法律法规与职业道德","g":"判2-法规-隐患整改","t":"j","stem":"对不能当场整改的火灾隐患，应当确定整改措施、期限和整改部门、人员，并落实整改资金。","opts":["正确","错误"],"ans":0,"exp":"重大隐患整改要做到措施、期限、责任、资金四落实。"},{"id":"Q2687","cat":"法律法规与职业道德","g":"判2-法规-隐患整改","t":"j","stem":"火灾隐患未消除前，单位一律应当停产停业，不得采取临时防范措施。","opts":["正确","错误"],"ans":1,"exp":"应先落实临时防范措施；只有不能确保消防安全时才停产停业整改。"},{"id":"Q2688","cat":"法律法规与职业道德","g":"判2-法规-责任划分","t":"j","stem":"同一建筑物由两个以上单位管理或使用的，应明确各方消防安全责任，并对共用疏散通道统一管理。","opts":["正确","错误"],"ans":0,"exp":"多单位共用建筑须分清责任，共用疏散设施由确定的责任人统一管理。"},{"id":"Q2689","cat":"法律法规与职业道德","g":"判2-法规-责任划分","t":"j","stem":"实行承包、租赁或者委托经营时，产权单位无需在合同中明确各方的消防安全责任。","opts":["正确","错误"],"ans":1,"exp":"61号令要求合同中明确各方消防责任，产权单位还应提供符合要求的建筑。"},{"id":"Q2690","cat":"法律法规与职业道德","g":"判2-法规-消防档案","t":"j","stem":"消防安全重点单位应当建立健全消防档案，档案内容发生变化时应及时更新。","opts":["正确","错误"],"ans":0,"exp":"消防档案应详实、附必要图表，并随单位情况变化及时更新。"},{"id":"Q2691","cat":"法律法规与职业道德","g":"判2-法规-消防档案","t":"j","stem":"消防档案只需保存消防安全管理情况，不包括消防安全基本情况。","opts":["正确","错误"],"ans":1,"exp":"消防档案由消防安全基本情况和消防安全管理情况两部分组成。"},{"id":"Q2692","cat":"法律法规与职业道德","g":"判2-法规-培训对象","t":"j","stem":"消防控制室值班操作人员只要经过单位内部培训，就不必接受消防安全专门培训。","opts":["正确","错误"],"ans":1,"exp":"责任人、管理人、专兼职消防管理人员和值班操作人员都应接受专门培训。"},{"id":"Q2693","cat":"法律法规与职业道德","g":"判2-法规-职业等级","t":"j","stem":"取得四级职业资格的人员，在消防设施操作员序列中属于中级工。","opts":["正确","错误"],"ans":0,"exp":"该序列五级为初级、四级为中级、三级为高级，再往上为技师、高级技师。"},{"id":"Q2694","cat":"法律法规与职业道德","g":"判2-法规-职业等级","t":"j","stem":"消防设施操作员职业共设初级、中级、高级三个等级。","opts":["正确","错误"],"ans":1,"exp":"该职业共设五个等级，高级之上还有技师和高级技师。"},{"id":"Q2695","cat":"法律法规与职业道德","g":"判2-法规-职业方向","t":"j","stem":"消防设施操作员分为消防设施监控操作和消防设施检测维修保养两个职业方向。","opts":["正确","错误"],"ans":0,"exp":"两个方向分别对应值守操作与检测维保岗位，考核内容不同。"},{"id":"Q2696","cat":"法律法规与职业道德","g":"判2-法规-职业道德","t":"j","stem":"消防设施操作员值班期间可以兼做与值班无关的事务，只要不影响报警处置即可。","opts":["正确","错误"],"ans":1,"exp":"值班须坚守岗位、专心值守，兼做无关事务违反职业守则。"},{"id":"Q2697","cat":"法律法规与职业道德","g":"判2-法规-职业道德","t":"j","stem":"如实记录值班情况和设备故障，不隐瞒、不伪造，是诚实守信职业道德的具体体现。","opts":["正确","错误"],"ans":0,"exp":"记录真实是职业底线，隐瞒故障可能直接导致火警延误。"},{"id":"Q2698","cat":"法律法规与职业道德","g":"判2-法规-职业道德","t":"j","stem":"消防设施操作员发现火灾隐患后，可以先观察一段时间，确定危险后再上报。","opts":["正确","错误"],"ans":1,"exp":"发现隐患应立即报告并处置，拖延报告违背忠于职守的要求。"},{"id":"Q2792","cat":"法律法规与职业道德","g":"法-适用范围","t":"s","stem":"《中华人民共和国劳动法》适用于中华人民共和国境内的企业与（　）之间形成的劳动关系。","opts":["国家机关公务员","现役军人","与之形成劳动关系的劳动者","个体经营者本人"],"ans":2,"exp":"劳动法适用于境内企业、个体经济组织与劳动者形成的劳动关系，公务员和军人适用其他规定。"},{"id":"Q2793","cat":"法律法规与职业道德","g":"法-合同形式","t":"s","stem":"建立劳动关系应当订立劳动合同，劳动合同应当以（　）形式订立。","opts":["书面","口头","书面或口头","公证"],"ans":0,"exp":"劳动法要求劳动合同以书面形式订立，口头约定不利于明确双方权利义务，易引发争议。"},{"id":"Q2794","cat":"法律法规与职业道德","g":"法-合同期限","t":"s","stem":"劳动合同的期限分为固定期限、无固定期限和（　）三种。","opts":["试用期","实习期","短期用工","以完成一定工作为期限"],"ans":3,"exp":"合同期限分为固定期限、无固定期限和以完成一定工作为期限三类，试用期不是期限种类。"},{"id":"Q2795","cat":"法律法规与职业道德","g":"法-必备条款","t":"m","stem":"订立劳动合同，下列属于劳动合同必备条款的有（　）。","opts":["劳动合同期限","劳动保护和劳动条件","劳动报酬","职工个人兴趣爱好"],"ans":[0,1,2],"exp":"必备条款含合同期限、工作内容、劳动保护和劳动条件、劳动报酬、劳动纪律等，个人爱好不属合同内容。"},{"id":"Q2796","cat":"法律法规与职业道德","g":"法-试用期","t":"s","stem":"劳动合同中约定的试用期，最长不得超过（　）。","opts":["三个月","六个月","一年","两年"],"ans":1,"exp":"劳动法规定试用期最长不得超过六个月，且试用期包含在劳动合同期限内。"},{"id":"Q2797","cat":"法律法规与职业道德","g":"法-试用期","t":"j","stem":"劳动合同可以约定试用期，试用期最长不得超过六个月，且试用期属于劳动合同期限的组成部分。","opts":["正确","错误"],"ans":0,"exp":"试用期上限为六个月，并且包含在合同期限内，不能脱离合同期限单独计算。"},{"id":"Q2798","cat":"法律法规与职业道德","g":"法-标准工时","t":"s","stem":"国家实行劳动者每日工作时间不超过（　）的标准工时制度。","opts":["六小时","八小时","十小时","十二小时"],"ans":1,"exp":"标准工时制度规定劳动者每日工作不超过八小时，每周工作时间另有法定上限。"},{"id":"Q2799","cat":"法律法规与职业道德","g":"法-延长工时","t":"s","stem":"用人单位由于生产经营需要延长工作时间，一般每日不得超过（　）。","opts":["一小时","两小时","三小时","四小时"],"ans":0,"exp":"延长工时须与工会和劳动者协商，一般每日不超过一小时，特殊原因下不超过三小时。"},{"id":"Q2800","cat":"法律法规与职业道德","g":"法-延长工时","t":"s","stem":"用人单位因特殊原因需要延长工作时间的，在保障劳动者身体健康的条件下，每月累计不得超过（　）。","opts":["二十四小时","三十六小时","四十八小时","六十小时"],"ans":1,"exp":"特殊原因下每日延长不超过三小时，每月累计不得超过三十六小时，超出即属违法。"},{"id":"Q2801","cat":"法律法规与职业道德","g":"法-休息休假","t":"s","stem":"用人单位应当保证劳动者每周至少休息（　）。","opts":["半日","一日","两日","三日"],"ans":1,"exp":"劳动法规定每周至少休息一日，即每周应有一个完整的休息日，不得连续安排工作。"},{"id":"Q2802","cat":"法律法规与职业道德","g":"法-加班工资","t":"m","stem":"用人单位安排劳动者加班，下列支付工资报酬的标准正确的有（　）。","opts":["延长工作时间支付不低于150%的工资报酬","休息日工作又不能补休支付不低于200%的工资报酬","法定休假日工作支付不低于300%的工资报酬","休息日工作又不能补休支付不低于150%的工资报酬"],"ans":[0,1,2],"exp":"延长工时150%、休息日200%、法定休假日300%；休息日按150%支付不符合规定，应补休或按200%支付。"},{"id":"Q2803","cat":"法律法规与职业道德","g":"法-加班工资","t":"s","stem":"用人单位安排劳动者在法定休假日工作的，应支付不低于工资（　）的工资报酬。","opts":["100%","150%","200%","300%"],"ans":3,"exp":"法定休假日加班按300%支付；休息日加班且不能安排补休的按200%支付，两者不可混淆。"},{"id":"Q2804","cat":"法律法规与职业道德","g":"法-工资支付","t":"j","stem":"工资应当以货币形式按月支付给劳动者本人，不得克扣或者无故拖欠劳动者的工资。","opts":["正确","错误"],"ans":0,"exp":"工资须以货币形式按月支付给劳动者本人，克扣或无故拖欠均属违法行为。"},{"id":"Q2805","cat":"法律法规与职业道德","g":"法-工资原则","t":"s","stem":"工资分配应当遵循按劳分配原则，实行（　）。","opts":["同工同酬","按资分配","平均分配","按需分配"],"ans":0,"exp":"劳动法规定工资分配遵循按劳分配、同工同酬原则，并实行最低工资保障制度。"},{"id":"Q2806","cat":"法律法规与职业道德","g":"法-女职工","t":"m","stem":"根据劳动法对女职工的特殊保护规定，下列做法正确的有（　）。","opts":["安排女职工从事第四级体力劳动强度劳动","不得安排女职工从事矿山井下劳动","孕期七个月以上不得延长工时和夜班","哺乳未满一周岁婴儿期间不得延长工时和夜班"],"ans":[1,2,3],"exp":"女职工禁忌从事矿山井下和第四级体力劳动强度劳动；孕期七个月以上、哺乳未满一周岁婴儿期间不得延长工时和安排夜班。"},{"id":"Q2807","cat":"法律法规与职业道德","g":"法-女职工","t":"s","stem":"对怀孕七个月以上的女职工，用人单位不得安排其（　）。","opts":["从事办公室工作","参加安全培训","从事技术管理工作","延长工作时间和夜班劳动"],"ans":3,"exp":"孕期七个月以上属重点保护对象，禁止安排延长工作时间和夜班劳动，以保障母婴安全。"},{"id":"Q2808","cat":"法律法规与职业道德","g":"法-未成年工","t":"s","stem":"劳动法所称未成年工，是指年满十六周岁未满（　）的劳动者。","opts":["十七周岁","十八周岁","二十周岁","二十二周岁"],"ans":1,"exp":"未成年工为年满十六周岁未满十八周岁的劳动者，与禁止招用的童工概念不同。"},{"id":"Q2809","cat":"法律法规与职业道德","g":"法-未成年工","t":"j","stem":"禁止用人单位招用未满十六周岁的未成年人，任何单位在任何情况下均不得例外。","opts":["正确","错误"],"ans":1,"exp":"文艺、体育和特种工艺单位经批准可以招用未满十六周岁的未成年人，但须保障其接受义务教育。"},{"id":"Q2810","cat":"法律法规与职业道德","g":"法-社会保险","t":"m","stem":"劳动者在下列哪些情形下依法享受社会保险待遇（　）。","opts":["退休","因工伤残或者患职业病","购买商业保险","失业"],"ans":[0,1,3],"exp":"社会保险待遇情形包括退休、患病、负伤、因工伤残或患职业病、失业、生育；商业保险不属社会保险。"},{"id":"Q2811","cat":"法律法规与职业道德","g":"法-劳动争议","t":"s","stem":"发生劳动争议，当事人向人民法院提起诉讼前必须经过的法定程序是（　）。","opts":["单位内部调解","工会协商","劳动争议仲裁","行政信访"],"ans":2,"exp":"劳动争议实行仲裁前置，对仲裁裁决不服的，才可依法向人民法院提起诉讼。"},{"id":"Q2812","cat":"法律法规与职业道德","g":"法-职教地位","t":"s","stem":"《中华人民共和国职业教育法》明确，职业教育是与普通教育具有（　）的教育类型。","opts":["同等重要地位","从属地位","辅助地位","补充地位"],"ans":0,"exp":"职业教育法规定职业教育是与普通教育同等重要的教育类型，而非普通教育的附属或补充。"},{"id":"Q2813","cat":"法律法规与职业道德","g":"法-职教体系","t":"s","stem":"职业教育包括（　）两部分。","opts":["初等教育和高等教育","学历教育和学位教育","职业学校教育和职业培训","岗前教育和脱产教育"],"ans":2,"exp":"职业教育由职业学校教育和职业培训构成，两者并重，共同服务技能人才培养。"},{"id":"Q2814","cat":"法律法规与职业道德","g":"法-职教体系","t":"m","stem":"关于现代职业教育体系，下列说法正确的有（　）。","opts":["职业学校教育和职业培训并重","职业教育只面向在校学生","职业教育与普通教育相互融通","不同层次职业教育有效贯通"],"ans":[0,2,3],"exp":"现代职教体系强调两类教育并重、与普通教育融通、层次间有效贯通并服务全民终身学习，不只面向在校生。"},{"id":"Q2815","cat":"法律法规与职业道德","g":"法-职教学段","t":"s","stem":"职业学校教育分为（　）。","opts":["初等、中等、高等三级","职业初中和职业高中","学历教育和非学历教育","中等职业学校教育、高等职业学校教育"],"ans":3,"exp":"职业学校教育分为中等和高等两个层次，分别由中等职业学校和高等职业学校实施。"},{"id":"Q2816","cat":"法律法规与职业道德","g":"法-企业培训","t":"s","stem":"企业应当根据本单位实际，有计划地对（　）实施职业教育。","opts":["仅正式在编职工","本单位的职工和准备录用的人员","仅管理人员","仅新入职的高校毕业生"],"ans":1,"exp":"企业职工培训的对象包括在职职工和准备录用的人员，这是法律规定的企业义务。"},{"id":"Q2817","cat":"法律法规与职业道德","g":"法-企业培训","t":"m","stem":"企业实施职业教育可以采取下列哪些方式（　）。","opts":["单独举办职业学校或职业培训机构","联合举办职业学校或职业培训机构","委托学校或职业培训机构实施","以缴纳罚款替代职工培训"],"ans":[0,1,2],"exp":"企业可单独或联合办学，也可委托培训；缴费不能替代培训义务，未履行义务的还应承担相应责任。"},{"id":"Q2818","cat":"法律法规与职业道德","g":"法-教育经费","t":"j","stem":"企业应当按照国家有关规定提取和使用职工教育经费，用于对本单位职工和准备录用人员的职业教育。","opts":["正确","错误"],"ans":0,"exp":"职工教育经费的提取和使用是企业的法定义务，应专款用于职工职业教育与技能培训。"},{"id":"Q2819","cat":"法律法规与职业道德","g":"法-证书制度","t":"s","stem":"接受职业学校学校教育的学生经考核合格，按照国家有关规定发给（　）。","opts":["学历证书","培训证书","岗位聘书","职业介绍信"],"ans":0,"exp":"职业学 体物质火灾属于A类","液体或可熔化固体物质火灾属于B类","气体火灾属于C类","带电火灾属于D类"],"ans":[0,1,2],"exp":"六类火灾中A为固体、B为液体或可熔化固体、C为气体、D为金属、E为带电、F为烹饪物；带电火灾属E类，D错。"},{"id":"Q1979","cat":"燃烧与火灾基础","g":"多-火灾分类","t":"m","stem":"关于灭火的基本方法，正确的有（　）。","opts":["冷却法：降低燃烧物温度至着火点以下","隔离法：将可燃物与着火源隔开","窒息法：降低氧浓度使燃烧停止","催化法：加入催化剂加速燃烧"],"ans":[0,1,2],"exp":"灭火四法为冷却、隔离、窒息和化学抑制；加速燃烧反应与灭火目的相反，D错。"},{"id":"Q1980","cat":"燃烧与火灾基础","g":"多-热传播","t":"m","stem":"火灾中热量传播的方式有（　）。","opts":["热对流","热辐射","热分解","热传导"],"ans":[0,1,3],"exp":"热传播有传导、对流、辐射三种方式；热分解是燃烧中的化学反应，不是传热方式，C错。"},{"id":"Q1981","cat":"燃烧与火灾基础","g":"多-热传播","t":"m","stem":"建筑物内火灾蔓延的途径主要有（　）。","opts":["建筑外墙的装饰线条","内墙门、洞口","楼板上的孔洞和竖井","闷顶和通风管道"],"ans":[1,2,3],"exp":"火灾通过门洞、楼板孔洞、竖井、闷顶、通风管道和外墙窗口等蔓延；装饰线条不是主要蔓延途径，A错。"},{"id":"Q2208","cat":"燃烧与火灾基础","g":"多2-燃烧-燃烧条件","t":"m","stem":"关于可燃物与助燃物，下列表述正确的有（　）。","opts":["凡能与氧或其他氧化剂起燃烧反应的物质均为可燃物","助燃物是能与可燃物发生氧化反应的氧化剂","可燃物只能是固体和液体","着火源只能是明火"],"ans":[0,1],"exp":"可燃物含气体、液体和固体；着火源包括明火、高温、电火花等，故C、D错。"},{"id":"Q2209","cat":"燃烧与火灾基础","g":"多2-燃烧-燃烧类型","t":"m","stem":"关于闪燃，下列表述正确的有（　）。","opts":["闪燃是可燃液体表面挥发的蒸气发生的一闪即灭的燃烧","闪燃往往是着火的前兆","闪燃发生时的最低温度称为燃点","闪燃只发生在可燃气体中"],"ans":[0,1],"exp":"闪燃发生时对应的最低温度为闪点而非燃点；闪燃主要发生在液体表面，故C、D错。"},{"id":"Q2210","cat":"燃烧与火灾基础","g":"多2-燃烧-燃烧类型","t":"m","stem":"关于着火与自燃，下列表述正确的有（　）。","opts":["着火是可燃物质被点燃后能持续燃烧的现象","自燃是可燃物质在没有外部火源作用下自行燃烧","自燃可分为受热自燃和自热自燃","着火时环境温度必须达到100℃以上"],"ans":[0,1,2],"exp":"着火无100℃这一门槛，不同物质燃点差异很大，D错。"},{"id":"Q2211","cat":"燃烧与火灾基础","g":"多2-燃烧-闪点","t":"m","stem":"关于常见液体的闪点，下列表述正确的有（　）。","opts":["汽油的闪点低于0℃","苯的闪点低于28℃","乙醇的闪点低于28℃","煤油的闪点低于28℃"],"ans":[0,1,2],"exp":"煤油闪点约在28℃至45℃之间，属乙类液体，D错。"},{"id":"Q2212","cat":"燃烧与火灾基础","g":"多2-燃烧-闪点","t":"m","stem":"按闪点判定液体火灾危险性，下列表述正确的有（　）。","opts":["闪点小于28℃的液体属甲类","闪点28℃至60℃的液体属乙类","闪点为65℃的液体属乙类","闪点为10℃的液体属丙类"],"ans":[0,1],"exp":"65℃已达丙类界限，10℃属甲类，故C、D错。"},{"id":"Q2213","cat":"燃烧与火灾基础","g":"多2-燃烧-燃点","t":"m","stem":"关于自燃点，下列表述正确的有（　）。","opts":["自燃点越低，物质自燃危险性越大","自燃点不受压力、浓度等因素影响","自燃点是不需外部火源即可自行燃烧的最低温度","自燃点越高越容易自燃"],"ans":[0,2],"exp":"自燃点受压力、浓度、散热条件影响；自燃点越低越 爆炸浓度"],"ans":[0,2,3],"exp":"沉积粉尘本身不会爆炸，须被扬起形成粉尘云才可能爆炸，B错。"},{"id":"Q2224","cat":"燃烧与火灾基础","g":"多2-燃烧-灭火原理","t":"m","stem":"灭火的基本原理有（　）。","opts":["冷却","加热","隔离","窒息"],"ans":[0,2,3],"exp":"灭火原理为冷却、窒息、隔离和化学抑制；加热会促进燃烧，不是灭火原理，B错。"},{"id":"Q2225","cat":"燃烧与火灾基础","g":"多2-燃烧-灭火原理","t":"m","stem":"关于窒息灭火，下列表述正确的有（　）。","opts":["降低燃烧区氧浓度可窒息灭火","窒息法适用于自身能供给氧气的物质","二氧化碳灭火兼有降低氧浓度和少量冷却作用","用不燃或难燃材料覆盖燃烧物可隔绝空气"],"ans":[0,2,3],"exp":"自身含氧的物质（如硝酸纤维素）不能用窒息法扑救，B错。"},{"id":"Q2226","cat":"燃烧与火灾基础","g":"多2-燃烧-灭火原理","t":"m","stem":"关于化学抑制灭火，下列表述正确的有（　）。","opts":["化学抑制法只能用于固体火灾","化学抑制对深位火灾效果较好","卤代烷灭火剂主要靠化学抑制作用","干粉灭火剂中的组分可中断燃烧链式反应"],"ans":[2,3],"exp":"化学抑制对深位火灾效果差；该法可用于多种火灾，故B、A错。"},{"id":"Q2227","cat":"燃烧与火灾基础","g":"多2-燃烧-灭火剂","t":"m","stem":"关于水和泡沫灭火剂的适用，下列表述正确的有（　）。","opts":["水不宜直接扑救带电设备火灾","泡沫可用于扑救带电设备火灾","蛋白泡沫不宜用于扑救醇类火灾","水不宜扑救遇水反应放出可燃气体或热量的物质"],"ans":[0,2,3],"exp":"泡沫导电，不宜用于带电设备火灾，B错。"},{"id":"Q2228","cat":"燃烧与火灾基础","g":"多2-燃烧-灭火剂","t":"m","stem":"关于干粉和二氧化碳灭火剂，下列表述正确的有（　）。","opts":["二氧化碳不导电，可用于带电设备火灾","二氧化碳适用于扑救活泼金属火灾","干粉可扑救多种类别的火灾","二氧化碳在人员密集的密闭场所大量使用有窒息风险"],"ans":[0,2,3],"exp":"二氧化碳不能扑救活泼金属火灾，B错；其余三项均符合其性能特点。"},{"id":"Q2229","cat":"燃烧与火灾基础","g":"多2-燃烧-烟气","t":"m","stem":"火灾烟气的主要危害有（　）。","opts":["缺氧窒息","烟气可提高现场能见度","有毒气体中毒","高温灼伤"],"ans":[0,2,3],"exp":"烟气会降低能见度、妨碍疏散，C表述与事实相反。"},{"id":"Q2230","cat":"燃烧与火灾基础","g":"多2-燃烧-烟气","t":"m","stem":"关于火灾烟气中的有毒成分，下列表述正确的有（　）。","opts":["一氧化碳是火灾中最主要的窒息性有毒气体","二氧化碳完全无毒且不参与危害","烟气毒性是火灾致死的主要原因之一","含氮物质燃烧可产生氰化氢"],"ans":[0,2,3],"exp":"二氧化碳浓度过高会加剧缺氧并刺激呼吸，并非完全无害，B错。"},{"id":"Q2491","cat":"燃烧与火灾基础","g":"判2-燃烧-充分条件","t":"j","stem":"燃烧只要具备可燃物和着火源两个条件，即可持续进行。","opts":["正确","错误"],"ans":1,"exp":"还必须有助燃物，三者达到一定浓度和能量并相互作用才能持续燃烧。"},{"id":"Q2492","cat":"燃烧与火灾基础","g":"判2-燃烧-液体分级","t":"j","stem":"闪点低于28℃的可燃液体属于甲类火灾危险性液体。","opts":["正确","错误"],"ans":0,"exp":"甲类液体闪点小于28℃，乙类为28℃至60℃，丙类为60℃及以上。"},{"id":"Q2493","cat":"燃烧与火灾基础","g":"判2-燃烧-闪点规律","t":"j","stem":"可燃液体的闪点越高，越容易挥发出爆炸性混合气体。","opts":["正确","错误"],"ans":1,"exp":"闪点越低说明越易挥发，闪点高反而更安全，二者关系不能颠倒。"},{"id":"Q2494","cat":"燃烧与火灾基础","g":"判2-燃烧-燃点闪点","t":"j","stem":"可燃液体的燃点一般高于其闪点。","opts":["正确","错误"],"ans":0,"exp":"闪点是发生一闪即灭燃烧的温度，燃点是持续燃烧的温度，燃点高于闪点。"},{"id":"Q2495","cat":"燃烧与火灾基础","g":"判2-燃烧-自燃点","t":"j","stem":"可燃液体的自燃点越高，越容易发生自燃。","opts":["正确","错误"],"ans":1,"exp":"自燃点越低越易自燃，高热设备附近应避免存放低自燃点油品。"},{"id":"Q2496","cat":"燃烧与火灾基础","g":"判2-燃烧-本身自燃","t":"j","stem":"潮湿的稻草、棉籽堆积发热后起火，属于本身自燃。","opts":["正确","错误"],"ans":0,"exp":"微生物发酵或自身氧化放热蓄积引起，属本身自燃，与受热自燃不同。"},{"id":"Q2497","cat":"燃烧与火灾基础","g":"判2-燃烧-阴燃","t":"j","stem":"阴燃是有明显火焰但燃烧速度较慢的一种燃烧形式。","opts":["正确","错误"],"ans":1,"exp":"阴燃没有可见火焰，是缓慢的深位燃烧，易被忽视后突然转为明火。"},{"id":"Q2498","cat":"燃烧与火灾基础","g":"判2-燃烧-C类","t":"j","stem":"C类火灾指甲烷、乙炔、氢气等可燃气体燃烧的火灾。","opts":["正确","错误"],"ans":0,"exp":"C类为气体火灾，B类是液体或可熔化固体火灾，二者常被混淆。"},{"id":"Q2499","cat":"燃烧与火灾基础","g":"判2-燃烧-D类","t":"j","stem":"D类火灾指钾、钠、镁、铝粉等金属燃烧的火灾。","opts":["正确","错误"],"ans":0,"exp":"金属火灾需用专用金属火灾灭火剂，不能用水或普通干粉扑救。"},{"id":"Q2500","cat":"燃烧与火灾基础","g":"判2-燃烧-E类","t":"j","stem":"E类火灾指烹饪器具内动植物油脂燃烧的火灾。","opts":["正确","错误"],"ans":1,"exp":"这属于F类火灾；E类专指带电物体燃烧的火灾。"},{"id":"Q2501","cat":"燃烧与火灾基础","g":"判2-燃烧-F类","t":"j","stem":"F类火灾指带电物体燃烧的火灾。","opts":["正确","错误"],"ans":1,"exp":"带电火灾属E类，F类专指烹饪器具内的烹饪物火灾。"},{"id":"Q2502","cat":"燃烧与火灾基础","g":"判2-燃烧-较大火灾","t":"j","stem":"较大火灾是指造成3人以上10人以下死亡，或者10人以上50人以下重伤的火灾。","opts":["正确","错误"],"ans":0,"exp":"较大火灾对应3至10人死亡、10至50人重伤或1000万至5000万元直接财产损失。"},{"id":"Q2503","cat":"燃烧与火灾基础","g":"判2-燃烧-热对流","t":"j","stem":"热对流是建筑火灾中烟气蔓延的主要方式。","opts":["正确","错误"],"ans":0,"exp":"高温烟气靠浮力沿竖井、走道流动，是烟气扩散的主要原因。"},{"id":"Q2504","cat":"燃烧与火灾基础","g":"判2-燃烧-热辐射介质","t":"j","stem":"热辐射必须依靠空气等介质才能把热量传给相邻建筑。","opts":["正确","错误"],"ans":1,"exp":"热辐射以电磁波传播，不需要介质，可在真空中传递热量。"},{"id":"Q2505","cat":"燃烧与火灾基础","g":"判2-燃烧-竖井蔓延","t":"j","stem":"贯通各层的竖向管道井不会加快火灾和烟气的蔓延。","opts":["正确","错误"],"ans":1,"exp":"竖井形成烟囱效应，是火灾竖向蔓延的主要途径，必须逐层封堵。"},{"id":"Q2506","cat":"燃烧与火灾基础","g":"判2-燃烧-爆炸威力","t":"j","stem":"可燃气体与空气混合后，在爆炸极限内任意浓度下爆炸的威力都相同。","opts":["正确","错误"],"ans":1,"exp":"爆炸威力与混合浓度有关，各浓度下反应速度和压力升高值不同，并非完全相同。"},{"id":"Q2507","cat":"燃烧与火灾基础","g":"判2-燃烧-爆炸下限","t":"j","stem":"可燃气体爆炸下限越低，越容易形成爆炸性混合气体。","opts":["正确","错误"],"ans":0,"exp":"下限低意味着少量泄漏即可达到爆炸浓度，故危险性更高。"},{"id":"Q2508","cat":"燃烧与火灾基础","g":"判2-燃烧-粉尘条件","t":"j","stem":"可燃粉尘悬浮并达到爆炸浓度且存在点火源时，可能发生粉尘爆炸。","opts":["正确","错误"],"ans":0,"exp":"粉尘须悬浮成云并落在爆炸极限内，堆积在地面的粉尘本身不会直接爆炸。"},{"id":"Q2509","cat":"燃烧与火灾基础","g":"判2-燃烧-粉尘二次","t":"j","stem":"粉尘爆炸通常只发生一次，不会出现二次或多次爆炸。","opts":["正确","错误"],"ans":1,"exp":"首次爆炸扬起积尘，常引发威力更大的二次爆炸。"},{"id":"Q2510","cat":"燃烧与火灾基础","g":"判2-燃烧-冷却","t":"j","stem":"用水扑救火灾主要依靠冷却作用，使燃烧物温度降到燃点以下。","opts":["正确","错误"],"ans":0,"exp":"水的比热容和汽化潜热大，冷却效果显著，是主要灭火机理。"},{"id":"Q2511","cat":"燃烧与火灾基础","g":"判2-燃烧-窒息","t":"j","stem":"用泡沫覆盖燃烧物表面，主要是通过冷却作用灭火。","opts":["正确","错误"],"ans":1,"exp":"泡沫主要靠覆盖隔绝空气实现窒息灭火，冷却只是次要作用。"},{"id":"Q2512","cat":"燃烧与火灾基础","g":"判2-燃烧-隔离","t":"j","stem":"关闭阀门切断可燃气体来源，属于隔离灭火法。","opts":["正确","错误"],"ans":0,"exp":"隔离法是把可燃物与火源分开或移走，切断气源是典型应用。"},{"id":"Q2513","cat":"燃烧与火灾基础","g":"判2-燃烧-化学抑制","t":"j","stem":"干粉灭火剂能中断燃烧的链式反应，属于化学抑制灭火。","opts":["正确","错误"],"ans":0,"exp":"干粉中的抑制剂捕捉燃烧自由基，使链式反应中断。"},{"id":"Q2514","cat":"燃烧与火灾基础","g":"判2-燃烧-水禁用","t":"j","stem":"普通水可以直接用于扑救带电设备火灾和钾、钠等金属火灾。","opts":["正确","错误"],"ans":1,"exp":"水导电且与活泼金属反应放出氢气，这两类火灾严禁用水扑救。"},{"id":"Q2515","cat":"燃烧与火灾基础","g":"判2-燃烧-沸溢","t":"j","stem":"重质油品储罐火灾不会发生沸溢，扑救人员可以靠近罐壁作业。","opts":["正确","错误"],"ans":1,"exp":"重油含水可能沸溢或喷溅，扑救时应与罐壁保持安全距离。"},{"id":"Q2516","cat":"燃烧与火灾基础","g":"判2-燃烧-气体燃烧形式","t":"j","stem":"可燃气体与空气预先混合后再燃烧的形式称为预混燃烧。","opts":["正确","错误"],"ans":0,"exp":"预混燃烧速度快、易回火；边混合边燃烧的形式是扩散燃烧。"},{"id":"Q2517","cat":"燃烧与火灾基础","g":"判2-燃烧-烟气危害","t":"j","stem":"火灾中人员伤亡主要来自火焰的直接烧伤，而不是烟气。","opts":["正确","错误"],"ans":1,"exp":"火灾死亡多数因烟气中毒和窒息，烟气的危害远大于火焰本身。"},{"id":"Q2518","cat":"燃烧与火灾基础","g":"判2-燃烧-轰燃","t":"j","stem":"轰燃发生时室内几乎所有可燃物同时燃烧，温度急剧升高。","opts":["正确","错误"],"ans":0,"exp":"轰燃标志火灾进入全面发展阶段，此后室内难以生存。"},{"id":"Q2519","cat":"燃烧与火灾基础","g":"判2-燃烧-回燃","t":"j","stem":"通风不良房间内积聚的可燃烟气突然引燃并喷出火焰，称为回燃。","opts":["正确","错误"],"ans":0,"exp":"回燃多发生在缺氧燃烧的密闭空间开门进风瞬间，对消防员威胁极大。"},{"id":"Q2520","cat":"燃烧与火灾基础","g":"判2-燃烧-完全燃烧","t":"j","stem":"可燃物完全燃烧的产物只有二氧化碳，不会产生水蒸气。","opts":["正确","错误"],"ans":1,"exp":"含氢可燃物完全燃烧还生成水蒸气，产物并非只有二氧化碳。"},{"id":"Q2521","cat":"燃烧与火灾基础","g":"判2-燃烧-不完全燃烧","t":"j","stem":"可燃物不完全燃烧会产生一氧化碳等有毒气体。","opts":["正确","错误"],"ans":0,"exp":"供氧不足时碳燃烧不充分生成一氧化碳，是烟气中毒的主要成分。"},{"id":"Q2522","cat":"燃烧与火灾基础","g":"判2-燃烧-三要素","t":"j","stem":"燃烧的三个基本条件中只要具备其中两个，燃烧即可持续进行。","opts":["正确","错误"],"ans":1,"exp":"三个条件必须同时具备并相互作用，缺一不可。"},{"id":"Q2523","cat":"燃烧与火灾基础","g":"判2-燃烧-蔓延途径","t":"j","stem":"火灾可经楼板孔洞、竖井和管道向上下层及相邻房间蔓延。","opts":["正确","错误"],"ans":0,"exp":"孔洞和管道是火灾蔓延的薄弱环节，应做好封堵和防火分隔。"},{"id":"Q2524","cat":"燃烧与火灾基础","g":"判2-燃烧-物理爆炸","t":"j","stem":"物理爆炸的过程中伴随着物质的化学反应。","opts":["正确","错误"],"ans":1,"exp":"物理爆炸由压力急剧变化引起，没有化学反应，如锅炉爆炸。"},{"id":"Q2525","cat":"燃烧与火灾基础","g":"判2-燃烧-链式反应","t":"j","stem":"燃烧的链式反应被中断后，燃烧就会停止。","opts":["正确","错误"],"ans":0,"exp":"化学抑制灭火正是通过捕捉自由基、中断链式反应来实现的。"},{"id":"Q2950","cat":"燃烧与火灾基础","g":"基-产物-CO机理","t":"s","stem":"火灾中一氧化碳致人中毒死亡的主要机理是（　）。","opts":["强烈刺激呼吸道黏膜引起肺水肿","溶于血液形成酸腐蚀血管","与血红蛋白结合使其失去输氧能力","直接麻痹呼吸中枢使其停止"],"ans":2,"exp":"一氧化碳与血红蛋白的结合力远大于氧，形成碳氧血红蛋白使血液失去输氧能力。"},{"id":"Q2951","cat":"燃烧与火灾基础","g":"基-产物-CO₂危害","t":"s","stem":"二氧化碳在火灾中对人员的主要危害是（　）。","opts":["本身剧毒，微量吸入即中毒","与血红蛋白结合造成缺氧","浓度高时排挤氧气使人窒息","遇热分解产生大量有毒气体"],"ans":2,"exp":"二氧化碳本身无毒，但火场中浓度升高会降低氧含量，导致人员窒息。"},{"id":"Q2952","cat":"燃烧与火灾基础","g":"基-产物-烟尘","t":"s","stem":"火灾烟尘除降低能见度外，对人员的另一主要危害是（　）。","opts":["直接引燃人员衣物","使空气湿度急剧升高","中和火场中的有毒气体","刺激眼睛和呼吸道造成损伤"],"ans":3,"exp":"烟尘颗粒会刺激眼结膜和呼吸道黏膜，高温烟尘还可灼伤呼吸道。"},{"id":"Q2953","cat":"燃烧与火灾基础","g":"基-产物-缺氧","t":"s","stem":"火场中人员发生缺氧窒息的主要原因是（　）。","opts":["空气中氮气含量急剧升高","燃烧消耗氧气并产生大量烟气","水蒸气蒸发带走大量氧气","烟气使空气密度明显增大"],"ans":1,"exp":"燃烧不断消耗空气中的氧，同时烟气充斥空间，使氧含量下降导致窒息。"},{"id":"Q2954","cat":"燃烧与火灾基础","g":"基-产物-高温","t":"s","stem":"火灾烟气温度过高对人员造成的直接伤害是（　）。","opts":["使人体温下降导致休克","造成听力严重损伤","使血液黏度明显升高","灼伤皮肤和呼吸道引起水肿"],"ans":3,"exp":"高温烟气可灼伤皮肤和呼吸道黏膜，引起喉头水肿、窒息，是火场致死原因之一。"},{"id":"Q2955","cat":"燃烧与火灾基础","g":"基-产物-水蒸气","t":"s","stem":"燃烧产物中的高温水蒸气对人员的危害是（　）。","opts":["能帮助稀释有毒气体","可 宅属二类高层住宅，A错。"},{"id":"Q1871","cat":"建筑防火","g":"多-防火分区面积","t":"m","stem":"一、二级耐火等级民用建筑防火分区的最大允许建筑面积，符合规定的有（　）。","opts":["单、多层建筑每个防火分区2500m²","高层建筑每个防火分区1500m²","地下或半地下建筑每个防火分区1000m²","设自动灭火系统后可增至规定值的1.5倍"],"ans":[0,1],"exp":"地下或半地下建筑每个防火分区500m²，1000m²是地下设备用房的规定，C错；设自动灭火系统可增加一倍，D错。"},{"id":"Q1872","cat":"建筑防火","g":"多-防火分区面积","t":"m","stem":"关于防火分区的划分，正确的有（　）。","opts":["设置自动灭火系统的防火分区面积可增加一倍","应采用防火墙、防火卷帘等防火分隔设施分隔","防火分区面积应按建筑面积计算","只能水平划分，不能竖向划分"],"ans":[0,1,2],"exp":"防火分区按建筑面积计算，设自动灭火系统可加倍；既可水平也可竖向划分，D错。"},{"id":"Q1873","cat":"建筑防火","g":"多-防火间距","t":"m","stem":"一、二级耐火等级民用建筑之间的防火间距，符合规定的有（　）。","opts":["多层与多层之间不应小于6m","高层与多层之间不应小于13m","高层与高层之间不应小于13m","高层与多层之间不应小于9m"],"ans":[0,2,3],"exp":"GB50016规定高层对高层13m、高层对多层9m、多层对多层6m；B把数值混用。"},{"id":"Q1874","cat":"建筑防火","g":"多-防火间距","t":"m","stem":"关于防火间距的减小，正确的有（　）。","opts":["两座建筑相邻较高一面外墙为防火墙时，防火间距不限","相邻建筑通过连廊连接时，防火间距不应小于本表规定","建筑高度大于100m时防火间距仍不应减小","成组布置的住宅建筑可不受防火间距限制"],"ans":[0,1,2],"exp":"前三项符合GB50016注的规定；住宅成组布置仍有层数和高度限制，D错。"},{"id":"Q1875","cat":"建筑防火","g":"多-消防车道","t":"m","stem":"消防车道的设置，符合规定的有（　）。","opts":["净宽度和净空高度均不应小于4m","坡度不应大于5%","转弯半径应满足消防车转弯的要求","可兼作绿化带且不作硬化处理"],"ans":[0,2],"exp":"消防车道坡度不应大于8%，B的5%错；未硬化的绿化带不能通行消防车，D错。"},{"id":"Q1876","cat":"建筑防火","g":"多-消防车道","t":"m","stem":"关于消防车道的布置，正确的有（　）。","opts":["环形消防车道至少应有两处与其他车道连通","尽头式消防车道应设置回车道或回车场","回车场面积不宜小于12m×12m","消防车道净空高度不应小于3m"],"ans":[0,1,2],"exp":"环形车道至少两处连通、尽头式设回车场、面积12m×12m；净空高度应不小于4m，D错。"},{"id":"Q1877","cat":"建筑防火","g":"多-消防车道","t":"m","stem":"下列建筑或场所应设置环形消防车道的有（　）。","opts":["高层民用建筑","超过2000个座位的体育馆","占地面积大于3000m²的商店建筑","建筑面积500m²的幼儿园"],"ans":[0,2],"exp":"高层民用建筑、占地大于3000m²的商店应设环形车道；体育馆门槛为3000座，B的2000座错；小型幼儿园无需，D错。"},{"id":"Q1878","cat":"建筑防火","g":"多-救援场地","t":"m","stem":"消防救援场地的设置，符合规定的有（　）。","opts":["长度和宽度分别不应小于15m和10m","建筑高度大于50m时分别不应小于20m和10m","场地坡度不宜大于8%","场地边缘距建筑外墙不宜小于5m且不宜大于10m"],"ans":[0,1,3],"exp":"场地15m×10m、超50m时20m×10m，距外墙5m至10m；场地坡度不宜大于3%，C错。"},{"id":"Q1879","cat":"建筑防火","g":"多-救援场地","t":"m","stem":"关于消防救援场地和救援窗口，正确的有（　）。","opts":["救援窗口间距不宜大于30m","场地 电气消防","g":"判-高温灯具","t":"j","stem":"白炽灯、卤钨灯等高温灯具不应直接安装在可燃构件上。","opts":["正确","错误"],"ans":0,"exp":"高温灯具表面温度可达数百度，直接安装易烤燃可燃物。"},{"id":"Q1793","cat":"电气消防","g":"判-测温探测器","t":"j","stem":"测温式电气火灾监控探测器应设置在电缆接头、端子等发热部位。","opts":["正确","错误"],"ans":0,"exp":"接头和端子是接触电阻最大的部位，最易发热起火。"},{"id":"Q1794","cat":"电气消防","g":"判-临时用电","t":"j","stem":"施工现场临时用电应采用TN-S接零保护系统。","opts":["正确","错误"],"ans":0,"exp":"TN-S系统工作零线与保护零线分开，可减少触电和火灾风险。"},{"id":"Q1795","cat":"电气消防","g":"判-监控设置","t":"j","stem":"电气火灾监控设备应设置在高压配电室内。","opts":["正确","错误"],"ans":1,"exp":"应设置在消防控制室内或有人值班的场所，便于及时处置报警。"},{"id":"Q1796","cat":"电气消防","g":"判-线路选择","t":"j","stem":"消防配电线路可以采用普通聚氯乙烯绝缘导线直接明敷。","opts":["正确","错误"],"ans":1,"exp":"普通导线不耐火，明敷应采用金属导管保护并选用阻燃或耐火线缆。"},{"id":"Q1957","cat":"电气消防","g":"多-消防电源","t":"m","stem":"关于消防用电设备的供电，正确的有（　）。","opts":["消防配电干线宜按防火分区划分","消防配电支线宜穿越防火分区","应采用专用的供电回路","生产、生活用电被切断时仍应保证消防用电"],"ans":[0,2,3],"exp":"消防用电专用回路、切断非消防电源后仍供电、干线按防火分区划分；支线不宜穿越防火分区，B错。"},{"id":"Q1958","cat":"电气消防","g":"多-消防电源","t":"m","stem":"属于消防用电设备的有（　）。","opts":["消防水泵","消防电梯","防烟排烟风机","办公区空调机组"],"ans":[0,1,2],"exp":"消防水泵、消防电梯、防烟排烟风机属消防用电设备；空调机组为非消防负荷，火灾时应切断，D错。"},{"id":"Q1959","cat":"电气消防","g":"多-配电线路敷设","t":"m","stem":"消防配电线路的敷设，符合规定的有（　）。","opts":["暗敷应穿金属管，保护层厚度不小于30mm","明敷时可穿硬质塑料管保护","金属导管或槽盒应采取防火保护措施","可与普通配电线路同槽盒敷设"],"ans":[0,2],"exp":"明敷应穿金属导管或封闭式金属槽盒，B的塑料管错；同槽盒敷设会在火灾时失效，D错。"},{"id":"Q1960","cat":"电气消防","g":"多-配电线路敷设","t":"m","stem":"关于消防用电设备配电线路的保护，正确的有（　）。","opts":["消防水泵的配电回路不应设置过负荷保护切断电路","消防用电设备配电回路不应设剩余电流保护装置","宜采用普通聚氯乙烯绝缘电线","应设漏电保护并在火灾时自动切断消防电源"],"ans":[0,1],"exp":"应采用阻燃或阻燃耐火类电缆，C的普通电线错；火灾时切断消防电源，D错。"},{"id":"Q1961","cat":"电气消防","g":"多-电气火灾监控","t":"m","stem":"电气火灾监控系统的组成包括（　）。","opts":["消防联动控制器","电气火灾监控器","剩余电流式电气火灾监控探测器","测温式电气火灾监控探测器"],"ans":[1,2,3],"exp":"系统由监控器、剩余电流式和测温式探测器组成；消防联动控制器属火灾报警系统，A错。"},{"id":"Q1962","cat":"电气消防","g":"多-变配电室","t":"m","stem":"关于变配电室的设置，正确的有（　）。","opts":["疏散门应直通室外或安全出口","可设在歌舞厅的上一层","不应设在人员密集场所的上方、下方、贴邻及出口两旁","应用2.00h防火隔墙和1.50h楼板分隔"],"ans":[0,2,3],"exp":"变配电室不得贴邻或上下人员密集场所，应采用规定耐火极限的分隔，疏散门直通室外或安全出口；B错。"},{"id":"Q1963","cat":"电气消防","g":"多-变配电室","t":"m","stem":"变压器室、锅炉房的设置要求包括（　）。","opts":["不应设在人员密集场所的上一层、下一层或贴邻","应设在首层或地下一层靠外墙部位","疏散门应直通室外或安全出口","可设在疏散楼梯间内"],"ans":[0,1,2],"exp":"锅炉房、变压器室不得与人员密集场所上下层或贴邻，应设在首层或地下一层靠外墙；设在楼梯间内会阻塞疏散，D错。"},{"id":"Q1964","cat":"电气消防","g":"多-用电防火","t":"m","stem":"电气线路引起火灾的常见原因有（　）。","opts":["过载","接触电阻过大","线路额定电压偏低","短路"],"ans":[0,1,3],"exp":"短路、过载、接触不良和漏电是电气火灾的常见原因；额定电压偏低不是起火的直接原因，C错。"},{"id":"Q1965","cat":"电气消防","g":"多-用电防火","t":"m","stem":"预防电气火灾的措施包括（　）。","opts":["在配电箱内堆放易燃杂物以防潮","按负荷选择导线截面并设置保护","线路接头采用压接或焊接并做好绝缘","电热设备与可燃物保持安全距离"],"ans":[1,2,3],"exp":"合理选线、可靠接头、保持防火间距是预防措施；配电箱内堆放易燃物会增大火灾风险，A错。"},{"id":"Q2082","cat":"电气消防","g":"多2-电气-负荷分级对象","t":"m","stem":"按现行规范，消防用电必须按一级负荷供电的建筑有（　）。","opts":["粮食仓库","建筑高度大于50m的乙、丙类厂房","一类高层民用建筑","二类高层民用建筑"],"ans":[1,2],"exp":"高度大于50m的乙丙类厂房和一类高层按一级负荷；二类高层与粮食仓库按二级负荷供电。"},{"id":"Q2083","cat":"电气消防","g":"多2-电气-负荷分级依据","t":"m","stem":"划分消防用电负荷等级时，主要依据包括（　）。","opts":["装修造价标准","火灾危险性类别","建筑的规模","建筑的使用性质"],"ans":[1,2,3],"exp":"负荷等级由使用性质、火灾危险性类别和建筑规模确定，与装修造价无关；等级不同则电源要求不同。"},{"id":"Q2084","cat":"电气消防","g":"多2-电气-一级负荷要求","t":"m","stem":"一级负荷的供电要求包括（　）。","opts":["应由两个电源供电","一个电源故障时另一个不应同时损坏","可采用单回路专线供电","两个电源可取自同一台变压器"],"ans":[0,1],"exp":"一级负荷须两个相互独立的电源，且故障不同时发生；单回路或同一台变压器均不满足要求。"},{"id":"Q2085","cat":"电气消防","g":"多2-电气-一级负荷要求","t":"m","stem":"一级负荷中特别重要的负荷，供电还应满足（　）。","opts":["应急电源取自普通插座回路","应急电源可采用独立于正常电源的发电机组","严禁将其他负荷接入应急供电回路","增设应急电源"],"ans":[1,2,3],"exp":"特别重要负荷需增设应急电源并严禁接入其他负荷；应急电源须独立设置，不能取自普通插座。"},{"id":"Q2086","cat":"电气消防","g":"多2-电气-专用供电回路","t":"m","stem":"消防设备配电与生产、生活用电的关系，正确的有（　）。","opts":["应采用专用的供电回路","配电设备应设有明显标志","专用回路上可接入办公用电","可与普通照明共用配电箱"],"ans":[0,1],"exp":"消防设备须用专用供电回路并有明显标志；与照明共用配电箱或在回路上接入办公用电均不符合要求。"},{"id":"Q2087","cat":"电气消防","g":"多2-电气-专用供电回路","t":"m","stem":"把消防设备接在专用回路上，能带来哪些好处（　）。","opts":["便于与其他负荷分开管理","可减小消防设备的额定容量","火灾时保证消防设备连续供电","发生火灾时不受其他回路故障影响"],"ans":[0,2,3],"exp":"专用回路避免与其他负荷互相影响，保证火灾时连续供电；设备容量由负荷计算确定，与回路形式无关。"},{"id":"Q2088","cat":"电气消防","g":"多2-电气-末端切换","t":"m","stem":"哪些设备的配电箱内必须装设双电源自动切换装置（　）。","opts":["防烟排烟风机","消防电梯","消防水泵","普通客梯"],"ans":[0,1,2],"exp":"消防水泵、防烟排烟风机和消防电梯须末端切换；普通客梯不属消防用电设备。"},{"id":"Q2089","cat":"电气消防","g":"多2-电气-末端切换","t":"m","stem":"双电源自动切换装置的设置位置，正确的有（　）。","opts":["建筑物总进线处","地下车库照明配电箱内","防烟排烟风机房配电箱内","消防水泵房配电箱内"],"ans":[2,3],"exp":"末端切换装置应设在设备机房的最末一级配电箱内；设在总进线处或照明箱内均失去末端切换意义。"},{"id":"Q2090","cat":"电气消防","g":"多2-电气-切换装置功能","t":"m","stem":"双电源切换装置投运前应确认的功能有（　）。","opts":["位置状态指示","主电源失电后自动切换至备用电源","两路电源长期并列运行","手动切换功能"],"ans":[0,1,3],"exp":"切换装置应能自动和手动切换并有状态指示；两路电源严禁长期并列运行，以防反送电。"},{"id":"Q2091","cat":"电气消防","g":"多2-电气-切换装置功能","t":"m","stem":"关于双电源切换的下列说法，正确的有（　）。","opts":["切换装置应有防止并列的措施","切换过程中两路电源可长期并列","切换时间越长对设备越有利","切换时间应满足消防设备启动要求"],"ans":[0,3],"exp":"切换时间须满足设备启动要求，并采取机械或电气联锁防止并列；切换时间过长会导致设备停运。"},{"id":"Q2092","cat":"电气消防","g":"多2-电气-双电源来源","t":"m","stem":"双电源的两个电源在独立性上有哪些要求（　）。","opts":["应满足一级负荷供电要求","一个电源故障时另一个不应同时损坏","可来自同一台变压器低压侧不同回路","相互独立"],"ans":[0,1,3],"exp":"两个电源须相互独立、故障不叠加，这是双电源的根本要求；同一台变压器低压侧的两个回路不算独立电源。"},{"id":"Q2093","cat":"电气消防","g":"多2-电气-线路明敷","t":"m","stem":"某商场消防配电线路需沿走道吊顶裸露敷设，符合要求的做法有（　）。","opts":["可直接沿可燃吊顶表面敷设","可采用普通塑料管明敷","应穿金属导管保护","可采用封闭式金属槽盒"],"ans":[2,3],"exp":"明敷须穿金属导管或采用封闭式金属槽盒；普通塑料管无防火保护能力，更不能贴可燃吊顶敷设。"},{"id":"Q2094","cat":"电气消防","g":"多2-电气-线路明敷","t":"m","stem":"消防配电线路穿越吊顶、埋入墙体时的保护做法有（　）。","opts":["暗敷时保护层厚度不宜小于30mm","金属管或槽盒应采取防火保护措施","矿物绝缘电缆明敷时仍需穿管","明敷在吊顶内时应穿金属导管"],"ans":[0,1,3],"exp":"吊顶内明敷要穿金属管并对管、盒采取防火保护，暗敷保护层不小于30mm；矿物绝缘电缆可直接明敷。"},{"id":"Q2095","cat":"电气消防","g":"多2-电气-线路暗敷","t":"m","stem":"消防配电线路暗敷时，正确的有（　）。","opts":["应敷设在非燃烧体结构内","保护层厚度不宜小于10mm","可直接敷设在可燃装修材料内","可采用阻燃刚性塑料管保护"],"ans":[0,3],"exp":"暗敷须在非燃烧体结构内且保护层不小于30mm，可用阻燃刚性塑料管；10mm不足，更不得埋入可燃材料。"},{"id":"Q2096","cat":"电气消防","g":"多2-电气-线路暗敷","t":"m","stem":"消防配电线路埋设在结构层内时，保护层与保护管的要求有（　）。","opts":["保护层可采用可燃材料","保护层厚度不宜小于30mm","暗敷线路不必考虑防火要求","可采用金属导管保护"],"ans":[1,3],"exp":"暗敷保护层不小于30mm并采用金属导管等保护；保护层若用可燃材料或忽视防火，火灾时会首先失效。"},{"id":"Q2097","cat":"电气消防","g":"多2-电气-电缆井敷设","t":"m","stem":"消防配电线路敷设在电缆井、沟内时，正确的有（　）。","opts":["采用阻燃或耐火电缆时可不穿金属管","同井沟敷设时宜分别布置在两侧","井内空洞不必封堵","宜与其他配电线路分开敷设"],"ans":[0,1,3],"exp":"阻燃耐火电缆在井沟内可免穿管，但仍宜与其他线路分设或分两侧；井内空洞必须封堵以防烟火蔓延。"},{"id":"Q2098","cat":"电气消防","g":"多2-电气-电缆井敷设","t":"m","stem":"电缆井、管道井的防火要求包括（　）。","opts":["井内每层楼板处应封堵","井壁应采用不燃材料","井内可敷设可燃气体管道","井内线路应避免与其他管道混设"],"ans":[0,1,3],"exp":"井壁不燃、每层封堵是基本要求；可燃气体和甲、乙类液体管道严禁穿越，线路也应避免与其他管道混设。"},{"id":"Q2099","cat":"电气消防","g":"多2-电气-干线支线","t":"m","stem":"关于消防配电干线与支线，正确的有（　）。","opts":["支线不宜穿越防火分区","干线宜按防火分区划分","干线应集中在同一分区内","支线可穿越多个防火分区"],"ans":[0,1],"exp":"干线宜按防火分区划分，支线不宜穿越防火分区，以免一个分区火灾影响其他分区供电。"},{"id":"Q2100","cat":"电气消防","g":"多2-电气-应急照明型式","t":"m","stem":"设消防控制室的建筑，应急照明系统在控制方式与电源形式上可选用（　）。","opts":["自带电源非集中控制型","自带电源集中控制型","集中电源非集中控制型","集中电源集中控制型"],"ans":[1,3],"exp":"设消防控制室应采用集中控制型系统，电源形式可选集中或自带；非集中控制型用于无控制室的场所。"},{"id":"Q2101","cat":"电气消防","g":"多2-电气-应急照明型式","t":"m","stem":"集中控制型消防应急照明系统的组成包括（　）。","opts":["火灾探测器","消防应急灯具","配电回路","应急照明控制器"],"ans":[1,2,3],"exp":"系统由应急照明控制器、集中电源或自带电源灯具及配电回路组成；火灾探测器属火灾报警系统。"},{"id":"Q2102","cat":"电气消防","g":"多2-电气-应急照明供电","t":"m","stem":"消防应急照明系统的供电要求，正确的有（　）。","opts":["配电回路可不设保护装置","应急照明配电箱应由消防电源供电","灯具可由普通照明回路供电","集中电源应由消防电源供电"],"ans":[1,3],"exp":"应急照明配电箱和集中电源均须由消防电源供电；灯具不得取自普通照明回路，回路还必须设保护装置。"},{"id":"Q2103","cat":"电气消防","g":"多2-电气-应急照明供电","t":"m","stem":"消防应急照明灯具的持续应急供电时间，正确的有（　）。","opts":["高度大于100m的民用建筑不应少于1.5h","所有建筑均不应少于3.0h","其他建筑不应少于1.5h","医疗建筑不应少于1.0h"],"ans":[0,3],"exp":"高度大于100m建筑1.5h、医疗建筑1.0h、其他建筑0.5h；统一按1.5h或3.0h的说法均不符。"},{"id":"Q2104","cat":"电气消防","g":"多2-电气-集中电源","t":"m","stem":"关于应急照明集中电源，正确的有（　）。","opts":["额定输出功率不应大于10kW","可设置在露天潮湿场所","宜设置在配电间或电气竖井内","额定输出功率不应大于5kW"],"ans":[2,3],"exp":"集中电源额定输出功率不应大于5kW，宜设在配电间或竖井内；露天潮湿场所会加速设备损坏。"},{"id":"Q2105","cat":"电气消防","g":"多2-电气-集中电源","t":"m","stem":"消防应急照明配电回路的设置，正确的有（　）。","opts":["任一回路配接灯具数量不宜超过25只","回路应设置短路保护","A型灯具回路电压不大于DC36V","同一回路可跨越多个防火分区"],"ans":[1,2],"exp":"回路灯具数量不宜超过60只，且须设短路保护；A型灯具回路电压不大于DC36V，回路不得跨越防火分区。"},{"id":"Q2106","cat":"电气消防","g":"多2-电气-剩余电流监控","t":"m","stem":"剩余电流式探测器的检测原理与装设位置，正确的有（　）。","opts":["检测相线与中性线电流的矢量和","不宜设置在IT系统配电线路中","应设置在低压配电系统首端","报警后应立即切断供电"],"ans":[0,1,2],"exp":"探测器检测剩余电流，设在系统首端，IT系统不宜设置；报警只作提示，不直接切断供电。"},{"id":"Q2107","cat":"电气消防","g":"多2-电气-剩余电流监控","t":"m","stem":"配电系统首端与末端的剩余电流监测，下列做法正确的有（　）。","opts":["泄漏电流大于500mA时宜设在下一级","宜设置在每个插座回路","不宜设置在消防配电线路中","宜设置在第一级配电柜出线端"],"ans":[0,2,3],"exp":"首端设置是基本原则，泄漏电流超500mA时下移一级；每个插座回路逐一设置不现实，消防配电线路不宜设置。"},{"id":"Q2108","cat":"电气消防","g":"多2-电气-测温监控","t":"m","stem":"测温式电气火灾监控探测器，正确的有（　）。","opts":["1000V及以下线路宜采用接触式","应设置在电缆接头、端子处","应远离发热点安装","探测被保护部位的异常温度"],"ans":[0,1,3],"exp":"测温探测器贴近接头、端子等发热部位，低压线路用接触式布置；远离发热点无法真实反映温度。"},{"id":"Q2109","cat":"电气消防","g":"多2-电气-故障电弧","t":"m","stem":"故障电弧探测器的功能与设置，正确的有（　）。","opts":["探测线路中产生的故障电弧","动作后发出报警信号","可区分串联电弧与并联电弧","可直接切断被保护线路电源"],"ans":[0,1,2],"exp":"故障电弧探测器识别电弧并报警，能区分串、并联电弧；切断电源由断路器或监控器联动完成。"},{"id":"Q2110","cat":"电气消防","g":"多2-电气-成因","t":"m","stem":"引发电气线路火灾的缺陷通常有（　）。","opts":["短路","接触不良","设备外壳良好接地","过载"],"ans":[0,1,3],"exp":"短路、过载、接触不良是电气火灾三大常见原因；外壳可靠接地属安全措施，不会引发火灾。"},{"id":"Q2111","cat":"电气消防","g":"多2-电气-成因","t":"m","stem":"关于电气线路短路，正确的有（　）。","opts":["短路时线路电流明显减小","短路多因绝缘损坏引起","短路时回路电流剧增","短路点会产生高温电弧"],"ans":[1,2,3],"exp":"短路时阻抗骤减、电流剧增并产生高温电弧，多由绝缘损坏引起；电流减小是断路而非短路。"},{"id":"Q2112","cat":"电气消防","g":"多2-电气-过载","t":"m","stem":"线路过载的危害包括（　）。","opts":["使线路电压升高","导线温度升高","提高导线载流能力","加速绝缘老化"],"ans":[1,3],"exp":"过载使导线发热、绝缘加速老化甚至引燃可燃物；过载会降低线路电压，也不会提高载流能力。"},{"id":"Q2113","cat":"电气消防","g":"多2-电气-过载","t":"m","stem":"造成线路过载的常见原因有（　）。","opts":["接入负荷超过设计容量","导线截面选择过大","导线截面选择过小","熔断器规格选得过大"],"ans":[0,2,3],"exp":"截面偏小、负荷超容、保护元件选大都会使线路长期超载；截面选大则不易过载。"},{"id":"Q2114","cat":"电气消防","g":"多2-电气-接触不良","t":"m","stem":"接触不良的常见部位及后果有（　）。","opts":["接触电阻增大导致局部过热","使线路绝缘性能提高","开关与插座端子","导线接头"],"ans":[0,2,3],"exp":"接头、开关和插座端子是接触不良高发部位，接触电阻增大会局部过热甚至起弧；绝缘性能只会下降。"},{"id":"Q2115","cat":"电气消防","g":"多2-电气-接触不良","t":"m","stem":"预防接触不良的措施有（　）。","opts":["用绝缘胶布缠绕代替端子连接","定期检查接头紧固情况","接头处涂导电膏防腐","导线连接采用端子或焊接"],"ans":[1,2,3],"exp":"端子连接、定期紧固、涂导电膏均有效；仅用胶布缠绕不能保证接触可靠，是隐患做法。"},{"id":"Q2116","cat":"电气消防","g":"多2-电气-预防措施","t":"m","stem":"从设计、施工到运行，防止电气火灾的常见做法有（　）。","opts":["定期检查线路接头","装设短路与过载保护","按载流量选择导线截面","用铜丝代替熔断器熔体"],"ans":[0,1,2],"exp":"合理选线、完善保护、定期检查是预防要点；用铜丝代替熔体将失去过流保护，属严重违章。"},{"id":"Q2117","cat":"电气消防","g":"多2-电气-预防措施","t":"m","stem":"线路漏电可能造成的后果有（　）。","opts":["提高线路绝缘水平","使剩余电流保护装置动作","造成人身触电","泄漏电流经可燃物发热起火"],"ans":[1,2,3],"exp":"漏电可发热引燃、导致触电并使剩余电流保护动作；漏电本身就是绝缘下降的表现。"},{"id":"Q2118","cat":"电气消防","g":"多2-电气-高温灯具","t":"m","stem":"关于照明灯具的防火要求，正确的有（　）。","opts":["功率不小于60W的白炽灯不应直接装在可燃物上","卤钨灯不应直接安装在可燃构件上","灯具可紧贴可燃装修面安装","可燃材料仓库内不应使用卤钨灯"],"ans":[0,1,3],"exp":"高温灯具与可燃物须保持距离或采取隔热措施；可燃材料仓库禁用卤钨灯，灯具不得紧贴可燃装修面。"},{"id":"Q2119","cat":"电气消防","g":"多2-电气-高温灯具","t":"m","stem":"高温灯具的引线与隔热要求包括（　）。","opts":["灯具发热部件应采取散热措施","卤钨灯引入线应采用瓷管等不燃材料隔热","灯具可直接安装在木质吊顶上","功率不小于100W的白炽灯吸顶灯引入线应隔热"],"ans":[0,1,3],"exp":"大功率白炽灯、卤钨灯引入线须用瓷管、矿棉等隔热，发热部件应散热；直接装于木质吊顶易烤燃。"},{"id":"Q2120","cat":"电气消防","g":"多2-电气-电热器具","t":"m","stem":"使用电热器具的防火要求包括（　）。","opts":["可长时间通电无人看管","应放置在不燃基座上","电热器具可直接放在木桌上使用","周围不得堆放可燃物"],"ans":[1,3],"exp":"电热器具应置于不燃基座并远离可燃物，使用时须有人看管；长时间通电无人看管极易引发火灾。"},{"id":"Q2121","cat":"电气消防","g":"多2-电气-电热器具","t":"m","stem":"电熨斗、电烙铁使用后的正确做法有（　）。","opts":["放置在隔热不燃垫上","趁热放入木质抽屉","切断电源","待完全冷却后再存放"],"ans":[0,2,3],"exp":"用后断电、冷却后存放并置于不燃隔热垫上；趁热放入木质抽屉会因余热引燃可燃物。"},{"id":"Q2122","cat":"电气消防","g":"多2-电气-配电箱插座","t":"m","stem":"关于插座与配电箱的防火要求，正确的有（　）。","opts":["可燃材料仓库的配电箱应设在仓库外","插座回路宜装设漏电保护装置","配电箱内导线接头应连接牢固","配电箱可设在可燃物堆垛上方"],"ans":[0,1,2],"exp":"插座回路宜设漏电保护，仓库配电箱应外置，箱内接头须牢固；配电箱上方不得堆放可燃物。"},{"id":"Q2123","cat":"电气消防","g":"多2-电气-配电箱插座","t":"m","stem":"配电箱（柜）引发火灾的常见原因有（　）。","opts":["箱内积尘受潮","导线绝缘破损短路","接头松动接触不良","箱体接地良好"],"ans":[0,1,2],"exp":"接头松动、绝缘破损、积尘受潮都会在箱内产生高温或电弧；箱体可靠接地是安全措施而非起火原因。"},{"id":"Q2124","cat":"电气消防","g":"多2-电气-静电防护","t":"m","stem":"防止静电危害的措施包括（　）。","opts":["采用防静电材料","加快易燃液体流速","接地导除静电","增加空气湿度"],"ans":[0,2,3],"exp":"接地、增湿、使用防静电材料可抑制静电积聚；加快流速反而使静电产生更多。"},{"id":"Q2125","cat":"电气消防","g":"多2-电气-静电防护","t":"m","stem":"静电放电可能带来的后果有（　）。","opts":["提高设备运行效率","增加设备润滑效果","引起爆炸和火灾","造成人体电击"],"ans":[2,3],"exp":"静电放电可点燃可燃气体或蒸气，也会电击人体；它不会提高效率，与润滑无关。"},{"id":"Q2126","cat":"电气消防","g":"多2-电气-防雷装置","t":"m","stem":"建筑物的防雷装置一般包括（　）。","opts":["接地装置","漏电保护器","引下线","接闪器"],"ans":[0,2,3],"exp":"防雷装置由接闪器、引下线和接地装置组成；漏电保护器属配电保护元件，不是防雷部件。"},{"id":"Q2127","cat":"电气消防","g":"多2-电气-防雷装置","t":"m","stem":"关于防雷与接地，正确的有（　）。","opts":["独立避雷针冲击接地电阻不宜大于10欧","防雷接地可与保护接地共用接地装置","雷雨天气宜在室外高处接打手机","接地装置应定期检测"],"ans":[0,1,3],"exp":"独立避雷针接地电阻不宜大于10欧，防雷接地可与保护接地共用并定期检测；雷雨天在室外高处用手机易遭雷击。"},{"id":"Q2128","cat":"电气消防","g":"多2-电气-油罐车静电","t":"m","stem":"油罐车装卸油品时，防静电的做法有（　）。","opts":["装卸前连接静电接地线","控制装卸流速","穿化纤工作服作业","使用导静电软管"],"ans":[0,1,3],"exp":"接地、限速、使用导静电软管可减少静电积聚；化纤服装易产生并积聚静电，属违规做法。"},{"id":"Q2129","cat":"电气消防","g":"多2-电气-接地保护","t":"m","stem":"关于保护接地与保护接零，正确的有（　）。","opts":["同一台变压器供电系统中不得混用","TN-S系统保护线与中性线分开","保护接地与保护接零可随意混用","保护线上不得装设开关和熔断器"],"ans":[0,1,3],"exp":"同一系统中两种保护方式混用会造成外壳带危险电压；TN-S系统保护线与中性线分离，保护线上严禁装开关熔断器。"},{"id":"Q2130","cat":"电气消防","g":"多2-电气-安全电压","t":"m","stem":"关于安全电压，正确的有（　）。","opts":["安全电压由安全隔离变压器提供","特别潮湿场所应采用12V","我国安全电压分42V、36V、24V等五级","安全电压回路可直接接自220V插座"],"ans":[0,1,2],"exp":"安全电压分42V、36V、24V、12V、6V五级，由安全隔离变压器供电；直接接220V插座会失去安全隔离。"},{"id":"Q2131","cat":"电气消防","g":"多2-电气-检查维护","t":"m","stem":"电气设备检查维护的内容包括（　）。","opts":["检查漏电保护装置动作情况","检查接头与端子紧固情况","测量线路绝缘电阻","用铜丝替代熔断器"],"ans":[0,1,2],"exp":"维护应测绝缘、查接头、试漏电保护；用铜丝替代熔体属违章，会使线路失去过流保护。"},{"id":"Q2451","cat":"电气消防","g":"判2-电气-负荷依据","t":"j","stem":"消防用电设备的负荷等级应按建筑性质、规模和火灾危险性确定。","opts":["正确","错误"],"ans":0,"exp":"负荷等级由建筑类别和规模决定，等级不同其供电要求也不同。"},{"id":"Q2452","cat":"电气消防","g":"判2-电气-特别重要","t":"j","stem":"一级消防用电负荷中特别重要的负荷，还应增设应急电源。","opts":["正确","错误"],"ans":0,"exp":"特别重要负荷在双电源之外还需应急电源，保证极端情况下不间断供电。"},{"id":"Q2453","cat":"电气消防","g":"判2-电气-二级两电源","t":"j","stem":"二级消防用电负荷应由两个独立电源供电。","opts":["正确","错误"],"ans":1,"exp":"二级负荷宜由两回线路供电；两个独立电源是一级负荷的要求。"},{"id":"Q2454","cat":"电气消防","g":"判2-电气-三级负荷","t":"j","stem":"三级消防用电负荷必须由两个独立电源供电。","opts":["正确","错误"],"ans":1,"exp":"三级负荷对供电无特殊要求，单电源即可，双电源是一级负荷的要求。"},{"id":"Q2455","cat":"电气消防","g":"判2-电气-末端切换","t":"j","stem":"消防水泵、消防电梯、防烟排烟风机应在最末一级配电箱处自动切换电源。","opts":["正确","错误"],"ans":0,"exp":"末端切换可避免线路故障影响，切换装置还应能手动操作。"},{"id":"Q2456","cat":"电气消防","g":"判2-电气-配电箱标志","t":"j","stem":"消防用电设备的配电箱应有明显标志，以便火灾时识别和操作。","opts":["正确","错误"],"ans":0,"exp":"火灾时需快速操作消防设备电源，标志不清会延误切断或启动。"},{"id":"Q2457","cat":"电气消防","g":"判2-电气-明敷保护","t":"j","stem":"消防配电线路明敷时，可采用燃烧性能B1级的刚性塑料管作保护。","opts":["正确","错误"],"ans":1,"exp":"消防配电线路明敷应穿金属导管或封闭式金属槽盒，B1级塑料管是报警传输线路明敷的允许做法。"},{"id":"Q2458","cat":"电气消防","g":"判2-电气-阻燃非耐火","t":"j","stem":"阻燃电缆在火焰中仍能保持通电，可直接作为消防设备电源线。","opts":["正确","错误"],"ans":1,"exp":"阻燃只是难燃自熄，不具备火灾时持续供电能力，消防电源线应选耐火电缆。"},{"id":"Q2459","cat":"电气消防","g":"判2-电气-铝芯导线","t":"j","stem":"消防用电设备的配电线路在穿管保护后可以采用铝芯导线。","opts":["正确","错误"],"ans":1,"exp":"消防配电线路应采用铜芯导线或电缆，铝芯易氧化断线，不得用于消防回路。"},{"id":"Q2460","cat":"电气消防","g":"判2-电气-支线穿越","t":"j","stem":"消防配电支线可以穿越防火分区，只要穿金属管保护即可。","opts":["正确","错误"],"ans":1,"exp":"消防配电干线宜按防火分区划分，支线不宜穿越防火分区。"},{"id":"Q2461","cat":"电气消防","g":"判2-电气-封堵时机","t":"j","stem":"消防配电线路穿越防火分区处的孔洞，装修完成后统一封堵即可。","opts":["正确","错误"],"ans":1,"exp":"穿越处的孔洞应在管线敷设后及时用防火封堵材料封堵，不能等到装修阶段。"},{"id":"Q2462","cat":"电气消防","g":"判2-电气-漏电保护","t":"j","stem":"剩余电流动作保护装置可用于防止漏电引起的触电和电气火灾。","opts":["正确","错误"],"ans":0,"exp":"它检测剩余电流并在超限时切断电路，兼具防触电和防火作用。"},{"id":"Q2463","cat":"电气消防","g":"判2-电气-漏电整定","t":"j","stem":"剩余电流保护装置的动作电流应躲过线路的正常泄漏电流。","opts":["正确","错误"],"ans":0,"exp":"整定值必须大于线路正常泄漏电流，否则会频繁误动作。"},{"id":"Q2464","cat":"电气消防","g":"判2-电气-漏电误动","t":"j","stem":"剩余电流保护整定值越小越灵敏，因此应尽量取最小值。","opts":["正确","错误"],"ans":1,"exp":"整定值过小会被正常泄漏电流触发，造成频繁跳闸，应按规范计算取值。"},{"id":"Q2465","cat":"电气消防","g":"判2-电气-不切消防","t":"j","stem":"对不允许停电的消防设备回路，剩余电流监测宜只报警不切断电源。","opts":["正确","错误"],"ans":0,"exp":"消防设备断电后果更严重，此类回路只监测报警，不设跳闸功能。"},{"id":"Q2466","cat":"电气消防","g":"判2-电气-电弧短路","t":"j","stem":"电弧性短路持续时间很短，一般不会引燃周围可燃物。","opts":["正确","错误"],"ans":1,"exp":"电弧温度极高，虽持续时间短但足以引燃可燃物，是重要起火源。"},{"id":"Q2467","cat":"电气消防","g":"判2-电气-接触电阻","t":"j","stem":"导线接头接触电阻增大会引起局部过热，是电气火灾的常见原因。","opts":["正确","错误"],"ans":0,"exp":"接触不良处发热会烧蚀绝缘，最终引燃周围可燃物。"},{"id":"Q2468","cat":"电气消防","g":"判2-电气-铜丝代熔丝","t":"j","stem":"用铜丝代替熔丝可以提高线路的抗过载能力。","opts":["正确","错误"],"ans":1,"exp":"铜丝熔点高不会及时熔断，失去过载保护，极易引起线路过热起火。"},{"id":"Q2469","cat":"电气消防","g":"判2-电气-保护万能","t":"j","stem":"线路装设短路保护和过载保护后，就不会再发生电气火灾。","opts":["正确","错误"],"ans":1,"exp":"保护装置只能减轻故障后果，接触不良、漏电、电弧等仍可能引发火灾。"},{"id":"Q2470","cat":"电气消防","g":"判2-电气-导线截面","t":"j","stem":"导线截面只按负荷电流选择即可，不必考虑电压损失和机械强度。","opts":["正确","错误"],"ans":1,"exp":"导线截面应按负荷电流、允许电压损失和机械强度综合确定。"},{"id":"Q2471","cat":"电气消防","g":"判2-电气-插座接线","t":"j","stem":"单相插座接线应做到左零右火上接地。","opts":["正确","错误"],"ans":0,"exp":"接线错误会使设备外壳带电，左零右火上接地是安全用电的基本要求。"},{"id":"Q2472","cat":"电气消防","g":"判2-电气-潮湿场所","t":"j","stem":"潮湿场所可以采用220V普通照明灯具，只要人不直接接触即可。","opts":["正确","错误"],"ans":1,"exp":"潮湿场所应使用安全电压或加装剩余电流保护，普通灯具绝缘受潮易失效。"},{"id":"Q2473","cat":"电气消防","g":"判2-电气-自耦变压器","t":"j","stem":"安全电压的电源可以用自耦变压器降压取得。","opts":["正确","错误"],"ans":1,"exp":"自耦变压器输入输出不隔离，一次侧高压可能串入二次侧，应采用隔离变压器。"},{"id":"Q2474","cat":"电气消防","g":"判2-电气-灯具隔热","t":"j","stem":"照明灯具可以直接安装在木质吊顶上，只要灯具功率不大。","opts":["正确","错误"],"ans":1,"exp":"灯具高温部位靠近可燃物须采取隔热散热措施，木质吊顶属可燃材料。"},{"id":"Q2475","cat":"电气消防","g":"判2-电气-镇流器","t":"j","stem":"日光灯镇流器长时间过热可能引燃周围可燃物。","opts":["正确","错误"],"ans":0,"exp":"镇流器故障发热是常见电气火源，应安装在不可燃基座上并定期检查。"},{"id":"Q2476","cat":"电气消防","g":"判2-电气-配电室堆物","t":"j","stem":"配电室内可以临时堆放可燃物，只要不影响操作通道即可。","opts":["正确","错误"],"ans":1,"exp":"配电室属火灾危险场所，不得堆放可燃物，应保持操作通道和散热空间。"},{"id":"Q2477","cat":"电气消防","g":"判2-电气-TNC","t":"j","stem":"TN-C系统中保护线与中性线合并为一根PEN线。","opts":["正确","错误"],"ans":0,"exp":"TN-C用PEN线兼作保护线和中性线，TN-S则保护线与中性线全程分开。"},{"id":"Q2478","cat":"电气消防","g":"判2-电气-IT","t":"j","stem":"IT系统适用于对供电连续性要求高、不允许停电的场所。","opts":["正确","错误"],"ans":0,"exp":"IT系统中性点不接地或经高阻抗接地，发生单相接地时仍可继续运行。"},{"id":"Q2479","cat":"电气消防","g":"判2-电气-重复接地","t":"j","stem":"保护接零系统中，保护零线不需要做重复接地。","opts":["正确","错误"],"ans":1,"exp":"保护零线应重复接地，以降低碰壳时外壳对地电压并缩短保护动作时间。"},{"id":"Q2480","cat":"电气消防","g":"判2-电气-一类防雷","t":"j","stem":"第一类防雷建筑物应装设独立接闪杆或架空接闪线（网）进行保护。","opts":["正确","错误"],"ans":0,"exp":"一类防雷建筑雷击风险最高，须用独立接闪装置保护。"},{"id":"Q2481"
