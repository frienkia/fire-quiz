的状态信息。"},{"id":"Q1673","cat":"火灾自动报警系统","g":"判-模块标识","t":"j","stem":"模块未集中设置时，其附近应设置尺寸不小于100mm×100mm的标识。","opts":["正确","错误"],"ans":0,"exp":"非集中安装的模块需设标识，便于识别和维护。"},{"id":"Q1674","cat":"火灾自动报警系统","g":"判-模块功能","t":"j","stem":"输入模块用于接收现场设备的动作信号并传送给火灾报警控制器。","opts":["正确","错误"],"ans":0,"exp":"输入模块只收不发，把监视类设备的信号送入控制器。"},{"id":"Q1675","cat":"火灾自动报警系统","g":"判-模块功能","t":"j","stem":"输出模块既能接收现场设备信号，又能驱动受控消防设备动作。","opts":["正确","错误"],"ans":1,"exp":"只驱动设备的是输出模块，同时具备接收和驱动功能的是输入输出模块。"},{"id":"Q1676","cat":"火灾自动报警系统","g":"判-联动触发","t":"j","stem":"同一防烟分区内两只独立火灾探测器的报警信号可作为排烟口开启的联动触发信号。","opts":["正确","错误"],"ans":0,"exp":"排烟口、排烟窗、排烟阀的开启采用两只独立探测器报警作为触发信号。"},{"id":"Q1677","cat":"火灾自动报警系统","g":"判-切非消防","t":"j","stem":"消防联动控制器切断非消防电源时，应同时切断消防水泵的供电。","opts":["正确","错误"],"ans":1,"exp":"消防设备电源不得随意切断，切非只针对非消防负荷。"},{"id":"Q1678","cat":"火灾自动报警系统","g":"判-防火门监控","t":"j","stem":"防火门监控器应设置在消防控制室内或有人值班的场所。","opts":["正确","错误"],"ans":0,"exp":"监控器需有人值守，才能及时处理防火门异常开启和故障。"},{"id":"Q1679","cat":"火灾自动报警系统","g":"判-备电转换","t":"j","stem":"火灾报警控制器主电源断电后，应能自动转换到备用电源供电。","opts":["正确","错误"],"ans":0,"exp":"主备电源自动转换是控制器连续工作的基本保障。"},{"id":"Q1680","cat":"火灾自动报警系统","g":"判-电气火灾监控","t":"j","stem":"电气火灾监控系统的报警信息与火灾报警信息在显示上应有所区别。","opts":["正确","错误"],"ans":0,"exp":"两类信息性质不同，混同显示会干扰值班人员判断。"},{"id":"Q1681","cat":"火灾自动报警系统","g":"判-可燃气体","t":"j","stem":"可燃气体探测报警系统应独立组成，可燃气体探测器不应直接接入火灾报警控制器的探测器回路。","opts":["正确","错误"],"ans":0,"exp":"可燃气体探测自成系统，需联动时由可燃气体报警控制器接入。"},{"id":"Q1682","cat":"火灾自动报警系统","g":"判-电话功能","t":"j","stem":"消防专用电话总机应能呼叫各分机，但分机不能呼叫总机。","opts":["正确","错误"],"ans":1,"exp":"总机与分机之间应能双向通话，分机可呼叫总机。"},{"id":"Q1837","cat":"火灾自动报警系统","g":"多-控制器功能","t":"m","stem":"火灾报警控制器应具有的信息处理功能包括（　）。","opts":["显示并记录火灾报警的时间与部位","对报警信号进行消音和复位","对指定部位或设备进行屏蔽","自动向消防水泵发出直接启泵指令"],"ans":[0,1,2],"exp":"控制器负责报警信息的显示记录、消音复位和屏蔽；直接启泵由联动控制器或多线控制盘完成，D错。"},{"id":"Q1838","cat":"火灾自动报警系统","g":"多-控制器功能","t":"m","stem":"火灾报警控制器处于手动控制状态时，仍应具备的功能有（　）。","opts":["自动启动消防水泵","接收火灾探测器的报警信号","显示报警部位并发出声光报警","对报警信息进行记录"],"ans":[1,2,3],"exp":"手自动状态只影响联动输出，报警接收、显示和记录不受影响；自动启动消防水泵须在自动状态，A错。"},{"id":"Q1839","cat":"火灾自动报警系统","g":"多-控制器功能","t":"m","stem":"火灾报警控制器执行自检时，通常检查的项目有（　）。","opts":["面板指示灯和数码显示","音响器件","打印机走纸","探测器灵敏度"],"ans":[0,1,2],"exp":"自检主要查本机指示灯、显示、音响和打印机；探测器灵敏度需专用仪器检测，不在自检范围，D错。"},{"id":"Q1840","cat":"火灾自动报警系统","g":"多-控制器组成","t":"m","stem":"火灾报警控制器主要由下列哪些部分构成（　）。","opts":["显示操作单元","喷淋泵控制柜","电源单元","主控单元"],"ans":[0,2,3],"exp":"控制器由主控、显示操作、输入输出和电源等单元组成；喷淋泵控制柜属灭火系统设备，B错。"},{"id":"Q1841","cat":"火灾自动报警系统","g":"多-控制器组成","t":"m","stem":"集中报警系统的组成包括（　）。","opts":["火灾报警控制器","消防联动控制器","消防应急广播","消防水池"],"ans":[0,1,2],"exp":"集中报警系统由火灾报警控制器、联动控制器、图形显示装置、广播和电话等组成；消防水池属给水系统，D错。"},{"id":"Q1842","cat":"火灾自动报警系统","g":"多-探测器选型","t":"m","stem":"下列场所宜选择感温火灾探测器的有（　）。","opts":["计算机房","厨房","锅炉房","吸烟室"],"ans":[1,2,3],"exp":"厨房、锅炉房、吸烟室常有烟或高温，宜选感温；计算机房宜感烟，A错。"},{"id":"Q1843","cat":"火灾自动报警系统","g":"多-探测器安装距离","t":"m","stem":"点型火灾探测器的安装，符合规定的有（　）。","opts":["至墙壁、梁边的水平距离不应小于0.3m","周围0.5m内不应有遮挡物","应紧贴顶棚安装且不得有任何倾斜","至空调送风口边的水平距离不应小于1.5m"],"ans":[1,3],"exp":"至墙壁、梁边水平距离不应小于0.5m，A的0.3m错；倾斜角不应大于45°，C过于绝对。"},{"id":"Q1844","cat":"火灾自动报警系统","g":"多-探测器安装距离","t":"m","stem":"点型感烟探测器在格栅吊顶场所的设置，正确的有（　）。","opts":["镂空面积比大于30%时设在吊顶上方","确认灯无法观察时应在吊顶下方设置确认灯","镂空面积与总面积之比不大于15%时设在吊顶下方","镂空面积比为15%至30%时应上下同时设置"],"ans":[0,1,2],"exp":"15%至30%时应按实际试验结果确定部位，不能一律上下同设，D错；其余符合GB50116。"},{"id":"Q1845","cat":"火灾自动报警系统","g":"多-手动报警按钮","t":"m","stem":"手动火灾报警按钮的设置，符合规定的有（　）。","opts":["每个防火分区应至少设置一只","从任一位置到最邻近一只的步行距离不应大于30m","应安装在距地面1.5m以上的墙面","应设置在疏散通道或出入口处"],"ans":[0,1,3],"exp":"手报每个防火分区至少一只，步行距离不大于30m，设在疏散通道或出入口；安装高度宜1.3m至1.5m，C错。"},{"id":"Q1846","cat":"火灾自动报警系统","g":"多-手动报警按钮","t":"m","stem":"手动火灾报警按钮的安装要求包括（　）。","opts":["底边距地高度宜为1.3m至1.5m","启动零件动作后能自动恢复","应设置明显的标志","安装应牢固，不得松动"],"ans":[0,2,3],"exp":"手报安装高度宜1.3m至1.5m，标志明显、安装牢固；启动零件动作后须手动复位，B错。"},{"id":"Q1847","cat":"火灾自动报警系统","g":"多-火灾警报器","t":"m","stem":"关于火灾警报器的设置，正确的有（　）。","opts":["声压级不应小于60dB","环境噪声大于60dB的场所应高于背景噪声15dB","应设在每个楼层的楼梯口、消防电梯前室等明显部位","应与安全出口标志灯设置在同一面墙上"],"ans":[0,1,2],"exp":"前三项符合GB50116；火灾光警报器不宜与安全出口指示标志灯设在同一面墙上，D错。"},{"id":"Q1848","cat":"火灾自动报警系统","g":"多-火灾警报器","t":"m","stem":"关于火灾光警报器，正确的有（　）。","opts":["不宜与安全出口指示标志灯具设置在同一面墙上","应设在楼层楼梯口、消防电梯前室和内部拐角等部位","应能由消防联动控制器控制启动","安装位置应尽量隐蔽以免影响美观"],"ans":[0,1,2],"exp":"光警报器的设置位置和同墙限制符合规范，并能接受联动控制；隐蔽安装会使警示作用失效，D错。"},{"id":"Q1849","cat":"火灾自动报警系统","g":"多-总线与模块","t":"m","stem":"关于总线短路隔离器的设置，正确的有（　）。","opts":["隔离器动作后应切断该防火分区全部总线设备","隔离器应能隔离短路故障，保证其他部位正常工作","每只隔离器保护的总线设备总数不应大于32点","总线穿越防火分区处应设置总线短路隔离器"],"ans":[1,2,3],"exp":"每只隔离器保护设备不超过32点，设于总线穿越防火分区处，作用是隔离故障点；切断全分区总线会扩大影响，A错。"},{"id":"Q1850","cat":"火灾自动报警系统","g":"多-总线与模块","t":"m","stem":"关于消防模块的设置，正确的有（　）。","opts":["模块宜集中设置在本报警区域的金属模块箱内","本报警区域内的模块不应控制其他报警区域的设备","模块严禁设置在配电（控制）柜（箱）内","模块可控制跨防火分区的联动设备"],"ans":[0,1,2],"exp":"模块不得跨报警区域控制设备，严禁装入配电柜，宜集中设于金属模块箱；D与规定相反。"},{"id":"Q1851","cat":"火灾自动报警系统","g":"多-总线与模块","t":"m","stem":"输入输出模块的功能包括（　）。","opts":["接收被控设备的动作反馈信号","输出联动控制信号","直接设定火灾探测器的报警阈值","直接驱动消防水泵主回路"],"ans":[0,1],"exp":"模块用于输出控制信号和接收反馈；探测器报警由探头完成，阈值由控制器设定，C、D错。"},{"id":"Q1852","cat":"火灾自动报警系统","g":"多-系统供电","t":"m","stem":"关于火灾自动报警系统的供电，正确的有（　）。","opts":["主电源不应设置过负荷保护装置","备用电源可采用普通干电池组","主电源应采用消防电源","主电源不应设置剩余电流动作保护装置"],"ans":[0,2,3],"exp":"主电源采用消防电源且不设剩余电流和过负荷保护；备用电源应为专用蓄电池组，干电池不能保证容量，B错。"},{"id":"Q1853","cat":"火灾自动报警系统","g":"多-系统供电","t":"m","stem":"火灾自动报警系统备用电源的要求，正确的有（　）。","opts":["备用电源应采用蓄电池","容量应满足系统在监视和报警状态下的工作时间要求","应能自动投入","可与普通照明共用同一路市电"],"ans":[0,1,2],"exp":"备用电源用蓄电池，容量满足工作要求并能自动投入；与普通照明同路会在断电时同时失电，D错。"},{"id":"Q1854","cat":"火灾自动报警系统","g":"多-系统接地","t":"m","stem":"关于火灾自动报警系统接地，正确的有（　）。","opts":["采用共用接地装置时接地电阻不应大于1Ω","接地干线应采用铜芯绝缘导线","接地线可串联连接各设备","采用专用接地装置时接地电阻不应大于4Ω"],"ans":[0,1,3],"exp":"专用接地不大于4Ω、共用接地不大于1Ω，接地干线用铜芯绝缘导线；接地线必须并联，串联断开会使后续设备失去接地，C错。"},{"id":"Q1855","cat":"火灾自动报警系统","g":"多-线缆敷设","t":"m","stem":"火灾自动报警系统传输线路的敷设，符合规定的有（　）。","opts":["可采用铝芯导线以降低造价","应采用铜芯绝缘导线或铜芯电缆","穿管敷设时线芯截面不应小于1.0mm²","线槽敷设时线芯截面不应小于0.75mm²"],"ans":[1,2,3],"exp":"系统线路必须用铜芯线缆，穿管1.0mm²、线槽0.75mm²为最小截面；铝芯易氧化断线，A错。"},{"id":"Q1856","cat":"火灾自动报警系统","g":"多-线缆敷设","t":"m","stem":"火灾自动报警系统的线路敷设，正确的有（　）。","opts":["消防控制、通信和警报线路宜与其他线路分开敷设","暗敷应设在不燃烧体内，保护层厚度不小于30mm","明敷时应采用金属导管或封闭式金属槽盒保护","系统线路可与强电线路同管敷设"],"ans":[0,1,2],"exp":"暗敷保护层不小于30mm、明敷需金属管或槽盒，并与强电分开；同管敷设会引入干扰且不安全，D错。"},{"id":"Q1857","cat":"火灾自动报警系统","g":"多-报警区域","t":"m","stem":"关于报警区域的划分，正确的有（　）。","opts":["应根据防火分区或楼层划分","可由同楼层相邻的几个防火分区组成","可跨越楼层任意组合","每个报警区域宜设置一台区域显示器"],"ans":[0,1,3],"exp":"报警区域按防火分区或楼层划分，只含同楼层相邻防火分区，并宜设一台区域显示器；跨楼层组合，C错。"},{"id":"Q1858","cat":"火灾自动报警系统","g":"多-火灾显示盘","t":"m","stem":"火灾显示盘（区域显示器）的设置与功能，正确的有（　）。","opts":["宜设在出入口等明显且便于操作的部位","应能显示全楼所有报警区域的火警信息","应能显示本报警区域内的火灾报警部位","每个报警区域宜设置一台"],"ans":[0,2,3],"exp":"火灾显示盘只显示本报警区域信息，全楼信息由消防控制室控制器显示，B错。"},{"id":"Q1859","cat":"火灾自动报警系统","g":"多-消防广播","t":"m","stem":"消防应急广播的设置，符合规定的有（　）。","opts":["从任一部位到最近扬声器的步行距离不应大于25m","走道末端距最近扬声器的距离不应大于12.5m","扬声器应设置在走道和大厅等公共场所","火灾时应与普通广播共用同一功放且不设强切"],"ans":[0,1,2],"exp":"25m与12.5m为规范限值，扬声器设在走道、大厅；火灾时须强制切换到消防广播，D错。"},{"id":"Q1860","cat":"火灾自动报警系统","g":"多-消防广播","t":"m","stem":"消防专用电话的设置，正确的有（　）。","opts":["消防电话可与普通电话共用交换机组","消防控制室应设置消防电话总机","消防水泵房、防烟排烟机房应设置消防电话分机","消防电话网络应采用独立的消防通信系统"],"ans":[1,2,3],"exp":"总机设在消防控制室，水泵房、风机房等设分机，网络独立；与普通电话混用会在火灾时失效，A错。"},{"id":"Q1861","cat":"火灾自动报警系统","g":"多-联动控制逻辑","t":"m","stem":"关于消防联动控制的设计，正确的有（　）。","opts":["重要消防设备应设置手动直接控制","联动触发信号应采用两个独立报警信号的与逻辑组合","消防联动控制器应能按设定逻辑发出联动指令","联动控制器可完全代替手动直接控制盘"],"ans":[0,1,2],"exp":"联动需两个独立信号与逻辑，重要设备保留手动直接控制；总线联动不能替代手动直接控制盘，D错。"},{"id":"Q1862","cat":"火灾自动报警系统","g":"多-联动控制逻辑","t":"m","stem":"关于疏散通道上防火卷帘的联动控制，正确的有（　）。","opts":["感温探测器报警信号使卷帘下降至楼板面","卷帘下降到位后不得再提升","卷帘两侧应设置手动控制按钮","感烟探测器报警信号使卷帘下降至距地1.8m处"],"ans":[0,2,3],"exp":"疏散通道上卷帘分两步下降，两侧设手动按钮；火灾处置后可复位提升，B错。"},{"id":"Q1863","cat":"火灾自动报警系统","g":"多-联动控制逻辑","t":"m","stem":"可作为消防水泵直接启泵信号的有（　）。","opts":["水泵出水干管上的低压压力开关信号","高位消防水箱出水管上的流量开关信号","报警阀压力开关信号","消防控制室值班人员的电话通知信号"],"ans":[0,1,2],"exp":"低压压力开关、流量开关、报警阀压力开关均可直接启泵；电话通知不是规范规定的启泵信号，D错。"},{"id":"Q1864","cat":"火灾自动报警系统","g":"多-调试与检测","t":"m","stem":"火灾自动报警系统调试的内容包括（　）。","opts":["对探测器逐个进行报警功能试验","对控制器进行功能试验","对消防水池进行补水试验","对消防应急广播进行音响试验"],"ans":[0,1,3],"exp":"调试含探测器、控制器、报警装置、广播、电话等设备功能试验；水池补水属给水系统，C错。"},{"id":"Q1865","cat":"火灾自动报警系统","g":"多-调试与检测","t":"m","stem":"火灾自动报警系统检测时应检查的内容有（　）。","opts":["消防水池的有效容积","设备规格、型号与设计文件的一致性","探测器报警后控制器显示部位是否准确","联动控制逻辑是否正确"],"ans":[1,2,3],"exp":"检测查设备一致性、报警显示部位、联动逻辑与功能；水池容积属给水系统验收，A错。"},{"id":"Q1866","cat":"火灾自动报警系统","g":"多-施工与验收","t":"m","stem":"火灾自动报警系统施工前应具备的条件包括（　）。","opts":["设备、材料已进场并检验合格","设计施工图及有关技术文件齐全","施工方案已经批准","建筑内部装修已全部完成"],"ans":[0,1,2],"exp":"施工前需图纸齐全、方案批准、设备材料检验合格；装修全部完成不是开工前提，D错。"},{"id":"Q1867","cat":"火灾自动报警系统","g":"多-施工与验收","t":"m","stem":"火灾自动报警系统设备进场检验的内容包括（　）。","opts":["设备及材料的规格、型号","产品合格证和检验报告","设备的市场价格","外观和标志"],"ans":[0,1,3],"exp":"进场检验查规格型号、质量证明文件、外观标志；价格与工程质量无关，C错。"},{"id":"Q1868","cat":"火灾自动报警系统","g":"多-使用维护","t":"m","stem":"火灾自动报警系统的日常维护，正确的有（　）。","opts":["每年对系统进行一次全面检测","探测器报警后立即拆下送厂清洗","每日检查控制器工作状态和指示灯","每月对探测器报警功能进行抽检"],"ans":[0,2,3],"exp":"日巡查、月抽检、年全面检测构成三级维护；报警后应先确认复位，不能随即拆洗，B错。"},{"id":"Q1992","cat":"火灾自动报警系统","g":"多2-报警-区域系统适用","t":"m","stem":"区域报警系统通常由下列哪些设备组成（　）。","opts":["火灾探测器","火灾报警控制器","消防联动控制器","消防应急广播"],"ans":[0,1],"exp":"区域系统仅需报警不需联动，故不含联动控制器与应急广播，主要由控制器、探测器、手报和警报器组成。"},{"id":"Q1993","cat":"火灾自动报警系统","g":"多2-报警-区域系统适用","t":"m","stem":"下列保护对象中，可以采用区域报警系统的有（　）。","opts":["设置两个消防控制室的大型建筑群","仅需火灾报警、不需联动自动消防设备的场所","需要联动消防设备且只设一个消防控制室的建筑","建筑面积较小的独立小商店"],"ans":[1,3],"exp":"区域系统适用于仅报警不联动的对象；需联动的用集中系统，多控制室的用控制中心系统。"},{"id":"Q1994","cat":"火灾自动报警系统","g":"多2-报警-集中系统构成","t":"m","stem":"集中报警系统应设置的设备有（　）。","opts":["具有集中控制功能的火灾报警控制器","消防控制室图形显示装置","两个及以上消防控制室","消防联动控制器"],"ans":[0,1,3],"exp":"集中系统只设一个消防控制室，须配集中型控制器、联动控制器和图形显示装置；两个控制室属控制中心系统。"},{"id":"Q1995","cat":"火灾自动报警系统","g":"多2-报警-集中系统构成","t":"m","stem":"与区域报警系统相比，集中报警系统必须增设的设备有（　）。","opts":["消防控制室图形显示装置","消防联动控制器","手动火灾报警按钮","火灾声光警报器"],"ans":[0,1],"exp":"集中系统要联动消防设备并集中显示，故增设联动控制器和图形显示装置；手报和警报器两种系统均可设。"},{"id":"Q1996","cat":"火灾自动报警系统","g":"多2-报警-控制中心系统","t":"m","stem":"应采用控制中心报警系统的保护对象有（　）。","opts":["仅需火灾报警的独立小仓库","设置两个及以上消防控制室的建筑","设置两个及以上集中报警系统的建筑","需联动且只设一个消防控制室的建筑"],"ans":[1,2],"exp":"控制中心系统针对多控制室或多集中系统的对象；仅报警用区域系统，单控制室联动用集中系统。"},{"id":"Q1997","cat":"火灾自动报警系统","g":"多2-报警-控制中心系统","t":"m","stem":"控制中心报警系统中主消防控制室的作用有（　）。","opts":["显示所有火灾报警信号","控制所有消防联动设备","显示各分消防控制室的消防设施状态","代替分消防控制室24小时值班"],"ans":[0,2],"exp":"主控制室集中显示全部报警与各分控制室设施状态，只控制重要消防设备，也不能代行分控制室值班。"},{"id":"Q1998","cat":"火灾自动报警系统","g":"多2-报警-控制器容量","t":"m","stem":"关于火灾报警控制器的容量，说法正确的有（　）。","opts":["每总线回路连接设备总数不宜超过200点","应留有不少于额定容量10%的余量","任一台控制器连接设备总数不应超过3200点","控制器可无限制地跨越避难层设置"],"ans":[0,1,2],"exp":"3200点、每回路200点、预留10%是控制器的容量要求；超100m建筑中控制器还不得跨越避难层。"},{"id":"Q1999","cat":"火灾自动报警系统","g":"多2-报警-控制器容量","t":"m","stem":"联动型控制器在模块容量上有何限制，正确的有（　）。","opts":["所控制的各类模块总数不应超过1600点","兼具火灾报警与联动控制功能","联动总线每回路设备总数不宜超过200点","容量可不预留余量"],"ans":[0,1],"exp":"联动型控制器模块总数1600点上限，每联动总线回路不宜超过100点，仍需预留10%容量余量。"},{"id":"Q2000","cat":"火灾自动报警系统","g":"多2-报警-报警区域划分","t":"m","stem":"某综合楼划分报警区域时，下列做法正确的有（　）。","opts":["报警区域宜与防火分区完全无关","按防火分区或楼层划分","为节省设备可跨楼层任意组合","一个报警区域宜由同层相邻几个防火分区组成"],"ans":[1,3],"exp":"报警区域应按防火分区或楼层划分，一个报警区域宜由一个或同层相邻几个防火分区组成，不得跨层随意组合。"},{"id":"Q2001","cat":"火灾自动报警系统","g":"多2-报警-报警区域划分","t":"m","stem":"某办公楼确定探测区域时，符合规定的做法有（　）。","opts":["一个探测区域可跨越防火分区","一个探测区域面积不宜超过500平方米","敞开或封闭楼梯间应单独划分探测区域","探测区域应按独立房（套）间划分"],"ans":[1,2,3],"exp":"探测区域按独立房间划分、面积不宜超500平方米，楼梯间等应单独划分；探测区域不得跨越防火分区。"},{"id":"Q2002","cat":"火灾自动报警系统","g":"多2-报警-感烟探测器选型","t":"m","stem":"火灾初期以阴燃为主、烟气量较大的场所，宜选用的探测器有（　）。","opts":["教学楼教室","饭店客房","烘干车间","柴油发电机房"],"ans":[0,1],"exp":"客房、教室火灾初期多有阴燃烟气宜用感烟；发电机房常有烟、烘干车间粉尘水汽大，均易误报。"},{"id":"Q2003","cat":"火灾自动报警系统","g":"多2-报警-感烟探测器选型","t":"m","stem":"常年有烟尘滞留的场所配置探测器时，不宜选用的有（　）。","opts":["电梯机房","厨房","锅炉房","吸烟室"],"ans":[1,2,3],"exp":"厨房、锅炉房、吸烟室正常即有烟尘滞留，感烟探测器易误报；电梯机房宜设感烟探测器。"},{"id":"Q2004","cat":"火灾自动报警系统","g":"多2-报警-感温探测器选型","t":"m","stem":"某厂烘干车间、锅炉房与计算机房配置点型探测器时，正确的有（　）。","opts":["烘干车间宜选感温探测器","锅炉房宜选感温探测器","三个场所均宜选感烟探测器","计算机房宜选感温探测器"],"ans":[0,1],"exp":"烘干车间、锅炉房常有烟尘高温宜用感温；计算机房需早期报警宜感烟，不能一概选感烟。"},{"id":"Q2005","cat":"火灾自动报警系统","g":"多2-报警-感温探测器选型","t":"m","stem":"感温探测器响应较慢，下列哪些场所应改用其他类型（　）。","opts":["汽车库","电缆夹层","需要早期报警的重要场所","可能产生阴燃火的场所"],"ans":[2,3],"exp":"感温探测器响应慢，不适合阴燃火和需早期报警的场所；汽车库、电缆夹层可选用感温类探测器。"},{"id":"Q2006","cat":"火灾自动报警系统","g":"多2-报警-感温探测器选型","t":"m","stem":"关于差定温火灾探测器的说法，正确的有（　）。","opts":["只响应温升速率","动作后须更换感温元件才能复位","兼有定温和差温两种响应功能","对缓慢升温和快速升温均能响应"],"ans":[2,3],"exp":"差定温探测器组合了定温与差温两种动作条件，适应性更强；其感温元件一般可重复使用。"},{"id":"Q2007","cat":"火灾自动报警系统","g":"多2-报警-线型探测器选型","t":"m","stem":"长距离连续敷设、维护不便的部位，宜选用的探测器有（　）。","opts":["档案库房","影剧院观众厅","电缆竖井","电缆隧道"],"ans":[2,3],"exp":"线型感温适合电缆隧道、竖井等狭长场所；档案库房和观众厅宜用感烟或光束感烟探测器。"},{"id":"Q2008","cat":"火灾自动报警系统","g":"多2-报警-线型探测器选型","t":"m","stem":"空间高大、视线无遮挡的场所，宜选用的探测器有（　）。","opts":["低矮的电缆夹层","无遮挡的高大厂房","影剧院观众厅","有大量粉尘的车间"],"ans":[1,2],"exp":"光束感烟适合无遮挡大空间；粉尘环境易误报，低矮电缆夹层宜用线型感温探测器。"},{"id":"Q2009","cat":"火灾自动报警系统","g":"多2-报警-线型探测器选型","t":"m","stem":"关于线型光束感烟探测器的布置，正确的有（　）。","opts":["相邻两组探测器的水平距离不应大于14m","发射器与接收器距离不宜超过100m","探测器应紧贴顶棚安装不留间隙","探测器至侧墙水平距离不应大于7m"],"ans":[0,1,3],"exp":"组间14m、距侧墙7m、收发距离100m为布置要求；光束轴线至顶棚应留0.3至1.0m距离。"},{"id":"Q2010","cat":"火灾自动报警系统","g":"多2-报警-吸气与火焰探测","t":"m","stem":"气流速度大或要求极早期探测的场所，宜选用的探测器有（　）。","opts":["湿度很大的洗衣房","有大量粉尘的车间","需要极早期探测的洁净厂房","有高速气流的通信机房"],"ans":[2,3],"exp":"吸气式适合高速气流和需极早期报警的场所；粉尘会堵塞采样孔，潮湿环境易致误报。"},{"id":"Q2011","cat":"火灾自动报警系统","g":"多2-报警-吸气与火焰探测","t":"m","stem":"火灾发展迅速、初期即有明火的场所，宜选用的探测器有（　）。","opts":["加油站","油库泵房","图书库房","办公室"],"ans":[0,1],"exp":"火焰探测器响应快，适合易燃液体等火灾发展迅速的场所；图书库房和办公室宜用感烟探测器。"},{"id":"Q2012","cat":"火灾自动报警系统","g":"多2-报警-探测器安装距离","t":"m","stem":"点型探测器与墙、梁、送风口之间应保持的距离，符合要求的有（　）。","opts":["至空调送风口最近边的水平距离不应小于1.5m","至多孔送风顶棚孔口的水平距离不应小于1.5m","探测器周围0.5m内不应有遮挡物","至墙壁、梁边的水平距离不应小于0.5m"],"ans":[0,2,3],"exp":"至墙壁、梁边0.5m，周围0.5m无遮挡物，至空调送风口1.5m；至多孔送风孔口为0.5m。"},{"id":"Q2013","cat":"火灾自动报警系统","g":"多2-报警-探测器安装距离","t":"m","stem":"关于点型探测器的安装方式，正确的有（　）。","opts":["探测器应紧贴墙面安装","确需倾斜安装时倾斜角不应大于45度","至端墙距离不应大于安装间距的1/3","宜水平安装"],"ans":[1,3],"exp":"探测器宜水平安装，倾斜角不超过45度；至端墙距离不应大于安装间距的1/2。"},{"id":"Q2014","cat":"火灾自动报警系统","g":"多2-报警-探测器安装距离","t":"m","stem":"选择探测器安装位置时，应避开（　）。","opts":["照明灯具正下方","房间中央的顶棚上","有遮挡物的地方","气流直吹的地方"],"ans":[0,2,3],"exp":"遮挡与强气流会妨碍烟雾进入探测腔，灯具正下方受热辐射干扰；房间中央顶棚恰是适宜位置。"},{"id":"Q2015","cat":"火灾自动报警系统","g":"多2-报警-内走道布置","t":"m","stem":"在宽度小于3m的内走道顶棚设置点型探测器时，正确的有（　）。","opts":["宜居中布置","探测器至端墙距离不应大于间距的1/3","感烟探测器安装间距不应超过15m","感温探测器安装间距不应超过15m"],"ans":[0,2],"exp":"内走道探测器宜居中，感烟间距15m、感温10m，至端墙距离不大于安装间距的1/2。"},{"id":"Q2016","cat":"火灾自动报警系统","g":"多2-报警-保护面积与数量","t":"m","stem":"关于点型探测器的保护面积，正确的有（　）。","opts":["面积不大于80平方米时感烟按80平方米计","感温在面积大于30平方米时按30平方米计","面积大于80平方米时感烟按60平方米计","保护面积与房间高度无关"],"ans":[0,2],"exp":"感烟按80或60平方米取值；感温超过30平方米时按20平方米计，且保护面积随房间高度变化。"},{"id":"Q2017","cat":"火灾自动报警系统","g":"多2-报警-保护面积与数量","t":"m","stem":"确定一个探测区域内探测器数量时，应考虑的因素有（　）。","opts":["屋顶坡度与梁的影响","探测器的生产厂家","房间的高度","单只探测器的保护面积"],"ans":[0,2,3],"exp":"数量由保护面积、房间高度、屋顶坡度及梁等影响综合确定，与生产厂家无关。"},{"id":"Q2018","cat":"火灾自动报警系统","g":"多2-报警-梁与吊顶影响","t":"m","stem":"关于梁对点型探测器设置的影响，正确的有（　）。","opts":["梁突出高度超过200mm时应按要求确定探测器位置","梁越高所需探测器越少","梁突出顶棚高度小于200mm时可不计其影响","被梁隔断的每个梁间区域应至少设置一只探测器"],"ans":[0,2,3],"exp":"200mm是区分是否计梁影响的界限；梁间区域至少设一只探测器，梁高并不会减少探测器数量。"},{"id":"Q2019","cat":"火灾自动报警系统","g":"多2-报警-梁与吊顶影响","t":"m","stem":"有吊顶的房间设置点型探测器时，正确的有（　）。","opts":["探测器可设置在吊顶下方","吊顶内无可燃物时通常可不设","吊顶上方有可燃物时应在吊顶内增设探测器","探测器必须暗装在吊顶面板内"],"ans":[0,1,2],"exp":"探测器可明装于吊顶下；吊顶内有可燃物时须在吊顶内加设，但不要求暗装于面板内。"},{"id":"Q2020","cat":"火灾自动报警系统","g":"多2-报警-手报选型与标志","t":"m","stem":"对手动火灾报警按钮的认识，正确的有（　）。","opts":["按钮动作后可直接启动消防水泵","按复位方式分为可复位型和玻璃破碎型","宜设置在疏散通道或出入口处","应暗装在不易触及的位置"],"ans":[1,2],"exp":"手报按复位方式分两类，宜设在疏散通道或出入口；它是报警触发器件，启泵须按联动逻辑执行。"},{"id":"Q2021","cat":"火灾自动报警系统","g":"多2-报警-手报安装接线","t":"m","stem":"手动火灾报警按钮的安装与接线，正确的有（　）。","opts":["可暗装于装饰墙内不易发现","导线应连接牢固、接触良好","墙上安装时底边距地高度宜为1.3至1.5m","连接导线余量不应小于500mm"],"ans":[1,2],"exp":"手报底边距地1.3至1.5m，导线余量不小于150mm即可；按钮应设在明显且便于操作处。"},{"id":"Q2022","cat":"火灾自动报警系统","g":"多2-报警-手报安装接线","t":"m","stem":"防火分区内手动火灾报警按钮的布置，下列说法正确的有（　）。","opts":["每个防火分区应至少设置一只","步行距离不应大于30m","应设置在明显且便于操作的部位","每个防火分区应设置两只以上"],"ans":[0,1,2],"exp":"每分区至少一只即满足要求，从分区内任何位置到最近手报的步行距离不应大于30m；两只以上并非必须。"},{"id":"Q2023","cat":"火灾自动报警系统","g":"多2-报警-手报功能响应","t":"m","stem":"按下手动火灾报警按钮后，控制器与按钮本身的反应有（　）。","opts":["控制器显示报警部位","控制器发出火灾报警声光信号","按钮自带的报警确认灯点亮","自动启动排烟风机"],"ans":[0,1,2],"exp":"手报动作后控制器报警、显示部位，按钮确认灯点亮；排烟风机须按联动逻辑由联动控制器启动。"},{"id":"Q2024","cat":"火灾自动报警系统","g":"多2-报警-手报功能响应","t":"m","stem":"玻璃破碎型手动火灾报警按钮的特点有（　）。","opts":["结构简单、动作可靠","需击碎玻璃片才能报警","动作后须更换玻璃片复位","可重复使用无需更换部件"],"ans":[0,1,2],"exp":"玻璃破碎型靠击碎玻璃片触发，复位需更换玻璃片；其结构简单可靠，但不能不换件重复使用。"},{"id":"Q2025","cat":"火灾自动报警系统","g":"多2-报警-控制器报警功能","t":"m","stem":"火灾报警控制器对火警信号的处理功能有（　）。","opts":["显示报警部位和时间","直接启动消防水泵","记录报警信息","发出声光报警信号"],"ans":[0,2,3],"exp":"控制器负责报警、显示与记录；启泵等联动由消防联动控制器按预设逻辑执行。"},{"id":"Q2026","cat":"火灾自动报警系统","g":"多2-报警-控制器报警功能","t":"m","stem":"火灾报警控制器的辅助功能包括（　）。","opts":["消音","屏蔽","喷放灭火剂","信息记录与查询"],"ans":[0,1,3],"exp":"屏蔽、消音、记录查询均为控制器辅助功能；灭火剂喷放属灭火系统，不由控制器完成。"},{"id":"Q2027","cat":"火灾自动报警系统","g":"多2-报警-控制器火警处置","t":"m","stem":"火灾报警控制器处于火警状态时，值班人员的正确做法有（　）。","opts":["确认误报后按程序复位","未确认前不随意复位","先消音再核查报警部位","立即断开主电源停止报警"],"ans":[0,1,2],"exp":"火警时应消音、核查，确认误报方可复位；断开主电源会使系统失去供电，属错误处置。"},{"id":"Q2028","cat":"火灾自动报警系统","g":"多2-报警-控制器显示记录","t":"m","stem":"控制器报警时屏幕上通常显示的火警要素有（　）。","opts":["报警设备的类型","报警发生的部位","报警设备的采购价格","报警发生的时间"],"ans":[0,1,3],"exp":"火警信息应含部位、时间和设备类型等要素；采购价格与消防监控无关。"},{"id":"Q2029","cat":"火灾自动报警系统","g":"多2-报警-控制器显示记录","t":"m","stem":"火灾报警控制器可调阅的运行记录有（　）。","opts":["火警记录","故障记录","联动启动与反馈记录","设备维保合同金额"],"ans":[0,1,2],"exp":"控制器存储火警、故障、启动反馈等运行记录；合同金额不属系统记录内容。"},{"id":"Q2030","cat":"火灾自动报警系统","g":"多2-报警-联动控制器功能","t":"m","stem":"消防联动控制器应具有的功能包括（　）。","opts":["直接喷放灭火剂","接收火灾报警信号","按预设逻辑发出联动控制信号","接收并显示受控设备反馈信号"],"ans":[1,2,3],"exp":"联动控制器按逻辑发出控制指令并接收反馈；灭火剂由灭火系统释放，不由联动控制器喷放。"},{"id":"Q2031","cat":"火灾自动报警系统","g":"多2-报警-联动控制器功能","t":"m","stem":"消防联动控制器手动控制盘（多线盘）的工作特点有（　）。","opts":["每台重要设备对应独立的控制按钮","可直接控制消防水泵、排烟风机的启停","控制指令不依赖总线传输","可自动切断消防设备主电源"],"ans":[0,1,2],"exp":"多线手动盘用专线点对点控制重要设备，不经总线；切断消防设备电源会使其失效，绝不允许。"},{"id":"Q2032","cat":"火灾自动报警系统","g":"多2-报警-联动控制器功能","t":"m","stem":"需同时具备总线控制和手动直接控制的重要设备有（　）。","opts":["防烟排烟风机","消防电梯","消防水泵","火灾显示盘"],"ans":[0,2],"exp":"消防水泵、防烟排烟风机除总线联动外还应能手动直接控制；电梯由专用信号归首，显示盘仅显示。"},{"id":"Q2033","cat":"火灾自动报警系统","g":"多2-报警-控制器供电","t":"m","stem":"火灾报警控制器的供电要求，正确的有（　）。","opts":["备用电源应采用专用蓄电池","主电源应采用消防电源","备用电源可就近取自普通插座","主电源引入线严禁使用电源插头"],"ans":[0,1,3],"exp":"控制器主电为消防电源并直接连接，严禁用插头；备电为专用蓄电池，不能取自普通插座。"},{"id":"Q2034","cat":"火灾自动报警系统","g":"多2-报警-控制器供电","t":"m","stem":"火灾报警控制器主备电源转换应满足（　）。","opts":["切换过程中控制器应停止监视","主电断电后自动切换到备用电源","主电恢复后自动恢复主电供电","备用电源应能自动充电"],"ans":[1,2,3],"exp":"主备电应能自动转换并自动充电，转换期间控制器不得停止监视，否则形成监控盲区。"},{"id":"Q2035","cat":"火灾自动报警系统","g":"多2-报警-总线制特点","t":"m","stem":"总线制火灾自动报警系统的特点有（　）。","opts":["每只探测器单独占用一对导线","布线量小、施工方便","总线短路时影响面较大","探测器与控制器之间通过总线连接"],"ans":[1,2,3],"exp":"总线制共用总线、按地址识别，布线省但短路影响大；每点独占导线是多线制的特点。"},{"id":"Q2036","cat":"火灾自动报警系统","g":"多2-报警-总线隔离器","t":"m","stem":"总线短路隔离器的保护范围与恢复方式，正确的有（　）。","opts":["隔离器动作后须更换熔断元件才能恢复","每只隔离器保护的设备总数不应超过100点","每只隔离器保护的设备总数不应超过32点","隔离器应设置在总线分支处"],"ans":[2,3],"exp":"32点是隔离器的保护上限，100点不符；隔离器动作后可自动恢复，不需要更换元件。"},{"id":"Q2037","cat":"火灾自动报警系统","g":"多2-报警-多线控制方式","t":"m","stem":"点对点连接的多线制系统，其优缺点有（　）。","opts":["每台设备与控制器之间单独连线","必须设置总线短路隔离器","布线量大、扩展不便","可靠性高，不受总线故障影响"],"ans":[0,2,3],"exp":"多线制点对点连接，可靠性高但布线多；短路隔离器是总线制才需要的部件。"},{"id":"Q2038","cat":"火灾自动报警系统","g":"多2-报警-模块信号接入","t":"m","stem":"下列设备的动作信号应通过输入模块接入控制器的有（　）。","opts":["信号阀","压力开关","排烟风机控制箱","水流指示器"],"ans":[0,1,3],"exp":"水流指示器、压力开关、信号阀的开关量状态经输入模块上传；排烟风机控制箱由输出模块控制。"},{"id":"Q2039","cat":"火灾自动报警系统","g":"多2-报警-模块信号接入","t":"m","stem":"关于输入模块的接线与功能，正确的有（　）。","opts":["模块需接入交流220V电源才能工作","接线端子包括总线端子和设备信号输入端子","每个模块在总线中应有独立地址","用于接收现场设备的开关量信号"],"ans":[1,2,3],"exp":"输入模块由总线供电并接收开关量信号，地址唯一；它不接220V交流电源。"},{"id":"Q2040","cat":"火灾自动报警系统","g":"多2-报警-模块供电接线","t":"m","stem":"输出模块驱动排烟阀、送风口时，其接线与供电要求有（　）。","opts":["应能接收控制器发出的启动指令","用于驱动排烟阀、送风口等设备","除总线外一般还需接入直流24V电源","可直接接入220V交流强电驱动设备"],"ans":[0,1,2],"exp":"输出模块接收控制器指令，以DC24V驱动现场执行机构动作；严禁直接接220V交流强电。"},{"id":"Q2041","cat":"火灾自动报警系统","g":"多2-报警-模块地址编码","t":"m","stem":"关于消防模块的地址编码，正确的有（　）。","opts":["地址应与竣工图标注一致","地址可随意编定且无需记录","同一回路内地址可以重复","每个模块在总线中应有独立地址"],"ans":[0,3],"exp":"模块地址应唯一并与图纸一致，便于准确定位故障；地址重复或随意编定会给维护带来困难。"},{"id":"Q2042","cat":"火灾自动报警系统","g":"多2-报警-火灾显示盘功能","t":"m","stem":"火灾显示盘应具有的功能有（　）。","opts":["接收火灾报警控制器送来的火警信号","发出声光报警","向控制器发出联动控制指令","显示报警楼层与部位"],"ans":[0,1,3],"exp":"火灾显示盘只接收并显示控制器送来的火警信息，不能发出联动控制指令。"},{"id":"Q2043","cat":"火灾自动报警系统","g":"多2-报警-火灾显示盘设置","t":"m","stem":"关于火灾显示盘的设置，正确的有（　）。","opts":["其信息来源是火灾报警控制器","宜设置在楼层出入口、走道等明显部位","应能独立探测火灾","一台显示盘可显示所辖楼层的报警信息"],"ans":[0,1,3],"exp":"显示盘是控制器信息的重复显示装置，安装在人员易见处，本身不具备探测功能。"},{"id":"Q2044","cat":"火灾自动报警系统","g":"多2-报警-图形显示装置功能","t":"m","stem":"图形显示装置上可呈现的内容有（　）。","opts":["各楼层平面图","建筑总平面图","水泵电机绝缘电阻值","消防水泵的流量扬程曲线"],"ans":[0,1],"exp":"图形显示装置以图形方式显示总平面图、楼层平面图及设施状态；水泵性能参数不属其显示内容。"},{"id":"Q2045","cat":"火灾自动报警系统","g":"多2-报警-图形显示装置功能","t":"m","stem":"图形显示装置与火灾显示盘的区别，正确的有（　）。","opts":["图形显示装置以图形平面图方式显示","火灾显示盘仅显示本楼层文字信息","图形显示装置设置在消防控制室","火灾显示盘可替代图形显示装置的全部功能"],"ans":[0,1,2],"exp":"两者显示方式、信息范围和安装位置均不同，火灾显示盘不能替代图形显示装置。"},{"id":"Q2046","cat":"火灾自动报警系统","g":"多2-报警-图形显示装置信息","t":"m","stem":"图形显示装置的信息记录与传输功能包括（　）。","opts":["代替联动控制器发出联动指令","记录火灾报警信息","记录消防设施故障信息","向城市消防远程监控中心传送信息"],"ans":[1,2,3],"exp":"图形显示装置负责显示、记录与上传信息，不具有联动控制输出功能。"},{"id":"Q2047","cat":"火灾自动报警系统","g":"多2-报警-消防电话设置","t":"m","stem":"关于消防专用电话系统，正确的有（　）。","opts":["可与普通市话网络合并使用","由消防电话总机、分机和插孔组成","总线制分机可并接在电话总线上","总机可自动拨打119"],"ans":[1,2],"exp":"专用电话网络应独立于市话，采用总线制时分机可并接；向消防队报警须由值班人员人工拨打。"},{"id":"Q2048","cat":"火灾自动报警系统","g":"多2-报警-消防电话设置","t":"m","stem":"消防电话插孔的安装与布置，正确的有（　）。","opts":["手动火灾报警按钮处宜设置","墙上安装时底边距地1.3至1.5m","插孔处应设明显标志","插孔只能设置在消防控制室内"],"ans":[0,1,2],"exp":"插孔设在手报、消火栓按钮等处便于插接，高度与手报一致；并非只设于消防控制室。"},{"id":"Q2049","cat":"火灾自动报警系统","g":"多2-报警-消防电话功能","t":"m","stem":"消防电话总机在通话管理中承担的工作有（　）。","opts":["呼叫任一分机","记录通话时间等信息","接收分机呼叫并显示其部位","自动拨打119报警"],"ans":[0,1,2],"exp":"总机负责呼叫、被叫与记录；向消防队报警须由值班人员人工拨打，系统不能自动代拨。"},{"id":"Q2050","cat":"火灾自动报警系统","g":"多2-报警-广播扬声器设置","t":"m","stem":"走道、大厅内消防应急广播扬声器的布置要求有（　）。","opts":["防火分区内任何部位到最近扬声器距离不应大于25m","民用建筑内额定功率不应小于3W","走道内最后一个扬声器至末端距离不应大于12.5m","扬声器应集中设置在设备夹层内"],"ans":[0,1,2],"exp":"扬声器功率不小于3W，间距25m、末端12.5m；应设在走道、大厅等公共场所而非封闭夹层。"},{"id":"Q2051","cat":"火灾自动报警系统","g":"多2-报警-广播联动播放","t":"m","stem":"消防应急广播与火灾声警报器配合工作时，正确的有（　）。","opts":["广播应能强制切入背景音乐系统","广播音量应低于背景音乐音量","可采取分时交替工作方式","单次语音播放时间宜为10至30秒"],"ans":[0,2,3],"exp":"广播与警报器宜分时交替，单次播放10至30秒；与背景音乐合用时须能强制切入且音量足够。"},{"id":"Q2052","cat":"火灾自动报警系统","g":"多2-报警-广播联动播放","t":"m","stem":"消防应急广播的联动控制要求包括（　）。","opts":["由探测器直接启动扬声器","应能向全楼或指定区域广播","由消防联动控制器按预设逻辑启动","可手动选择广播分区"],"ans":[1,2,3],"exp":"广播由联动控制器或手动选择分区启动；探测器只发报警信号，不能直接驱动扬声器。"},{"id":"Q2053","cat":"火灾自动报警系统","g":"多2-报警-广播系统组成","t":"m","stem":"消防应急广播系统的基本组成包括（　）。","opts":["广播功率放大器","扬声器","音源设备","火灾探测器"],"ans":[0,1,2],"exp":"广播系统由音源、功放、扬声器及传输线路组成；探测器属于火灾报警触发器件。"},{"id":"Q2054","cat":"火灾自动报警系统","g":"多2-报警-警报器声压设置","t":"m","stem":"报警区域内设置火灾声警报器时，下列指标与做法正确的有（　）。","opts":["每个报警区域内应均匀设置","声压级不应小于60dB","应设置在封闭的管道井内","环境噪声大于60dB时应高于背景噪声15dB"],"ans":[0,1,3],"exp":"警报器需均匀布置并保证60dB、且高于背景噪声15dB；管道井内设置无法起到警示作用。"},{"id":"Q2055","cat":"火灾自动报警系统","g":"多2-报警-光警报器位置","t":"m","stem":"在楼梯口、前室等部位安装光警报器时，正确的有（　）。","opts":["应设置在消防电梯前室","可完全代替声警报器使用","不宜与安全出口指示标志灯设在同一面墙上","应设置在每个楼层的楼梯口"],"ans":[0,2,3],"exp":"光警报器设在楼梯口、前室等醒目处，且不宜与安全出口标志灯同墙以免混淆；不能完全替代声警报。"},{"id":"Q2056","cat":"火灾自动报警系统","g":"多2-报警-警报器故障原因","t":"m","stem":"火灾警报器不响或声音明显偏小的原因可能有（　）。","opts":["警报器本身损坏","控制器输出回路故障","警报回路断线或接触不良","警报器安装高度偏高"],"ans":[0,1,2],"exp":"无声或声小多因器件损坏、线路断路或控制输出故障；安装高度只影响听感范围，不是故障原因。"},{"id":"Q2057","cat":"火灾自动报警系统","g":"多2-报警-线路选型电压","t":"m","stem":"报警系统传输线缆的材质与耐压要求有（　）。","opts":["电压等级不应低于交流300/500V","传输线路可采用裸导线","可采用铝芯导线以降低成本","应采用铜芯绝缘导线或铜芯电缆"],"ans":[0,3],"exp":"传输线路须用铜芯线缆且电压等级不低于交流300/500V；铝芯和裸导线均不符合要求。"},{"id":"Q2058","cat":"火灾自动报警系统","g":"多2-报警-线路选型电压","t":"m","stem":"报警与控制系统线路的耐压等级，说法正确的有（　）。","opts":["照明线路可用250V等级导线代替","所有线路均可采用250V等级导线","220/380V控制线路不低于450/750V","传输线路不低于交流300/500V"],"ans":[2,3],"exp":"传输及50V以下控制线路用300/500V等级，220/380V供电线路提高到450/750V；250V等级不符。"},{"id":"Q2059","cat":"火灾自动报警系统","g":"多2-报警-线路暗敷明敷","t":"m","stem":"报警系统线路埋入结构层内敷设时，正确的有（　）。","opts":["应敷设在不燃烧体结构层内","可直接埋设在可燃装修材料中","保护层厚度不宜小于10mm","保护层厚度不宜小于30mm"],"ans":[0,3],"exp":"暗敷要埋入不燃结构层且保护层不小于30mm；10mm不足，更不能埋入可燃材料。"},{"id":"Q2060","cat":"火灾自动报警系统","g":"多2-报警-线路暗敷明敷","t":"m","stem":"报警系统线路裸露在吊顶、墙面敷设时，正确的有（　）。","opts":["矿物绝缘类不燃性电缆可直接明敷","明敷线路可直接固定在可燃吊顶表面","应采用金属管或金属封闭线槽保护","可采用普通塑料线槽敷设"],"ans":[0,2],"exp":"明敷须金属管或金属封闭线槽，矿物绝缘电缆例外；普通塑料线槽不具备防火保护能力。"},{"id":"Q2061","cat":"火灾自动报警系统","g":"多2-报警-管路接线盒","t":"m","stem":"火灾自动报警系统管路加装接线盒的规定，正确的有（　）。","opts":["有1个弯曲时长度每超过20m","有3个弯曲时长度每超过15m","无弯曲时长度每超过30m","有2个弯曲时长度每超过10m"],"ans":[0,2,3],"exp":"无弯30m、1弯20m、2弯10m、3弯8m；3个弯曲时15m的说法不符合要求。"},{"id":"Q2062","cat":"火灾自动报警系统","g":"多2-报警-导线敷设工艺","t":"m","stem":"导线在管内或线槽内敷设时，正确的有（　）。","opts":["导线接头可设在管内并用胶布包扎","不同电压等级的线路不应穿在同一管内","不同电流类别的线路可共用同一槽孔","管内不应有接头或扭结"],"ans":[1,3],"exp":"管内不得有接头，接头只能在接线盒内焊接或用端子连接；不同电压、电流类别线路须分管分槽。"},{"id":"Q2063","cat":"火灾自动报警系统","g":"多2-报警-接地装置要求","t":"m","stem":"报警系统接地干线与接地板的设置要求有（　）。","opts":["应设专用接地干线","采用专用接地装置时接地电阻不应大于4欧","采用共用接地装置时接地电阻不应大于4欧","应在消防控制室设专用接地板"],"ans":[0,1,3],"exp":"专用接地装置接地电阻不大于4欧，共用接地装置时不大于1欧，两者要求不同。"},{"id":"Q2064","cat":"火灾自动报警系统","g":"多2-报警-接地线规格","t":"m","stem":"关于接地线的规格，正确的有（　）。","opts":["接地线可采用铝芯导线敷设","接地板引至各设备的接地线不应小于4平方毫米","专用接地干线铜芯截面不应小于25平方毫米","接地线应采用铜芯绝缘导线"],"ans":[1,2,3],"exp":"专用接地干线不小于25平方毫米、设备接地线不小于4平方毫米，均须采用铜芯绝缘导线。"},{"id":"Q2065","cat":"火灾自动报警系统","g":"多2-报警-接地线规格","t":"m","stem":"报警系统各类接地共用时的要求有（　）。","opts":["接地干线可与动力电缆共管敷设","防雷接地、保护接地与工作接地宜共用接地装置","共用接地应满足其中最小的接地电阻要求","接地线可串联后统一接入接地板"],"ans":[1,2],"exp":"三类接地宜共用并满足最小值；各设备接地线须单独连接，串联或与动力电缆共管均不允许。"},{"id":"Q2066","cat":"火灾自动报警系统","g":"多2-报警-可燃气体系统构成","t":"m","stem":"可燃气体探测报警系统的独立性与接入方式，正确的有（　）。","opts":["探测器不应直接接入火灾报警控制器的探测器回路","应独立组成","必须与火灾探测器共用一个报警回路","由可燃气体报警控制器和可燃气体探测器组成"],"ans":[0,1,3],"exp":"可燃气体系统独立设置，需联动时由可燃气体报警控制器接入消防联动控制器，不得直接挂在报警回路上。"},{"id":"Q2067","cat":"火灾自动报警系统","g":"多2-报警-可燃气体探测器","t":"m","stem":"关于可燃气体探测器的报警设定与安装，正确的有（　）。","opts":["报警设定值不应大于爆炸下限的50%","探测比空气轻的气体宜设在释放源上方","宜安装在通风机排风口正对的位置","报警设定值不应大于爆炸下限的25%"],"ans":[1,3],"exp":"低报设定值不大于25%LEL，安装高度随气体密度确定；排风口附近气流会稀释气体造成漏报。"},{"id":"Q2068","cat":"火灾自动报警系统","g":"多2-报警-可燃气体探测器","t":"m","stem":"可燃气体报警控制器动作后应完成的动作有（　）。","opts":["自动启动消防水泵","显示报警部位","联动关闭燃气紧急切断阀","发出声光报警信号"],"ans":[1,2,3],"exp":"控制器应报警、显示部位并联锁切断气源；启泵属消防联动范畴，与可燃气体报警无直接关系。"},{"id":"Q2069","cat":"火灾自动报警系统","g":"多2-报警-电气火灾监控组成","t":"m","stem":"电气火灾监控系统由哪些部件构成（　）。","opts":["电气火灾监控器","消防电话分机","测温式探测器","剩余电流式探测器"],"ans":[0,2,3],"exp":"系统由监控器及剩余电流、测温、故障电弧等探测器组成；消防电话分机属消防通信设备。"},{"id":"Q2070","cat":"火灾自动报警系统","g":"多2-报警-剩余电流探测器","t":"m","stem":"剩余电流式探测器在配电系统中的装设原则有（　）。","opts":["宜设置在第一级配电柜的出线端","应设置在消防水泵的配电线路中","以设置在低压配电系统首端为基本原则","不宜设置在IT系统的配电线路中"],"ans":[0,2,3],"exp":"剩余电流探测器设在系统首端，IT系统不宜设置，消防配电线路中也不宜设置，以免影响消防设备供电。"},{"id":"Q2071","cat":"火灾自动报警系统","g":"多2-报警-测温探测器","t":"m","stem":"测温式探测器贴装部位与型式的选择，正确的有（　）。","opts":["应设置在电缆接头、端子等发热部位","应设置在远离发热点的配电柜外部","1000V及以下配电线路宜采用接触式布置","1000V以上线路宜选择光栅光纤测温式"],"ans":[0,2,3],"exp":"测温探测器应贴近发热部位，低压线路用接触式，高压线路用光栅光纤或红外式；远离发热点无法有效测温。"},{"id":"Q2072","cat":"火灾自动报警系统","g":"多2-报警-防火门监控器","t":"m","stem":"防火门监控器应具有的功能有（　）。","opts":["显示每樘防火门的开启、关闭状态","直接驱动闭门器使防火门关闭","接收火灾报警控制器送来的火灾报警信号","发出故障报警信号"],"ans":[0,2,3],"exp":"监控器负责监视门状态、报警并接收火警信号；闭门动作由联动模块控制电磁释放器完成。"},{"id":"Q2073","cat":"火灾自动报警系统","g":"多2-报警-防火门联动关闭","t":"m","stem":"常开防火门关闭的联动控制，正确的有（　）。","opts":["一只探测器加一只手报的报警信号也可作为触发信号","触发信号可来自所在防火分区内两只独立火灾探测器","防火门关闭后应自动重新开启以利疏散","防火门关闭后应向消防控制室反馈信号"],"ans":[0,1,3],"exp":"常开防火门按与逻辑联动关闭并反馈信号；关闭后不得自动重开，否则失去分隔作用。"},{"id":"Q2074","cat":"火灾自动报警系统","g":"多2-报警-电源监控系统","t":"m","stem":"消防设备电源监控系统由哪些部件监测电源状态（　）。","opts":["消防设备电源监控器","火灾探测器","电流传感器","电压传感器"],"ans":[0,2,3],"exp":"系统由监控器与电压、电流等传感器组成，监测消防设备电源状态；火灾探测器属火灾报警系统。"},{"id":"Q2075","cat":"火灾自动报警系统","g":"多2-报警-电源监控系统","t":"m","stem":"消防设备电源监控系统能够识别哪些供电异常（　）。","opts":["缺相","电缆接头温度","灭火剂泄漏","过压"],"ans":[0,3],"exp":"过压、欠压、缺相、断路属电源监控参数；灭火剂泄漏和接头温度不属其监测对象。"},{"id":"Q2076","cat":"火灾自动报警系统","g":"多2-报警-远程监控系统","t":"m","stem":"城市消防远程监控系统包含的环节有（　）。","opts":["火警信息终端","用户信息传输装置","现场火灾探测器","监控中心"],"ans":[0,1,3],"exp":"远程监控系统由用户信息传输装置、监控中心、火警信息终端及通信网络组成；探测器属建筑物内系统。"},{"id":"Q2077","cat":"火灾自动报警系统","g":"多2-报警-远程监控系统","t":"m","stem":"用户信息传输装置承担的信息任务有（　）。","opts":["自动启动消防水泵","接收建筑消防设施运行状态信息","将信息传送至监控中心","接收火灾报警控制器的火警信息"],"ans":[1,2,3],"exp":"传输装置负责采集并上传火警与设施状态信息，不具备控制现场消防设备的功能。"},{"id":"Q2078","cat":"火灾自动报警系统","g":"多2-报警-系统调试","t":"m","stem":"系统调试阶段需要逐项试验的工作有（　）。","opts":["控制器功能调试","消防设施年度检测","建筑设计防火审核","消防联动控制逻辑调试"],"ans":[0,3],"exp":"调试针对设备功能与联动逻辑逐项检查；防火审核属设计阶段行政审批，年度检测属使用期检查。"},{"id":"Q2079","cat":"火灾自动报警系统","g":"多2-报警-系统验收","t":"m","stem":"火灾自动报警系统验收时，正确的有（　）。","opts":["验收不合格应整改后重新验收","B类项目不合格也可判定为合格","A类项目应全部合格","验收应由建设单位组织"],"ans":[0,2,3],"exp":"A类项目全部合格是验收通过的前提，不合格须整改复验；B类不合格数量也有严格限制。"},{"id":"Q2080","cat":"火灾自动报警系统","g":"多2-报警-误报原因","t":"m","stem":"探测器频繁误报时，应排查的技术原因有（　）。","opts":["控制器备用电池容量不足","探测器积尘或受污染","安装位置受气流、蒸汽影响","探测器选型与场所不符"],"ans":[1,2,3],"exp":"误报多与污染、选型不当和环境干扰有关；备电容量不足会造成主电故障报警，不引起火警误报。"},{"id":"Q2081","cat":"火灾自动报警系统","g":"多2-报警-主电故障","t":"m","stem":"主电故障报警的排查方向有（　）。","opts":["主电源开关断开","探测器回路短路","市电停电","主电熔断器熔断"],"ans":[0,2,3],"exp":"主电故障指控制器主电源失电或断路；探测器回路短路表现为回路故障，不是主电故障。"},{"id":"Q2391","cat":"火灾自动报警系统","g":"判2-报警-感温选型","t":"j","stem":"相对湿度长期大于95%的场所，宜选择感温火灾探测器。","opts":["正确","错误"],"ans":0,"exp":"高湿场所水蒸气易使感烟探测器误报，规范把高湿场所列为感温探测器的宜选场所。"},{"id":"Q2392","cat":"火灾自动报警系统","g":"判2-报警-感烟禁用","t":"j","stem":"厨房、锅炉房和吸烟室等经常有烟滞留的场所，不宜选用点型感烟火灾探测器。","opts":["正确","错误"],"ans":0,"exp":"这些场所正常就有烟或油雾，感烟探测器会持续误报，宜选用感温探测器。"},{"id":"Q2393","cat":"火灾自动报警系统","g":"判2-报警-设置部位","t":"j","stem":"点型火灾探测器应设置在靠近地面的墙面上，以便尽早接触烟气。","opts":["正确","错误"],"ans":1,"exp":"探测器宜设在顶棚或靠近顶棚的墙面上，烟气上升聚积在顶部，低处安装会严重延迟报警。"},{"id":"Q2394","cat":"火灾自动报警系统","g":"判2-报警-确认灯","t":"j","stem":"探测器的报警确认灯应朝向便于人员观察的主要入口方向。","opts":["正确","错误"],"ans":0,"exp":"确认灯用于现场判断哪只探测器报警，朝向入口便于巡查人员快速定位。"},{"id":"Q2395","cat":"火灾自动报警系统","g":"判2-报警-底座","t":"j","stem":"探测器底座的引入导线可以采用绞接方式连接，只要接触良好即可。","opts":["正确","错误"],"ans":1,"exp":"底座导线必须可靠压接或焊接，绞接处易氧化松动，是报故障和误报的常见原因。"},{"id":"Q2396","cat":"火灾自动报警系统","g":"判2-报警-火焰探测器","t":"j","stem":"红外火焰探测器对白炽灯、阳光等热辐射源不敏感，安装位置不受限制。","opts":["正确","错误"],"ans":1,"exp":"火焰探测器易受阳光、白炽灯、电焊等辐射源干扰，选点时应避开并调整视角。"},{"id":"Q2397","cat":"火灾自动报警系统","g":"判2-报警-避开干扰","t":"j","stem":"探测器的安装位置应避开强电磁干扰和高温、高湿、腐蚀性气体的直接影响。","opts":["正确","错误"],"ans":0,"exp":"环境干扰会造成误报并缩短器件寿命，选点时应先评估场所条件。"},{"id":"Q2398","cat":"火灾自动报警系统","g":"判2-报警-感温线缆","t":"j","stem":"缆式线型感温探测器的感温电缆应紧贴或靠近被保护的发热部位敷设。","opts":["正确","错误"],"ans":0,"exp":"缆式感温靠传导感温，远离发热部位会延迟响应甚至不报警。"},{"id":"Q2399","cat":"火灾自动报警系统","g":"判2-报警-手报标志","t":"j","stem":"手动火灾报警按钮可设置在隐蔽位置，以免被无关人员误按。","opts":["正确","错误"],"ans":1,"exp":"手报应设在明显且便于操作的部位并设明显标志，位置隐蔽会延误报警。"},{"id":"Q2400","cat":"火灾自动报警系统","g":"判2-报警-探测器替换","t":"j","stem":"探测器损坏后，可用接口相同但型号不同的探测器临时替代使用。","opts":["正确","错误"],"ans":1,"exp":"探测器应与控制器匹配并符合原设计参数，型号不同会改变报警特性，应同型替换。"},{"id":"Q2401","cat":"火灾自动报警系统","g":"判2-报警-历史记录","t":"j","stem":"火灾报警控制器只能查询当前的报警信息，不能查询历史报警记录。","opts":["正确","错误"],"ans":1,"exp":"控制器应具备历史事件记录和查询功能，便于事后分析和责任追溯。"},{"id":"Q2402","cat":"火灾自动报警系统","g":"判2-报警-容量余量","t":"j","stem":"火灾报警控制器连接的设备达到额定容量时，可以不再预留余量。","opts":["正确","错误"],"ans":1,"exp":"规范要求控制器留有不少于额定容量10%的余量，供后续增改使用。"},{"id":"Q2403","cat":"火灾自动报警系统","g":"判2-报警-控制盘区别","t":"j","stem":"总线控制盘与多线控制盘功能相同，在联动控制中可以互相替代。","opts":["正确","错误"],"ans":1,"exp":"总线控制盘经模块按编码控制设备，多线控制盘用独立线路直接控制重要设备，二者不能替代。"},{"id":"Q2404","cat":"火灾自动报警系统","g":"判2-报警-主电标志","t":"j","stem":"火灾报警控制器的主电源应有明显的永久性标志，并直接与消防电源连接。","opts":["正确","错误"],"ans":0,"exp":"主电标志便于区分主备电，直接接消防电源可避免被误当作普通负荷断电。"},{"id":"Q2405","cat":"火灾自动报警系统","g":"判2-报警-主电插头","t":"j","stem":"火灾报警控制器的主电源允许采用普通插头与插座连接取电。","opts":["正确","错误"],"ans":1,"exp":"规范严禁控制器主电源使用电源插头，防止插头脱落造成系统失电。"},{"id":"Q2406","cat":"火灾自动报警系统","g":"判2-报警-备电8h","t":"j","stem":"备用电源的容量只需保证控制器在监视状态下连续工作2h即可。","opts":["正确","错误"],"ans":1,"exp":"专用蓄电池应能保证监视状态工作8h后，再在最大负载下工作30min。"},{"id":"Q2407","cat":"火灾自动报警系统","g":"判2-报警-备电故障","t":"j","stem":"控制器报备电故障时，应检查蓄电池电压和备电回路接线是否正常。","opts":["正确","错误"],"ans":0,"exp":"备电故障多因蓄电池亏电、老化或回路断线，属常见故障判断内容。"},{"id":"Q2408","cat":"火灾自动报警系统","g":"判2-报警-主电故障","t":"j","stem":"控制器只报主电故障而报警功能正常，一般说明备用电源已自动投入。","opts":["正确","错误"],"ans":0,"exp":"主电失电后控制器自动转入备电运行，并发出主电故障声光信号。"},{"id":"Q2409","cat":"火灾自动报警系统","g":"判2-报警-消音再响","t":"j","stem":"控制器执行消音后，如再次发生火灾报警，应能重新发出声警报。","opts":["正确","错误"],"ans":0,"exp":"消音只是暂时消除声响，新的火警信号必须再次声报警，防止漏警。"},{"id":"Q2410","cat":"火灾自动报警系统","g":"判2-报警-复位屏蔽","t":"j","stem":"控制器复位后，原先被屏蔽的设备会自动恢复正常的监视状态。","opts":["正确","错误"],"ans":1,"exp":"复位不解除屏蔽，屏蔽须人工解除并登记，防止隐患被长期掩盖。"},{"id":"Q2411","cat":"火灾自动报警系统","g":"判2-报警-警报器高度","t":"j","stem":"火灾警报器壁挂安装时，其底边距地高度应小于1.5m。","opts":["正确","错误"],"ans":1,"exp":"壁挂火灾警报器底边距地高度应大于2.2m，过低易被碰撞且声响扩散受限。"},{"id":"Q2412","cat":"火灾自动报警系统","g":"判2-报警-广播分区","t":"j","stem":"消防应急广播应能按防火分区或楼层选择广播分区，实现分区广播。","opts":["正确","错误"],"ans":0,"exp":"分区广播可先向着火层及相关层广播，避免全楼恐慌影响疏散。"},{"id":"Q2413","cat":"火灾自动报警系统","g":"判2-报警-广播末端","t":"j","stem":"走道末端距最近一个消防应急广播扬声器的距离不应大于25m。","opts":["正确","错误"],"ans":1,"exp":"走道末端距离不应大于12.5m；25m是任意部位到最近扬声器的直线距离限值。"},{"id":"Q2414","cat":"火灾自动报警系统","g":"判2-报警-调试方案","t":"j","stem":"系统调试前应编制调试方案，调试人员应熟悉系统设计和产品技术要求。","opts":["正确","错误"],"ans":0,"exp":"调试方案明确调试内容、方法和分工，是保证调试质量的前置条件。"},{"id":"Q2415","cat":"火灾自动报警系统","g":"判2-报警-电话独立","t":"j","stem":"消防专用电话网络应为独立的通信系统，不应与其他通信线路合用。","opts":["正确","错误"],"ans":0,"exp":"消防电话须在火灾时可靠通话，独立组网可避免交换机故障或占线影响。"},{"id":"Q2416","cat":"火灾自动报警系统","g":"判2-报警-电话插孔","t":"j","stem":"消防专用电话插孔在墙上安装时，其底边距地高度宜为0.8至1.0m。","opts":["正确","错误"],"ans":1,"exp":"电话插孔底边距地宜为1.3至1.5m，过低不便插接、过高不便操作。"},{"id":"Q2417","cat":"火灾自动报警系统","g":"判2-报警-传输线选型","t":"j","stem":"火灾自动报警系统的供电线路和消防联动控制线路应采用耐火铜芯电线电缆。","opts":["正确","错误"],"ans":0,"exp":"供电与联动线路在火灾时仍需工作，故要求耐火；报警总线可用阻燃线缆。"},{"id":"Q2418","cat":"火灾自动报警系统","g":"判2-报警-管内接头","t":"j","stem":"导线在管内或线槽内允许有一个接头，但必须做好绝缘处理。","opts":["正确","错误"],"ans":1,"exp":"管内和线槽内不得有接头或扭结，接头只能设在接线盒内。"},{"id":"Q2419","cat":"火灾自动报警系统","g":"判2-报警-电压分管","t":"j","stem":"不同电压等级的线缆不得穿入同一根保护管内。","opts":["正确","错误"],"ans":0,"exp":"不同电压同管易造成绝缘击穿和相互干扰，合用线槽时也应加隔板分隔。"},{"id":"Q2420","cat":"火灾自动报警系统","g":"判2-报警-接地干线","t":"j","stem":"消防控制室接地板与建筑接地体之间可采用截面10平方毫米的铜芯导线连接。","opts":["正确","错误"],"ans":1,"exp":"规范要求该连接线芯截面不小于25平方毫米，10平方毫米偏小。"},{"id":"Q2421","cat":"火灾自动报警系统","g":"判2-报警-屏蔽接地","t":"j","stem":"屏蔽电缆的屏蔽层应可靠接地，主要用于抑制电磁干扰引起的误报。","opts":["正确","错误"],"ans":0,"exp":"屏蔽层不接地或接地不良会失去屏蔽效果，容易引发误报。"},{"id":"Q2422","cat":"火灾自动报警系统","g":"判2-报警-调试时机","t":"j","stem":"火灾自动报警系统的调试应在施工结束并经检查合格后开始。","opts":["正确","错误"],"ans":0,"exp":"施工未完成或线路未检查就调试，故障难以区分，规范要求施工结束后调试。"},{"id":"Q2423","cat":"火灾自动报警系统","g":"判2-报警-调试顺序","t":"j","stem":"系统调试应先进行联动功能调试，再逐台调试单台设备。","opts":["正确","错误"],"ans":1,"exp":"应先逐台调试控制器、探测器等设备，合格后再进行系统功能和联动调试。"},{"id":"Q2424","cat":"火灾自动报警系统","g":"判2-报警-验收组织","t":"j","stem":"火灾自动报警系统验收应由建设单位组织，设计、施工、监理单位参加。","opts":["正确","错误"],"ans":0,"exp":"验收由建设单位组织、各方参加，共同确认系统是否满足设计与规范要求。"},{"id":"Q2425","cat":"火灾自动报警系统","g":"判2-报警-验收C类","t":"j","stem":"验收时C类项目只要出现不合格项，系统就应判定为不合格。","opts":["正确","错误"],"ans":1,"exp":"只有A类项目不合格才直接判不合格，B、C类允许在规定数量和比例范围内。"},{"id":"Q2426","cat":"火灾自动报警系统","g":"判2-报警-验收资料","t":"j","stem":"系统验收时应提交竣工图、设计变更记录和调试报告等资料。","opts":["正确","错误"],"ans":0,"exp":"资料是验收的前提条件之一，缺资料无法证明施工与调试符合要求。"},{"id":"Q2427","cat":"火灾自动报警系统","g":"判2-报警-隐蔽验收","t":"j","stem":"火灾自动报警系统的隐蔽工程可在系统验收时一并检查，不必隐蔽前验收。","opts":["正确","错误"],"ans":1,"exp":"隐蔽后无法检查，隐蔽工程必须在隐蔽前验收并形成隐蔽工程验收记录。"},{"id":"Q2428","cat":"火灾自动报警系统","g":"判2-报警-短路隔离","t":"j","stem":"某段总线发生短路时，短路隔离器动作可把故障段与总线其余部分隔离。","opts":["正确","错误"],"ans":0,"exp":"隔离器限制故障范围，保证其他回路的设备仍能正常通信。"},{"id":"Q2429","cat":"火灾自动报警系统","g":"判2-报警-故障排查","t":"j","stem":"同一探测器反复报故障，更换探测器后依旧报，应重点检查底座和线路。","opts":["正确","错误"],"ans":0,"exp":"换新探测器仍报故障，说明问题在底座接触、回路断线或干扰源。"},{"id":"Q2430","cat":"火灾自动报警系统","g":"判2-报警-误报原因","t":"j","stem":"感烟探测器频繁误报，常见原因包括积尘、水汽、气流和电磁干扰。","opts":["正确","错误"],"ans":0,"exp":"误报多与环境及污染有关，应先清洁并核查安装位置，再判断器件好坏。"},{"id":"Q2431","cat":"火灾自动报警系统","g":"判2-报警-屏蔽恢复","t":"j","stem":"因故障被屏蔽的探测器，故障排除后应及时解除屏蔽恢复监视。","opts":["正确","错误"],"ans":0,"exp":"长期屏蔽等于该部位失去探测，值班人员应跟踪屏蔽记录并限时恢复。"},{"id":"Q2432","cat":"火灾自动报警系统","g":"判2-报警-显示盘位置","t":"j","stem":"火灾显示盘宜设置在无人经常经过的设备夹层内，以减少误碰。","opts":["正确","错误"],"ans":1,"exp":"火灾显示盘应设在出入口等明显且便于人员观察的部位，设在夹层起不到提示作用。"},{"id":"Q2433","cat":"火灾自动报警系统","g":"判2-报警-图形显示记录","t":"j","stem":"消防控制室图形显示装置应具有报警信息记录和查询功能。","opts":["正确","错误"],"ans":0,"exp":"图形显示装置除显示图形和状态外，还应记录火警、故障等信息供查询。"},{"id":"Q2434","cat":"火灾自动报警系统","g":"判2-报警-模块集中","t":"j","stem":"模块宜相对集中设置在本报警区域的金属模块箱内。","opts":["正确","错误"],"ans":0,"exp":"集中设置便于维护和标识，且模块箱应设在本报警区域范围内。"},{"id":"Q2435","cat":"火灾自动报警系统","g":"判2-报警-模块禁柜","t":"j","stem":"模块可以安装在配电（控制）柜内，以便与受控设备就近接线。","opts":["正确","错误"],"ans":1,"exp":"规范严禁模块设置在配电（控制）柜（箱）内，避免强电干扰和误动作。"},{"id":"Q2436","cat":"火灾自动报警系统","g":"判2-报警-输入模块","t":"j","stem":"输入模块可将水流指示器、压力开关等设备的动作信号传送给控制器。","opts":["正确","错误"],"ans":0,"exp":"输入模块只接收信号不控制设备，用于监视动作和状态反馈。"},{"id":"Q2437","cat":"火灾自动报警系统","g":"判2-报警-手动盘","t":"j","stem":"消防联动控制器的手动控制盘应能直接手动控制消防水泵、防烟排烟风机等。","opts":["正确","错误"],"ans":0,"exp":"重要消防设备除总线联动外，还应能通过手动控制盘直接控制。"},{"id":"Q2438","cat":"火灾自动报警系统","g":"判2-报警-切非范围","t":"j","stem":"消防联动控制器切断非消防电源时，应切断全楼所有非消防负荷，不必分区。","opts":["正确","错误"],"ans":1,"exp":"应按火灾区域及相关区域切断，全楼切断会影响疏散照明和消防作业。"},{"id":"Q2439","cat":"火灾自动报警系统","g":"判2-报警-防火门联动","t":"j","stem":"常开防火门在火灾报警后应由防火门监控器联动关闭，并反馈关闭信号。","opts":["正确","错误"],"ans":0,"exp":"常开防火门平时保持开启，火灾时联动关闭以阻止烟气蔓延。"},{"id":"Q2440","cat":"火灾自动报警系统","g":"判2-报警-卷帘两步","t":"j","stem":"疏散走道上的防火卷帘应在感烟报警后一次降到底，以尽快完成分隔。","opts":["正确","错误"],"ans":1,"exp":"疏散通道上的卷帘先降至距地1.8m供人员疏散，感温报警后再降到底。"},{"id":"Q2441","cat":"火灾自动报警系统","g":"判2-报警-排烟触发","t":"j","stem":"排烟风机应由同一防烟分区内任意一只感烟探测器报警后直接启动。","opts":["正确","错误"],"ans":1,"exp":"排烟风机应以防烟分区内两只独立感烟探测器的报警信号开启排烟口，再以排烟口开启信号启动风机。"},{"id":"Q2442","cat":"火灾自动报警系统","g":"判2-报警-空调停止","t":"j","stem":"火灾报警后，消防联动控制器应联动停止有关部位的空调送风系统。","opts":["正确","错误"],"ans":0,"exp":"空调送风会助长烟气扩散，火灾时应停止送风并关闭相应防火阀。"},{"id":"Q2443","cat":"火灾自动报警系统","g":"判2-报警-分控制室","t":"j","stem":"控制中心报警系统中，各分消防控制室之间不应相互控制。","opts":["正确","错误"],"ans":0,"exp":"分控制室之间可互相传输、显示状态信息，但控制权不得交叉。"},{"id":"Q2444","cat":"火灾自动报警系统","g":"判2-报警-区域值班","t":"j","stem":"区域报警系统的控制器可以设置在无人值班的场所。","opts":["正确","错误"],"ans":1,"exp":"区域报警系统的控制器应设置在有人值班的场所，否则报警无人处置。"},{"id":"Q2445","cat":"火灾自动报警系统","g":"判2-报警-联动型合并","t":"j","stem":"火灾报警控制器与消防联动控制器可以合并设置为一台联动型控制器。","opts":["正确","错误"],"ans":0,"exp":"联动型控制器兼具火灾报警与联动控制功能，中小型工程常用此形式。"},{"id":"Q2446","cat":"火灾自动报警系统","g":"判2-报警-监控信号","t":"j","stem":"电气火灾监控系统的报警信息应能传送到消防控制室图形显示装置。","opts":["正确","错误"],"ans":0,"exp":"监控信息集中到有人值班处显示，才能及时发现漏电和过热隐患。"},{"id":"Q2447","cat":"火灾自动报警系统","g":"判2-报警-电源监控","t":"j","stem":"消防设备电源监控系统应能监测消防设备供电电源的状态并在异常时报警。","opts":["正确","错误"],"ans":0,"exp":"电源监控用于解决消防设备被误断电的问题，可监测电压、电流和缺相等状态。"},{"id":"Q2448","cat":"火灾自动报警系统","g":"判2-报警-可燃气体位置","t":"j","stem":"可燃气体探测器应设置在气体易泄漏和积聚的部位，如管道阀门、接口附近。","opts":["正确","错误"],"ans":0,"exp":"探测器应靠近泄漏源并结合气体密度布置，比空气重的气体宜设在低处。"},{"id":"Q2449","cat":"火灾自动报警系统","g":"判2-报警-自检","t":"j","stem":"控制器应能手动检查其面板上全部指示灯和显示器的功能。","opts":["正确","错误"],"ans":0,"exp":"自检用于日常确认指示灯、显示器是否完好，属于值班检查内容。"},{"id":"Q2450","cat":"火灾自动报警系统","g":"判2-报警-声响区别","t":"j","stem":"火灾报警控制器的火灾报警声信号与故障报警声信号应有明显区别。","opts":["正确","错误"],"ans":0,"exp":"两种声信号应能区分，防止值班人员把故障误判为火警或反之。"},{"id":"Q0627","cat":"自动喷水与消火栓","g":"湿式适用温度","t":"s","stem":"湿式自动喷水灭火系统适用于环境温度不低于4℃且不高于（　）的场所。","opts":["70℃","60℃","80℃","50℃"],"ans":0,"exp":"湿式系统管内充满有压水，低温会冻结、高温易汽化，故适用范围为4℃至70℃。"},{"id":"Q0628","cat":"自动喷水与消火栓","g":"湿式适用温度","t":"s","stem":"环境温度低于4℃的场所不宜采用（　）。","opts":["预作用系统","干式系统","雨淋系统","湿式系统"],"ans":3,"exp":"低温场所管内充水会结冰，应选用干式或预作用系统，湿式系统仅适用于4℃至70℃。"},{"id":"Q0629","cat":"自动喷水与消火栓","g":"湿式原理","t":"s","stem":"湿式系统喷头动作后能立即喷水，是因为报警阀后的配水管道内平时充满（　）。","opts":["泡沫混合液","压缩空气","有压水","有压气体"],"ans":2,"exp":"湿式系统准工作状态时配水管道内充满有压水，喷头动作即喷水，无需排气充水。"},{"id":"Q0630","cat":"自动喷水与消火栓","g":"干式原理","t":"s","stem":"干式系统准工作状态时，报警阀后的配水管道内充有（　）。","opts":["水蒸气","有压气体","有压水","泡沫混合液"],"ans":1,"exp":"干式系统靠有压气体将水压于报警阀供水侧，喷头动作排气降压后阀瓣才开启供水。"},{"id":"Q0631","cat":"自动喷水与消火栓","g":"干式适用","t":"s","stem":"干式系统适用于环境温度低于4℃或高于（　）的场所。","opts":["70℃","60℃","80℃","90℃"],"ans":0,"exp":"干式系统配水管道内不充水，适用于易冻结或温度过高的场所，温度上限为70℃。"},{"id":"Q0632","cat":"自动喷水与消火栓","g":"干式充水","t":"s","stem":"干式系统配水管道充水时间不宜大于（　）。","opts":["2min","3min","5min","1min"],"ans":3,"exp":"充水时间过长会延误喷水，干式系统不宜大于1min，预作用系统不宜大于2min。"},{"id":"Q0633","cat":"自动喷水与消火栓","g":"预作用原理","t":"s","stem":"预作用系统准工作状态时，配水管道内（　）。","opts":["充满泡沫混合液","充满水蒸气","不充水","充满有压水"],"ans":2,"exp":"预作用系统平时管道内充有压气体，火灾报警后排气充水，兼具干式与湿式优点。"},{"id":"Q0634","cat":"自动喷水与消火栓","g":"预作用原理","t":"s","stem":"预作用系统由火灾自动报警系统开启预作用报警阀后，系统转为（　）。","opts":["水幕系统","湿式系统","干式系统","雨淋系统"],"ans":1,"exp":"预作用系统报警后排气充水，闭式喷头动作时按湿式系统方式喷水灭火。"},{"id":"Q0635","cat":"自动喷水与消火栓","g":"预作用充水","t":"s","stem":"预作用系统配水管道充水时间不宜大于（　）。","opts":["2min","1min","3min","5min"],"ans":0,"exp":"预作用系统充水时间不宜大于2min，干式系统不宜大于1min，两者数值不可混用。"},{"id":"Q0636","cat":"自动喷水与消火栓","g":"雨淋系统","t":"s","stem":"雨淋系统采用的喷头是（　）。","opts":["闭式玻璃球喷头","易熔元件喷头","边墙型闭式喷头","开式喷头"],"ans":3,"exp":"雨淋系统为开式系统，报警阀开启后全部开式喷头同时喷水，形成大面积水幕。"},{"id":"Q0637","cat":"自动喷水与消火栓","g":"雨淋系统","t":"s","stem":"雨淋系统适用于（　）的场所。","opts":["忌水的重要设备用房","仅需局部保护的小房间","火势猛烈、蔓延迅速，闭式喷头不能及时喷水","环境温度低于4℃"],"ans":2,"exp":"雨淋系统一经动作全部喷头同时出水，适合火势猛、蔓延快、需快速大流量喷水的场所。"},{"id":"Q0638","cat":"自动喷水与消火栓","g":"雨淋系统","t":"s","stem":"雨淋系统由火灾自动报警系统或传动管控制，自动开启（　）。","opts":["可调式减压阀","雨淋报警阀","湿式报警阀","干式报警阀"],"ans":1,"exp":"雨淋系统靠雨淋报警阀（雨淋阀组）开启供水，阀后管道平时为空管。"},{"id":"Q0639","cat":"自动喷水与消火栓","g":"喷头色标","t":"s","stem":"玻璃球喷头公称动作温度为68℃时，玻璃球颜色为（　）。","opts":["红色","橙色","黄色","绿色"],"ans":0,"exp":"68℃为最常用喷头，色标为红色；橙色57℃、黄色79℃、绿色93℃，不可混淆。"},{"id":"Q0640","cat":"自动喷水与消火栓","g":"喷头色标","t":"s","stem":"玻璃球喷头玻璃球为橙色时，其公称动作温度为（　）。","opts":["68℃","79℃","93℃","57℃"],"ans":3,"exp":"橙色对应57℃，多用于须提前动作的场所；红色68℃为常规场所通用温度。"},{"id":"Q0641","cat":"自动喷水与消火栓","g":"喷头色标","t":"s","stem":"玻璃球喷头玻璃球为黄色时，其公称动作温度为（　）。","opts":["68℃","93℃","79℃","57℃"],"ans":2,"exp":"黄色对应79℃，红色68℃，橙色57℃，按温度由低到高依次为橙、红、黄、绿。"},{"id":"Q0642","cat":"自动喷水与消火栓","g":"报警阀","t":"s","stem":"湿式报警阀的作用是只允许水单方向流入配水管网，并在（　）后报警。","opts":["水箱补水","喷头动作、水流动","系统充水","消防水泵启动"],"ans":1,"exp":"湿式报警阀阀瓣上下压力差使其常闭，喷头动作水流动后阀瓣开启，同时接通报警管路。"},{"id":"Q0643","cat":"自动喷水与消火栓","g":"报警阀","t":"s","stem":"报警阀组安装高度宜为（　），两侧与墙的距离不应小于0.5m。","opts":["1.2m","1.5m","1.1m","0.8m"],"ans":0,"exp":"报警阀组安装高度宜为1.2m，正面与墙距离不应小于1.2m，便于观察和操作。"},{"id":"Q0644","cat":"自动喷水与消火栓","g":"报警阀","t":"s","stem":"干式报警阀开启后配水管道内有压气体排出，阀瓣依靠（　）开启供水。","opts":["气压推动","手动开启","电磁阀吸合","供水侧水压"],"ans":3,"exp":"干式阀靠气压将阀瓣压紧关闭，喷头排气降压后供水侧水压顶开阀瓣。"},{"id":"Q0645","cat":"自动喷水与消火栓","g":"水力警铃","t":"s","stem":"水力警铃在距警铃3m处，声强不应小于（　）。","opts":["80dB","90dB","70dB","60dB"],"ans":2,"exp":"规范要求水力警铃3m处声强不小于70dB，否则值班人员可能听不到报警。"},{"id":"Q0646","cat":"自动喷水与消火栓","g":"水力警铃","t":"s","stem":"水力警铃开始报警的工作压力不应小于（　）。","opts":["0.2MPa","0.05MPa","0.1MPa","0.15MPa"],"ans":1,"exp":"水力警铃工作压力不应小于0.05MPa，压力过低时铃锤不动作或响声微弱。"},{"id":"Q0647","cat":"自动喷水与消火栓","g":"水力警铃","t":"s","stem":"水力警铃应安装在（　）的外墙上。","opts":["公共通道或值班室附近","消防水泵房内","屋顶水箱间","防烟楼梯间内"],"ans":0,"exp":"水力警铃应装在公共通道或值班室附近外墙上，便于人员听到，并应设排水设施。"},{"id":"Q0648","cat":"自动喷水与消火栓","g":"压力开关","t":"s","stem":"压力开关的作用是将水压信号转变为电信号，直接（　）并发出报警。","opts":["开启报警阀","打开末端试水装置","启动排烟风机","启动消防水泵"],"ans":3,"exp":"湿式系统报警阀开启后压力开关动作，信号直接启泵，不依赖火灾报警控制器联动。"},{"id":"Q0649","cat":"自动喷水与消火栓","g":"压力开关","t":"s","stem":"湿式系统中，压力开关安装在（　）的报警管路上。","opts":["配水干管上","消防水池出水管上","延迟器与水力警铃之间","报警阀与延迟器之间"],"ans":2,"exp":"水流经报警阀、延迟器后推动压力开关，再驱动水力警铃，此为报警管路正确顺序。"},{"id":"Q0650","cat":"自动喷水与消火栓","g":"压力开关","t":"s","stem":"湿式报警阀开启、压力开关动作后，消防水泵应（　）。","opts":["不启动","自动启动","只能手动启动","延时30min启动"],"ans":1,"exp":"压力开关动作信号直接启动消防水泵，这是湿式系统自动启泵的主要方式。"},{"id":"Q0651","cat":"自动喷水与消火栓","g":"水流指示器","t":"s","stem":"水流指示器应设置在（　）。","opts":["每个防火分区、每个楼层","每个房间","仅系统最高层","仅报警阀间"],"ans":0,"exp":"为准确指示火灾区域，每个防火分区和每个楼层均应设置水流指示器。"},{"id":"Q0652","cat":"自动喷水与消火栓","g":"水流指示器","t":"s","stem":"水流指示器的作用是（　）。","opts":["直接启动消防水泵","驱动水力警铃","降低系统压力","将水流信号转变为电信号，指示火灾区域"],"ans":3,"exp":"水流指示器只报火警区域、不直接启泵；启泵由压力开关或报警控制器完成。"},{"id":"Q0653","cat":"自动喷水与消火栓","g":"水流指示器","t":"s","stem":"水流指示器应在管道（　）合格后安装。","opts":["保温","支架安装","试压和冲洗","防腐"],"ans":2,"exp":"先试压冲洗再装水流指示器，可避免杂物卡阻浆片造成误报或不报。"},{"id":"Q0654","cat":"自动喷水与消火栓","g":"末端试水","t":"s","stem":"末端试水装置由压力表、试水阀门和（　）组成。","opts":["水流指示器","试水接头","流量计","压力开关"],"ans":1,"exp":"末端试水装置由压力表、试水阀门、试水接头组成，用于检验系统启动与出水。"},{"id":"Q0655","cat":"自动喷水与消火栓","g":"末端试水","t":"s","stem":"末端试水装置试水接头的出水流量系数 p":"水泵房隔墙耐火极限不低于2.00h、楼板不低于1.50h，开向建筑内的门为甲级防火门。"},{"id":"Q1225","cat":"自动喷水与消火栓","g":"给水-泵房防火","t":"s","stem":"消防水泵房开向建筑内的门应采用（　）。","opts":["丙级防火门","普通平开门","甲级防火门","乙级防火门"],"ans":2,"exp":"水泵房属重要设备用房，开向建筑内的门应为甲级防火门，防止火灾烟气侵入。"},{"id":"Q1226","cat":"自动喷水与消火栓","g":"给水-泵房位置","t":"s","stem":"消防水泵房不应设置在地下三层及以下，或室内地面与室外出入口地坪高差大于（　）的地下楼层。","opts":["15m","10m","5m","8m"],"ans":1,"exp":"埋深过大不利于消防人员操作和排水，规范限制水泵房设置深度不超过10m高差。"},{"id":"Q1227","cat":"自动喷水与消火栓","g":"给水-泵房位置","t":"s","stem":"消防水泵房的疏散门应（　）。","opts":["直通室外或安全出口","开向水泵间","开向楼梯间前室","开向消防控制室"],"ans":0,"exp":"水泵房疏散门应直通室外或安全出口，保证火灾时人员能迅速安全撤离。"},{"id":"Q1228","cat":"自动喷水与消火栓","g":"给水-泵房排水","t":"s","stem":"消防水泵房应采取（　）的技术措施，并设置相应的排水设施。","opts":["防雷击","防静电","防腐蚀","防水淹"],"ans":3,"exp":"水泵房一旦被淹将导致消防供水中断，规范要求采取防水淹措施并设置排水设施。"},{"id":"Q1229","cat":"自动喷水与消火栓","g":"给水-分区条件","t":"s","stem":"消防给水系统工作压力大于（　）时，应采用分区供水。","opts":["1.20MPa","2.00MPa","2.40MPa","1.60MPa"],"ans":2,"exp":"系统工作压力大于2.40MPa、栓口静压大于1.0MPa等情形应分区供水，防止管网超压。"},{"id":"Q1230","cat":"自动喷水与消火栓","g":"给水-分区条件","t":"s","stem":"消火栓栓口处静压大于（　）时，消防给水系统应分区供水。","opts":["1.2MPa","1.0MPa","0.5MPa","1.6MPa"],"ans":1,"exp":"栓口静压过大会使水枪反作用力过大、操作困难，超过1.0MPa时应分区供水。"},{"id":"Q1231","cat":"自动喷水与消火栓","g":"给水-分区条件","t":"s","stem":"自动喷水灭火系统报警阀处工作压力大于1.60MPa或喷头处工作压力大于（　）时，应分区供水。","opts":["1.20MPa","1.00MPa","1.60MPa","0.80MPa"],"ans":0,"exp":"喷头工作压力超过1.20MPa易造成喷头损坏和水量分布不均，此时应采用分区供水。"},{"id":"Q1232","cat":"自动喷水与消火栓","g":"给水-减压阀","t":"s","stem":"减压阀应设置在（　）的供水管上。","opts":["水流双向流动","环状管网","输水干管","水流单向流动"],"ans":3,"exp":"减压阀只能用于单向流动管道，装设在双向流动的输水干管上会造成反向减压失效。"},{"id":"Q1233","cat":"自动喷水与消火栓","g":"给水-减压阀","t":"s","stem":"采用减压阀分区供水时，每一供水分区应设置不少于（　）组减压阀组。","opts":["三组","四组","两组","一组"],"ans":2,"exp":"每组减压阀宜设备用减压阀，保证一组检修时该分区仍能不间断供水。"},{"id":"Q1234","cat":"自动喷水与消火栓","g":"给水-减压阀","t":"s","stem":"采用减压阀减压分区供水时，减压阀宜采用（　）。","opts":["定压式减压阀","比例式减压阀","先导式减压阀","可调式减压阀"],"ans":1,"exp":"减压阀宜采用比例式，阀前压力超过1.20MPa时宜采用先导式减压阀。"},{"id":"Q1235","cat":"自动喷水与消火栓","g":"给水-转输水箱","t":"s","stem":"采用消防水泵转输水箱串联分区供水时，转输水箱的有效储水容积不应小于 小于3.0h，丁戊类厂房仓库不小于2.0h。"},{"id":"Q1246","cat":"自动喷水与消火栓","g":"给水-火灾延续","t":"s","stem":"除高层商业楼、展览楼等以外的其他民用建筑，火灾延续时间不应小于（　）。","opts":["1.5h","2.0h","3.0h","1.0h"],"ans":1,"exp":"其他民用建筑火灾延续时间不小于2.0h，高层商业楼、综合楼等应按3.0h计算。"},{"id":"Q1730","cat":"自动喷水与消火栓","g":"判-湿式适用","t":"j","stem":"湿式自动喷水灭火系统适用于环境温度4至70摄氏度的场所。","opts":["正确","错误"],"ans":0,"exp":"湿式系统管道内充水，温度过低会冻结、过高会汽化。"},{"id":"Q1731","cat":"自动喷水与消火栓","g":"判-干式管道","t":"j","stem":"干式系统的配水管道内平时充有有压水。","opts":["正确","错误"],"ans":1,"exp":"干式系统平时充有有压气体，火灾时排气充水后才喷水。"},{"id":"Q1732","cat":"自动喷水与消火栓","g":"判-预作用","t":"j","stem":"预作用系统在火灾时由火灾自动报警系统开启预作用阀，使管道充水转为湿式系统。","opts":["正确","错误"],"ans":0,"exp":"预作用系统兼顾干式的防冻和湿式的快速喷水，需报警系统配合。"},{"id":"Q1733","cat":"自动喷水与消火栓","g":"判-雨淋系统","t":"j","stem":"雨淋系统适用于火灾水平蔓延速度快、闭式喷头开放不能及时有效覆盖着火区域的场所。","opts":["正确","错误"],"ans":0,"exp":"雨淋系统开式喷头同时喷水，适合蔓延迅速、需大面积喷水的场所。"},{"id":"Q1734","cat":"自动喷水与消火栓","g":"判-危险等级","t":"j","stem":"自动喷水灭火系统设置场所的火灾危险等级分为轻危险级、中危险级和严重危险级三类。","opts":["正确","错误"],"ans":1,"exp":"应为四级，除轻、中、严重危险级外还包括仓库危险级，仓库分级另有单独规定。"},{"id":"Q1735","cat":"自动喷水与消火栓","g":"判-喷头色标","t":"j","stem":"公称动作温度为68摄氏度的闭式喷头，其玻璃球色标为红色。","opts":["正确","错误"],"ans":0,"exp":"68摄氏度红色是最常用的喷头色标，用于一般场所。"},{"id":"Q1736","cat":"自动喷水与消火栓","g":"判-喷头色标","t":"j","stem":"公称动作温度为79摄氏度的闭式喷头，其玻璃球色标为绿色。","opts":["正确","错误"],"ans":1,"exp":"79摄氏度对应黄色，绿色对应93摄氏度。"},{"id":"Q1737","cat":"自动喷水与消火栓","g":"判-喷头温度","t":"j","stem":"闭式喷头的公称动作温度宜高于环境最高温度30摄氏度。","opts":["正确","错误"],"ans":0,"exp":"温差30摄氏度可避免环境温度波动引起喷头误动作。"},{"id":"Q1738","cat":"自动喷水与消火栓","g":"判-报警阀","t":"j","stem":"湿式系统一个报警阀组控制的喷头数不宜超过500只。","opts":["正确","错误"],"ans":1,"exp":"湿式系统一个报警阀组控制的喷头数不宜超过800只。"},{"id":"Q1739","cat":"自动喷水与消火栓","g":"判-报警阀组","t":"j","stem":"每个报警阀组供水的最高与最低位置喷头，其高程差不宜大于50m。","opts":["正确","错误"],"ans":0,"exp":"高程差过大会造成配水不均，按50m控制。"},{"id":"Q1740","cat":"自动喷水与消火栓","g":"判-末端试水","t":"j","stem":"末端试水装置应设置在每个报警阀组控制的最有利点喷头处。","opts":["正确","错误"],"ans":1,"exp":"应设在最不利点喷头处，才能检验系统最不利工况。"},{"id":"Q1741","cat":"自动喷水与消火栓","g":"判-末端试水","t":"j","stem":"末端试水装置由试水阀、压力表和试水接头组成。","opts":["正确","错误"],"ans":0,"exp":"末端试水装置用于检验水流指示器、报警阀和系统压力。"},{"id":"Q1742","cat":"自动喷水与消火栓","g":"判-末端试水","t":"j","stem":"末端试水装置的出水应直接排放在地面上。","opts":["正确","错误"],"ans":1,"exp":"应采用孔口出流方式排入排水管道，避免地面积水和误判。"},{"id":"Q1743","cat":"自动喷水与消火栓","g":"判-喷水强度","t":"j","stem":"中危险一级场所的喷水强度不应低于6L/（min·㎡）。","opts":["正确","错误"],"ans":0,"exp":"轻危险级4、中危险一级6、中危险二级8，是基本设计参数。"},{"id":"Q1744","cat":"自动喷水与消火栓","g":"判-最不利压力","t":"j","stem":"自动喷水灭火系统最不利点处喷头的工作压力不应低于0.05MPa。","opts":["正确","错误"],"ans":0,"exp":"最不利点压力不足将导致喷水强度达不到设计要求。"},{"id":"Q1745","cat":"自动喷水与消火栓","g":"判-配水压力","t":"j","stem":"自动喷水灭火系统配水管道的工作压力不应大于1.60MPa。","opts":["正确","错误"],"ans":1,"exp":"配水管道工作压力不应大于1.20MPa，超压易损坏管件。"},{"id":"Q1746","cat":"自动喷水与消火栓","g":"判-水流指示","t":"j","stem":"水流指示器的主要作用是在火灾时自动启动消防水泵。","opts":["正确","错误"],"ans":1,"exp":"水流指示器用于报告火灾发生部位，启泵由压力开关等完成。"},{"id":"Q1747","cat":"自动喷水与消火栓","g":"判-水力警铃","t":"j","stem":"水力警铃与报警阀的连接管道管径应为20mm，总长不宜大于20m。","opts":["正确","错误"],"ans":0,"exp":"管路过长或管径过小会造成警铃响度不足。"},{"id":"Q1748","cat":"自动喷水与消火栓","g":"判-水泵操作","t":"j","stem":"消防水泵应能自动启动，但不应设置手动启停装置。","opts":["正确","错误"],"ans":1,"exp":"消防水泵应同时具备自动启动和手动启停功能。"},{"id":"Q1749","cat":"自动喷水与消火栓","g":"判-备用泵","t":"j","stem":"消防水泵备用泵的工作能力不应小于最小一台工作泵。","opts":["正确","错误"],"ans":1,"exp":"备用泵的工作能力不应小于最大一台工作泵。"},{"id":"Q1750","cat":"自动喷水与消火栓","g":"判-水池水位","t":"j","stem":"消防水池应设置就地水位显示装置，并应在消防控制室或值班室显示水位。","opts":["正确","错误"],"ans":0,"exp":"就地显示加远程显示，便于值班人员掌握储水情况。"},{"id":"Q1751","cat":"自动喷水与消火栓","g":"判-室内栓","t":"j","stem":"室内消火栓栓口距地面的安装高度宜为1.1m。","opts":["正确","错误"],"ans":0,"exp":"1.1m便于人员连接水带和操作，是通用安装高度。"},{"id":"Q1752","cat":"自动喷水与消火栓","g":"判-室内栓","t":"j","stem":"高层建筑室内消火栓的间距不应大于50m。","opts":["正确","错误"],"ans":1,"exp":"高层建筑、甲乙类厂房室内消火栓间距不应大于30m。"},{"id":"Q1928","cat":"自动喷水与消火栓","g":"多-系统类型","t":"m","stem":"下列场所宜采用预作用自动喷水灭火系统的有（　）。","opts":["准工作状态时严禁管道漏水","准工作状态时严禁误喷","替代干式系统","环境温度长期高于70℃"],"ans":[0,1,2],"exp":"预作用系统适用于严禁漏水、严禁误喷及替代干式的场所；温度高于70℃应采用干式系统，D错。"},{"id":"Q1929","cat":"自动喷水与消火栓","g":"多-系统类型","t":"m","stem":"关于湿式自动喷水灭火系统，正确的有（　）。","opts":["适用 括（　）。","opts":["围护结构及门窗的耐火极限不宜低于0.5h","围护结构允许压强不宜低于800Pa","应设泄压口，并宜设在防护区净高的2/3以上","防护区不得开设任何门窗"],"ans":[0,2],"exp":"允许压强不宜低于1200Pa，B的800Pa错；防护区需设可自行关闭的门窗，D错。"},{"id":"Q1985","cat":"气体与泡沫灭火系统","g":"多-防护区","t":"m","stem":"关于气体灭火系统的启动方式，正确的有（　）。","opts":["机械应急操作","由火灾报警控制器直接控制灭火剂喷放","自动启动","手动启动"],"ans":[0,2,3],"exp":"气体灭火系统应有自动、手动和机械应急三种启动方式；喷放由气体灭火控制器执行，报警控制器不直接喷放，B错。"},{"id":"Q1986","cat":"气体与泡沫灭火系统","g":"多-泡沫分类","t":"m","stem":"泡沫灭火系统按发泡倍数可分为（　）。","opts":["低倍数系统，发泡倍数小于20","中倍数系统，发泡倍数20至200","高倍数系统，发泡倍数大于500","超高倍数系统，发泡倍数大于1000"],"ans":[0,1],"exp":"高倍数泡沫发泡倍数大于200，C的500错；没有超高倍数分类，D错。"},{"id":"Q1987","cat":"气体与泡沫灭火系统","g":"多-泡沫分类","t":"m","stem":"关于泡沫灭火系统，正确的有（　）。","opts":["低倍数泡沫主要用于扑救非水溶性液体火灾","水成膜泡沫液可在油面形成抑制蒸发的膜","抗溶泡沫液适用于扑救水溶性液体火灾","可用于扑救带电设备火灾"],"ans":[0,1,2],"exp":"低倍数泡沫适用非水溶性液体火灾，水成膜泡沫能形成抑制膜，抗溶泡沫用于水溶性液体；泡沫导电，不能扑救带电设备，D错。"},{"id":"Q2324","cat":"气体与泡沫灭火系统","g":"多2-气体-系统分类","t":"m","stem":"气体灭火系统按应用方式可分为（　）。","opts":["局部应用灭火系统","预制灭火系统","管网灭火系统","全淹没灭火系统"],"ans":[0,3],"exp":"管网与预制是按系统结构形式划分的类别，不属应用方式。"},{"id":"Q2325","cat":"气体与泡沫灭火系统","g":"多2-气体-系统分类","t":"m","stem":"组合分配气体灭火系统的特点有（　）。","opts":["各防护区共用同一套管网和喷嘴","任一时刻各防护区同时喷放","可减少设备与灭火剂用量","一套储存装置保护两个及以上防护区"],"ans":[2,3],"exp":"组合分配系统经选择阀分别供液，各防护区有独立管网，也不同时喷放。"},{"id":"Q2326","cat":"气体与泡沫灭火系统","g":"多2-气体-系统分类","t":"m","stem":"单元独立系统的特点有（　）。","opts":["多个防护区共用一套储存装置","系统之间互不影响","需设选择阀进行分配","适用相距较远或不宜组合的防护区"],"ans":[1,3],"exp":"共用储存装置并设选择阀的是组合分配系统，单元独立系统不设选择阀。"},{"id":"Q2327","cat":"气体与泡沫灭火系统","g":"多2-七氟丙烷-特点","t":"m","stem":"七氟丙烷灭火系统的特点有（　）。","opts":["灭火效率高、灭火浓度低","喷放后不留残渣，不污损设备","电绝缘性能好","主要靠把氧浓度降到10%以下灭火"],"ans":[0,1,2],"exp":"七氟丙烷以化学抑制为主；靠大幅降氧的是IG541与二氧化碳。"},{"id":"Q2328","cat":"气体与泡沫灭火系统","g":"多2-七氟丙烷-特点","t":"m","stem":"七氟丙烷灭火设计浓度，说法正确的有（　）。","opts":["所有防护区一律按5%设计","图书、档案、文物资料库为10%","电子计算机房、通讯机房为8%","油浸变压器室、配电室为9%"],"ans":[1,2,3],"exp":"设计浓度按防护对象确定，图书档案10%、机房8%、油浸设备9%。"},{"id":"Q2329","cat":"气体与泡沫灭火系统","g":"多2-二氧化碳-特点","t":"m","stem":"二氧化碳灭火系统的特点有（　）。","opts":["适用于人员经常停留的场所","灭火机理为窒息和冷却","灭火后不留痕迹，不污损设备","可用于扑救钾、钠等金属火灾"],"ans":[1,2],"exp":"二氧化碳不能扑救活泼金属火灾，此类火灾须用D类专用灭火剂。"},{"id":"Q2330","cat":"气体与泡沫灭火系统","g":"多2-二氧化碳-特点","t":"m","stem":"二氧化碳灭火系统不适用的物质有（　）。","opts":["金属氢化物","汽油、柴油等甲、乙类液体","硝化纤维、火药等含氧化剂的化学制品","钾、钠、镁、钛等活泼金属"],"ans":[0,2,3],"exp":"汽油、柴油是二氧化碳系统的主要保护对象之一，属干扰项。"},{"id":"Q2331","cat":"气体与泡沫灭火系统","g":"多2-二氧化碳-特点","t":"m","stem":"二氧化碳灭火系统按储存压力可分为（　）。","opts":["中压系统","常压系统","高压系统","低压系统"],"ans":[2,3],"exp":"二氧化碳只有高压与低压两种储存方式，无中压、常压之分。"},{"id":"Q2332","cat":"气体与泡沫灭火系统","g":"多2-IG541-特点","t":"m","stem":"IG541混合气体灭火系统的特点有（　）。","opts":["通过降低防护区氧浓度实现灭火","喷放时会产生大量冷凝水","以化学抑制作用为主要灭火机理","由氮气、氩气和二氧化碳混合而成"],"ans":[0,3],"exp":"IG541属物理灭火，喷放无明显降温，也不产生冷凝水。"},{"id":"Q2333","cat":"气体与泡沫灭火系统","g":"多2-IG541-特点","t":"m","stem":"关于IG541系统，说法正确的有（　）。","opts":["灭火设计浓度一般为37%至43%","储存压力有15MPa和20MPa两种","喷放后必须彻底清洗防护区设备","氮气占52%、氩气占40%、二氧化碳占8%"],"ans":[0,1,3],"exp":"IG541喷放后无残留，不需清洗设备，末项不成立。"},{"id":"Q2334","cat":"气体与泡沫灭火系统","g":"多2-气体-灭火机理","t":"m","stem":"气体灭火剂的灭火机理包括（　）。","opts":["化学抑制作用，中断燃烧链式反应","乳化作用，在液体表面形成乳化层","冷却作用，吸收燃烧区热量","隔离作用，覆盖可燃物表面"],"ans":[0,2],"exp":"乳化是水喷雾的机理；覆盖隔离属泡沫灭火，均不属气体灭火剂。"},{"id":"Q2335","cat":"气体与泡沫灭火系统","g":"多2-气体-灭火机理","t":"m","stem":"关于七氟丙烷的灭火机理，说法正确的有（　）。","opts":["通过化学催化中断燃烧链式反应","灭火中吸收热量，有一定冷却作用","分解产物中含氟化氢等有害气体","主要靠覆盖可燃物隔绝空气"],"ans":[0,1,2],"exp":"七氟丙烷不靠覆盖灭火，其分解产物氟化氢是防护重点。"},{"id":"Q2336","cat":"气体与泡沫灭火系统","g":"多2-气体-灭火机理","t":"m","stem":"气体灭火对防护区氧浓度的影响，说法正确的有（　）。","opts":["各类气体系统都允许人员在其中长时间停留","IG541把氧浓度降到15%以下灭火","二氧化碳灭火时氧浓度很低，人员必须撤离","七氟丙烷喷放后氧浓度会降至8%以下"],"ans":[1,2],"exp":"七氟丙烷主要靠化学抑制，氧浓度下降不明显；喷放后严禁人员停留。"},{"id":"Q2337","cat":"气体与泡沫灭火系统","g":"多2-气体-启动方式","t":"m","stem":"气体灭火系统应具备的启动方式有（　）。","opts":["远程广播启动","自动控制启动","手动控制启动","机械应急操作启动"],"ans":[1,2,3],"exp":"规范要求自动、手动、机械应急三种启动方式，无广播启动。"},{"id":"Q2338","cat":"气体与泡沫灭火系统","g":"多2-气体-启动方式","t":"m","stem":"关于气体灭火系统延时喷放，说法正确的有（　）。","opts":["延迟期内应发出声光报警","延迟期内应自动开启防护区通风机","自动启动时应设延迟喷射时间","延迟时间一般不宜大于30s"],"ans":[0,2,3],"exp":"喷放前应关闭通风机和空调，开启通风会使灭火剂流失。"},{"id":"Q2339","cat":"气体与泡沫灭火系统","g":"多2-气体-启动方式","t":"m","stem":" "轻危险级A类场所保护距离25m，危险级越低允许的保护距离越大。"},{"id":"Q0754","cat":"灭火器与消防水源","g":"B类保护距离","t":"s","stem":"B、C类火灾严重危险级场所，手提式灭火器的最大保护距离为（　）。","opts":["9m","12m","15m","20m"],"ans":0,"exp":"B、C类场所保护距离：严重9m、中12m、轻15m，均短于同级别A类场所。"},{"id":"Q0755","cat":"灭火器与消防水源","g":"B类保护距离","t":"s","stem":"B、C类火灾中危险级场所，手提式灭火器的最大保护距离为（　）。","opts":["9m","15m","20m","12m"],"ans":3,"exp":"中危险级B、C类场所为12m，液体火灾蔓延快，保护距离小于固体火灾场所。"},{"id":"Q0756","cat":"灭火器与消防水源","g":"B类保护距离","t":"s","stem":"B、C类火灾轻危险级场所，手提式灭火器的最大保护距离为（　）。","opts":["9m","20m","15m","12m"],"ans":2,"exp":"轻危险级B、C类场所为15m，是B类场所中允许的最长保护距离。"},{"id":"Q0757","cat":"灭火器与消防水源","g":"A类级别","t":"s","stem":"A类火灾严重危险级场所，单具灭火器的最小配置灭火级别为（　）。","opts":["4A","3A","2A","1A"],"ans":1,"exp":"A类单具最小配置级别：严重3A、中2A、轻1A，配置时不得低于该级别。"},{"id":"Q0758","cat":"灭火器与消防水源","g":"A类级别","t":"s","stem":"A类火灾中危险级场所，单具灭火器的最小配置灭火级别为（　）。","opts":["2A","3A","1A","4A"],"ans":0,"exp":"中危险级A类场所单具灭火器不小于2A，可选用5kgABC干粉等规格。"},{"id":"Q0759","cat":"灭火器与消防水源","g":"A类级别","t":"s","stem":"A类火灾轻危险级场所，单具灭火器的最小配置灭火级别为（　）。","opts":["2A","3A","4A","1A"],"ans":3,"exp":"轻危险级A类场所单具不小于1A，是三类场所中的最低要求。"},{"id":"Q0760","cat":"灭火器与消防水源","g":"使用方法","t":"s","stem":"使用手提式灭火器灭火时，操作者应站在（　）。","opts":["火源正前方","任意位置","上风方向","下风方向"],"ans":2,"exp":"站在上风方向可避免烟气和火焰灼伤，也便于灭火剂有效覆盖火源。"},{"id":"Q0761","cat":"灭火器与消防水源","g":"使用方法","t":"s","stem":"使用干粉灭火器扑救液体火灾时，应将喷嘴对准（　）。","opts":["容器外壁","火焰根部","火焰上部","液面中心上方"],"ans":1,"exp":"对准火焰根部由近及远左右扫射，直接冲击液面会使液体飞溅扩大火势。"},{"id":"Q0762","cat":"灭火器与消防水源","g":"使用方法","t":"s","stem":"使用二氧化碳灭火器时，应特别注意（　）。","opts":["防止手部冻伤，并在狭小空间防窒息","防止干粉进入眼睛","防止泡沫飞溅","防止水渍污染"],"ans":0,"exp":"喷筒温度极低易冻伤，须握木柄；二氧化碳浓度高会致人窒息，用后应通风。"},{"id":"Q0763","cat":"灭火器与消防水源","g":"灭火器检查","t":"s","stem":"灭火器设置在室外时，应采取（　）措施。","opts":["保温","防雷","防冻胀","防雨、防晒、防潮"],"ans":3,"exp":"室外设置应有防雨防晒防潮措施，避免筒体腐蚀和压力表受环境影响失准。"},{"id":"Q0764","cat":"灭火器与消防水源","g":"灭火器检查","t":"s","stem":"灭火器箱不应（　），并应设置明显标识。","opts":["靠墙设置","成组布置","上锁","落地摆放"],"ans":2,"exp":"灭火器箱上锁会延误取用，紧急时无法打开，规范明确要求不得上锁。"},{"id":"Q0765","cat":"灭火器与消防水源","g":"市政给水","t":"s","stem":"城市消防给水系统按水压可分为高压、临时高压和（　）系统。","opts":["负压","低压","中压","常压"],"ans":1,"exp":"按水压分为高压、临时高压、低压三类，低压系统灭火时需消防车加压。"},{"id":"Q0766","cat":"灭火器与消防水源","g":"市政给水","t":"s","stem":"市政给水管网作为消防水源时，应满足消防用水量和（　）的要求。","opts":["水压","水质","水温","管径"],"ans":0,"exp":"市政给水须同时满足水量和水压，二者缺一都不能作为可靠的消防水源。"},{"id":"Q0767","cat":"灭火器与消防水源","g":"市政给水","t":"s","stem":"市政给水的水量、水压不能满足消防要求时，应设置（　）。","opts":["高位水箱","稳压泵","水泵接合器","消防水池"],"ans":3,"exp":"此时须设消防水池储存消防用水，并由消防水泵加压供水。"},{"id":"Q0768","cat":"灭火器与消防水源","g":"天然水源","t":"s","stem":"天然水源作为消防水源时，应保证（　）仍能满足消防用水量。","opts":["平水期平均水位","任意水位","枯水期最低水位","丰水期最高水位"],"ans":2,"exp":"设计必须以最不利的枯水期最低水位核算储水量，否则火灾时可能取不到水。"},{"id":"Q0769","cat":"灭火器与消防水源","g":"天然水源","t":"s","stem":"以江、河、湖、库等天然水源作消防水源时，应设置（　）。","opts":["高位消防水箱","可靠的取水设施和消防车道","空气泡沫比例混合器","固定消防水泵"],"ans":1,"exp":"须设取水口或取水码头并配消防车道，保证消防车能靠近取水。"},{"id":"Q0770","cat":"灭火器与消防水源","g":"天然水源","t":"s","stem":"利用天然水源取水时，其取水口的（　）应满足消防车吸水要求。","opts":["吸水高度不大于6m","距建筑不小于5m","设在常水位以上","设在水流湍急处"],"ans":0,"exp":"吸水高度超过6m消防车泵无法吸水，取水口应设在最低水位以下并保证吸水高度。"},{"id":"Q0771","cat":"灭火器与消防水源","g":"消防水池水源","t":"s","stem":"消防水池的有效容积应满足（　）内室内外消防用水量之和。","opts":["火灾初起10min","1h","2h","火灾延续时间"],"ans":3,"exp":"水池按火灾延续时间计算，初期10min用水由高位消防水箱保证，二者不可混淆。"},{"id":"Q0772","cat":"灭火器与消防水源","g":"消防水池水源","t":"s","stem":"消防用水与其他用水合用水池时，应采取（　）的技术措施。","opts":["自动补水","水位远传报警","确保消防用水量不被挪用","防止水质污染"],"ans":2,"exp":"合用水池必须有保证消防储水不被占用的措施，如设溢流墙、消防水位控制等。"},{"id":"Q0773","cat":"灭火器与消防水源","g":"消防水池水源","t":"s","stem":"消防水池应设置（　），以便现场直观掌握储水情况。","opts":["通气管","就地水位显示装置","液位控制阀","溢流喇叭口"],"ans":1,"exp":"就地水位显示装置与消防控制室显示装置配套设置，是判断储水是否充足的基本手段。"},{"id":"Q0774","cat":"灭火器与消防水源","g":"高位水箱","t":"s","stem":"高位消防水箱的储水量应满足（　）的消防用水量。","opts":["初期火灾","整个火灾延续时间","最大一次火灾","最不利点喷头"],"ans":0,"exp":"高位水箱只保证初期火灾用水，火灾延续时间内的用水由消防水池和消防水泵保证。"},{"id":"Q0775","cat":"灭火器与消防水源","g":"高位水箱","t":"s","stem":"消防水箱应设置（　），防止进水时水从水箱顶部溢出。","opts":["减压阀","倒流防止器","水锤消除器","溢流管"],"ans":3,"exp":"溢流管管径应满足进水量排放，且不得与排水系统直接连接，防止污染。"},{"id":"Q0776","cat":"灭火器与消防水源","g":"危险等级","t":"s","stem":"灭火器配置场所的危险等级分为严 "Q1174","cat":"灭火器与消防水源","g":"给水-天然水源","t":"s","stem":"以江河作为消防水源时，其取水口宜设置在水流平缓、河床稳定且（　）的河段。","opts":["位于弯道外侧","紧邻堤岸","水深满足取水要求","靠近航道中心"],"ans":2,"exp":"取水口应避开冲刷和淤积河段，选在水流平缓、河床稳定、水深满足取水要求的位置。"},{"id":"Q1175","cat":"灭火器与消防水源","g":"给水-天然水源","t":"s","stem":"天然水源取水口处应设置格栅或滤网，其主要作用是（　）。","opts":["便于计量取水量","防止杂草杂物堵塞取水口","减小水流流速","防止人员落水"],"ans":1,"exp":"格栅和滤网可拦截杂草、漂浮物，防止取水口及吸水管堵塞，保证取水可靠。"},{"id":"Q1176","cat":"灭火器与消防水源","g":"给水-天然水源","t":"s","stem":"寒冷地区以天然水源作为消防水源时，取水口应采取（　）措施。","opts":["防冻和防冰凌","防雷和防静电","防腐蚀和防渗漏","防晒和防雨"],"ans":0,"exp":"结冰期取水口易被冰凌堵塞，规范要求采取防冻、防冰凌措施保证冬季可靠取水。"},{"id":"Q1177","cat":"灭火器与消防水源","g":"给水-市政水源","t":"s","stem":"采用市政给水管网作为消防水源时，该管网应满足消防给水的（　）要求。","opts":["管材和埋深","水质和浊度","管径和坡度","设计流量和压力"],"ans":3,"exp":"市政给水管网作为消防水源，必须同时满足消防给水设计流量和压力要求。"},{"id":"Q1178","cat":"灭火器与消防水源","g":"给水-市政水源","t":"s","stem":"市政给水管网为枝状或只有一条入户引入管时，室外消火栓设计流量大于（　）时应设置消防水池。","opts":["15L/s","25L/s","20L/s","10L/s"],"ans":2,"exp":"一路消防供水且室外消火栓设计流量大于20L/s，或建筑高度大于50m时，应设置消防水池。"},{"id":"Q1179","cat":"灭火器与消防水源","g":"给水-市政水源","t":"s","stem":"市政消防给水设计流量小于建筑室内外消防给水设计流量时，应设置（　）。","opts":["消防水泵接合器","消防水池","消防水箱","稳压泵"],"ans":1,"exp":"市政消防供水能力不足时应设消防水池补足水量，这是设置消防水池的三种情形之一。"},{"id":"Q1180","cat":"灭火器与消防水源","g":"给水-水池容积","t":"s","stem":"消防水池的有效容积应满足火灾延续时间内（　）的用水量要求。","opts":["室内和室外消防用水量","室内消防用水量","室外消防用水量","自动喷水灭火系统用水量"],"ans":0,"exp":"消防水池有效容积按火灾延续时间内室内、室外消防用水量之和经计算确定。"},{"id":"Q1181","cat":"灭火器与消防水源","g":"给水-水池容积","t":"s","stem":"采用两路消防供水、火灾时能连续补水且仅设消火栓系统时，消防水池有效容积不应小于（　）。","opts":["100m³","18m³","36m³","50m³"],"ans":3,"exp":"两路供水且连续补水满足要求时，水池有效容积经计算确定，仅设消火栓系统时不小于50m³。"},{"id":"Q1182","cat":"灭火器与消防水源","g":"给水-水池容积","t":"s","stem":"采用两路消防供水且火灾时连续补水能满足要求时，消防水池有效容积经计算确定，但不应小于（　）。","opts":["200m³","500m³","100m³","50m³"],"ans":2,"exp":"规范规定此类消防水池有效容积不应小于100m³，仅设消火栓系统时可放宽至50m³。"},{"id":"Q1183","cat":"灭火器与消防水源","g":"给水-补水时间","t":"s","stem":"消防水池有效总容积大于2000m³时，其补水时间不应大于（　）。","opts":["96h","48h","72h","120h"],"ans":0,"exp":"水池容积过大时补水时间可放宽，但总容积大于2000m³时不应大于96h。"},{"id":"Q1184","cat":"灭火器与消防水源","g":"给水-进水管径","t":"s","stem":"消防水池进水管管径应经计算确定，且不应小于（　）。","opts":["DN50","DN65","DN150","DN100"],"ans":3,"exp":"进水管管径过小会延长补水时间，规范要求不小于DN100，并设液位阀或浮球阀。"},{"id":"Q1185","cat":"灭火器与消防水源","g":"给水-水池分格","t":"s","stem":"消防水池总蓄水有效容积大于1000m³时，应设置（　）能独立使用的消防水池。","opts":["一座分两格","两座","两格","三格"],"ans":1,"exp":"容积大于1000m³时应设两座独立水池，一座检修时另一座仍能保证消防用水。"},{"id":"Q1186","cat":"灭火器与消防水源","g":"给水-水池水位","t":"s","stem":"消防水池应在消防控制中心或值班室设置显示水位的装置，并应有（　）报警水位。","opts":["最高和最低","最高和溢流","最低和事故","正常和最低"],"ans":0,"exp":"水位监测应能发出最高和最低报警水位信号，提醒值班人员及时处理补水或溢流故障。"},{"id":"Q1187","cat":"灭火器与消防水源","g":"给水-取水口","t":"s","stem":"消防水池应设置取水口或取水井，其吸水高度不应大于（　）。","opts":["4.0m","5.0m","8.0m","6.0m"],"ans":3,"exp":"吸水高度过大时消防车泵吸不上水，规范规定取水口吸水高度不应大于6.0m。"},{"id":"Q1188","cat":"灭火器与消防水源","g":"给水-取水口","t":"s","stem":"消防水池取水口（井）与建筑物（水泵房除外）的距离不宜小于（　）。","opts":["10m","25m","15m","5m"],"ans":2,"exp":"取水口距建筑物不宜小于15m，防止火灾时建筑物倒塌或热辐射影响消防车取水。"},{"id":"Q1834","cat":"灭火器与消防水源","g":"判-压力表","t":"j","stem":"手提式灭火器压力表指针在红区表示压力正常。","opts":["正确","错误"],"ans":1,"exp":"指针在绿区表示压力正常，红区为压力不足，黄区为压力过高。"},{"id":"Q1835","cat":"灭火器与消防水源","g":"判-消防水源","t":"j","stem":"消防水源包括市政给水、消防水池和天然水源等。","opts":["正确","错误"],"ans":0,"exp":"多种水源互为补充，是消防给水系统可靠运行的基础。"},{"id":"Q1836","cat":"灭火器与消防水源","g":"判-取用","t":"j","stem":"为不影响美观，灭火器可以设置在隐蔽且不易取用的部位。","opts":["正确","错误"],"ans":1,"exp":"灭火器应设置在明显和便于取用的地点，且不得影响安全疏散。"},{"id":"Q1988","cat":"灭火器与消防水源","g":"多-灭火器配置","t":"m","stem":"关于灭火器的配置，正确的有（　）。","opts":["一个计算单元内配置的灭火器数量不应少于2具","每个设置点的灭火器数量不宜多于3具","灭火器应设置在明显和便于取用的地点","灭火器可直接放置在潮湿地面上不作防护"],"ans":[0,2],"exp":"每个设置点不宜多于5具，B的3具错；灭火器应防潮，D错。"},{"id":"Q1989","cat":"灭火器与消防水源","g":"多-灭火器配置","t":"m","stem":"关于灭火器的检查与维修，正确的有（　）。","opts":["灭火器一经使用可继续存放待下次使用","应定期检查压力表指针是否在绿区","干粉灭火器出厂期满5年应进行首次维修","筒体严重锈蚀、变形的应报废"],"ans":[1,2,3],"exp":"压力表指针应在绿区，干粉灭火器出厂满5年首次维修，筒体严重锈蚀变形应报废；使用后必须重新充装，A错。"},{"id":"Q1990","cat":"灭火器与消防水源","g":"多-消防水源","t":"m","stem":"关于消防水池，正确的有（　）。","opts":["应设置就地水位显示装置","消防水池的补水时间不宜大于24h","应采取保证消防用水不作他用的技术措施","可与生活用水水池合用且不设任何分隔"],"ans":[0,2],"exp":"补水时间不宜大于48h，B的24h ":"判2-监控-备电","t":"j","stem":"火灾报警控制器主电源断电后，备用电源应能自动投入，保证系统连续运行。","opts":["正确","错误"],"ans":0,"exp":"主备电源自动切换是控制器可靠运行的基本条件。"},{"id":"Q2722","cat":"消防控制室监控与维保","g":"判2-监控-备电","t":"j","stem":"备用电源长期不投入使用，就不必进行充放电维护，以免影响主电源供电。","opts":["正确","错误"],"ans":1,"exp":"蓄电池长期不用会失效，应定期充放电维护并做切换试验。"},{"id":"Q2723","cat":"消防控制室监控与维保","g":"判2-监控-图形显示","t":"j","stem":"消防控制室图形显示装置应能显示建筑内消防设施及其所在位置等信息。","opts":["正确","错误"],"ans":0,"exp":"图形显示装置要能定位报警点、显示设施分布，便于快速处置。"},{"id":"Q2724","cat":"消防控制室监控与维保","g":"判2-监控-图形显示","t":"j","stem":"图形显示装置只需显示火灾报警信息，不必显示故障和屏蔽信息。","opts":["正确","错误"],"ans":1,"exp":"图形显示装置需显示报警、故障、屏蔽、联动等各类信息。"},{"id":"Q2725","cat":"消防控制室监控与维保","g":"判2-监控-巡查频次","t":"j","stem":"建筑消防设施巡查中，消防安全重点单位应每日至少一次，其他单位每周至少一次。","opts":["正确","错误"],"ans":0,"exp":"巡查频次按单位性质区分，消防安全重点单位的要求更高。"},{"id":"Q2726","cat":"消防控制室监控与维保","g":"判2-监控-巡查频次","t":"j","stem":"建筑消防设施巡查记录可以事后统一补记，不必在巡查时如实填写。","opts":["正确","错误"],"ans":1,"exp":"巡查记录应随查随记，事后补记属弄虚作假，无法反映真实状态。"},{"id":"Q2727","cat":"消防控制室监控与维保","g":"判2-监控-维保要求","t":"j","stem":"建筑消防设施维修保养后应进行功能试验，确认恢复正常后方可投入使用。","opts":["正确","错误"],"ans":0,"exp":"维保不能只看外观，必须试验合格后才算恢复使用。"},{"id":"Q2728","cat":"消防控制室监控与维保","g":"判2-监控-维保要求","t":"j","stem":"对消防设施进行维护保养时，可以先停用设备，不必通知相关部门和岗位。","opts":["正确","错误"],"ans":1,"exp":"停用消防设施应履行审批、告知和防范措施，完工后及时恢复。"},{"id":"Q2729","cat":"消防控制室监控与维保","g":"判2-监控-清洗除尘","t":"j","stem":"点型感烟探测器积尘严重时应及时清洗，清洗后应进行报警功能试验。","opts":["正确","错误"],"ans":0,"exp":"积尘会造成灵敏度漂移，清洗后必须试验确认可用。"},{"id":"Q2730","cat":"消防控制室监控与维保","g":"判2-监控-清洗除尘","t":"j","stem":"探测器清洗后可以直接装回使用，不必进行报警功能试验。","opts":["正确","错误"],"ans":1,"exp":"清洗可能改变响应特性，装回前必须做功能试验。"},{"id":"Q2731","cat":"消防控制室监控与维保","g":"判2-监控-档案管理","t":"j","stem":"设备更新改造后，消防控制室的图纸资料可以沿用原版本，不必修改。","opts":["正确","错误"],"ans":1,"exp":"设施变更应及时修改图纸资料，否则处置时判断容易出错。"},{"id":"Q2732","cat":"消防控制室监控与维保","g":"判2-监控-标识管理","t":"j","stem":"建筑消防设施应设置明显的标识，标明设施名称、编号和操作方法。","opts":["正确","错误"],"ans":0,"exp":"标识清楚才能在紧急情况下快速找到并正确操作设施。"},{"id":"Q2733","cat":"消防控制室监控与维保","g":"判2-监控-标识管理","t":"j","stem":"为保持环境整洁，消火栓箱和灭火器箱可以用装饰板临时遮挡，不影响 g":"设-年度检测","t":"s","stem":"按照国家规定，单位应当对建筑消防设施每年至少进行（　）全面检测。","opts":["一次","两次","三次","四次"],"ans":0,"exp":"消防法明确要求对建筑消防设施每年至少进行一次全面检测，检测记录应当完整准确并存档。"},{"id":"Q2844","cat":"消防控制室监控与维保","g":"设-停用管理","t":"j","stem":"建筑消防设施因故障维修需要停用时，可以不停用直接带病运行，待下次年度检测时一并修复。","opts":["正确","错误"],"ans":1,"exp":"设施故障应及时修复，确需停用必须落实相应的防范措施，带病运行会严重削弱初期火灾处置能力。"},{"id":"Q2845","cat":"消防控制室监控与维保","g":"设-停用管理","t":"s","stem":"消防设施因维修等原因需要暂时停用时，单位应当（　）。","opts":["停用后不再安排修复","用普通设备替代","采取相应的消防安全防范措施并及时修复","只在年度检测时报告"],"ans":2,"exp":"停用期间必须落实替代性防范措施并尽快修复恢复，确保消防安全不失控。"},{"id":"Q2846","cat":"消防控制室监控与维保","g":"设-消防电源","t":"s","stem":"消防用电设备应采用专用的供电回路，并在（　）设置自动切换装置。","opts":["最末一级配电箱处","总配电室","变压器高压侧","楼层照明箱"],"ans":0,"exp":"消防用电设备由专用回路供电，最末一级配电箱处设自动切换装置，保证主备电源切换可靠。"},{"id":"Q2847","cat":"消防控制室监控与维保","g":"设-消防电源","t":"m","stem":"为保证消防用电可靠性，下列做法正确的有（　）。","opts":["消防用电设备采用专用供电回路","在最末一级配电箱处设置自动切换装置","消防配电线路与其他配电线路分开敷设","将消防用电与普通照明共用同一回路"],"ans":[0,1,2],"exp":"专用回路、末端自动切换、线路分开敷设是基本要求；与普通照明共用回路会因过载停电影响消防用电。"},{"id":"Q2848","cat":"消防控制室监控与维保","g":"设-维保委托","t":"s","stem":"单位可以委托（　）对建筑消防设施进行维护保养。","opts":["任何装修公司","物业保洁公司","消防产品经销商","具备相应条件的消防技术服务机构"],"ans":3,"exp":"维护保养可自行组织，也可委托具备相应条件的消防技术服务机构实施，人员应具备相应能力。"},{"id":"Q2849","cat":"消防控制室监控与维保","g":"设-维护要求","t":"m","stem":"消防设施维护管理的基本要求包括（　）。","opts":["定期检查、检测和维护保养","为节约费用可拆除部分报警设备","建立消防设施档案","发现故障及时修复"],"ans":[0,2,3],"exp":"维护管理要求定期检查检测保养、建立档案、及时修复故障；擅自拆除报警设备属违法行为。"},{"id":"Q2850","cat":"消防控制室监控与维保","g":"设-投入使用","t":"s","stem":"依法应当进行消防验收的建设工程，未经消防验收或者验收不合格的（　）。","opts":["可先使用后补验","禁止投入使用","可由建设单位决定","只需备案即可使用"],"ans":1,"exp":"消防验收不合格的工程禁止投入使用，这是消防法确立的基本制度，与备案抽查不同。"},{"id":"Q2851","cat":"消防控制室监控与维保","g":"设-设施保护","t":"m","stem":"下列行为中，违反消防设施保护要求的有（　）。","opts":["损坏、挪用消防设施和器材","擅自拆除、停用消防设施","占用、堵塞疏散通道","定期维护保养消防设施"],"ans":[0,1,2],"exp":"损坏挪用、擅自拆除停用、占用堵塞通道均违反保护要求；定期维护保养是应当履行的法定义务。"},{"id":"Q2852","cat":"消防控制室监控与维保","g":"控-标准适用","t":"s","stem":"GB 25506《消防控制室通用技术要求》适用于消防控制室的（　）。","opts":["仅建筑设计","仅设备采购","设计、施工、验收及运行维护管理","仅人员培训"],"ans":2,"exp":"该标准对消防控制室的设置、设备配置、值班管 "t":"m","stem":"保护火灾现场时应注意（　）。","opts":["灭火时尽量减少对现场的破坏","劝退无关人员，禁止随意进入","为便于调查先将物品集中堆放","火势可能扩大时及时扩大保护范围"],"ans":[0,1,3],"exp":"前三项均为现场保护要求；随意集中堆放物品会破坏原始痕迹。"},{"id":"Q2993","cat":"消防控制室监控与维保","g":"基-判-现场保护义务","t":"j","stem":"起火单位应当保护火灾现场，接受事故调查，如实提供有关情况。","opts":["正确","错误"],"ans":0,"exp":"保护现场、接受调查、如实提供情况是起火单位的法定义务。"}]</script>

<script>
(function(){
'use strict';

var BANK = JSON.parse(document.getElementById('bank').textContent);
var LS = { wrong: 'xf_exam_wrong', hist: 'xf_exam_hist', seen: 'xf_exam_seen' };
var LETTER = ['A','B','C','D','E'];
var MIX = { s: 0.6, m: 0.2, j: 0.2 };
var TNAME = { s: '单选', m: '多选', j: '判断' };
var POINTS = { s: 1, m: 2, j: 1 };   // 每题分值：单选1分、多选2分、判断1分
var PASS = 60;                        // 及格线（百分制）

function load(k, d){ try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } }
function save(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function shuffle(a){ for (var i=a.length-1; i>0; i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function fmt(sec){ var m=Math.floor(sec/60), s=sec%60; return (m<10?'0':'')+m+':'+(s<10?'0':'')+s; }
function typeOf(q){ return q.t || 's'; }
function pointsOf(q){ return POINTS[typeOf(q)] || 1; }
function isRight(q, a){
  if (a === null || a === undefined) return false;
  if (typeOf(q) === 'm'){
    if (!Array.isArray(a) || !a.length) return false;
    if (a.length !== q.ans.length) return false;
    return a.slice().sort().join(',') === q.ans.slice().sort().join(',');
  }
  return a === q.ans;
}
function answered(a){ return a !== null && a !== undefined && !(Array.isArray(a) && a.length === 0); }
function ansText(q){
  if (typeOf(q) === 'm') return q.ans.slice().sort().map(function(i){ return LETTER[i] + '．' + q.opts[i]; }).join('；');
  return LETTER[q.ans] + '．' + q.opts[q.ans];
}
function myText(q, a){
  if (a === null || a === undefined || (Array.isArray(a) && !a.length)) return '未作答';
  if (typeOf(q) === 'm') return a.slice().sort().map(function(i){ return LETTER[i] + '．' + q.opts[i]; }).join('；');
  return LETTER[a] + '．' + q.opts[a];
}
function quotas(n){
  var s = Math.round(n * MIX.s), m = Math.round(n * MIX.m);
  return { s: s, m: m, j: Math.max(0, n - s - m) };
}

var SEEN = new Set(load(LS.seen, []));
var S = { screen:'setup', paper:[], ans:[], locked:[], idx:0, sheet:false, t0:0, timer:null,
          result:null, size:100, mode:'balanced', fresh:true, confirm:false,
          practice:false, review:false, filter:'all' };

/* ---------- 抽题 ---------- */
function pickFrom(pool, k, balanced){
  if (k <= 0 || !pool.length) return [];
  var groups = {};
  pool.forEach(function(q){ var g = q.g || q.id; (groups[g] = groups[g] || []).push(q); });
  var reps = [];
  Object.keys(groups).forEach(function(g){
    var arr = groups[g], src = arr;
    if (S.fresh){
      var u = arr.filter(function(q){ return !SEEN.has(q.id); });
      if (u.length) src = u;
    }
    reps.push(src[Math.floor(Math.random()*src.length)]);
  });
  shuffle(reps);
  var out = [];
  if (balanced){
    var byCat = {};
    reps.forEach(function(r){ (byCat[r.cat] = byCat[r.cat] || []).push(r); });
    var cats = Object.keys(byCat);
    var total = reps.length;
    var alloc = cats.map(function(c){
      var exact = k * byCat[c].length / total;
      return { c: c, k: Math.floor(exact), f: exact - Math.floor(exact) };
    });
    var left = k - alloc.reduce(function(s,a){ return s + a.k; }, 0);
    alloc.sort(function(a,b){ return b.f - a.f; });
    for (var i=0; i<left; i++){ alloc[i % alloc.length].k++; }
    alloc.forEach(function(a){
      out = out.concat(byCat[a.c].slice(0, Math.min(a.k, byCat[a.c].length)));
    });
  } else {
    out = reps.slice(0, k);
  }
  if (out.length < k){
    var ids = {};
    out.forEach(function(q){ ids[q.id] = 1; });
    var rest = shuffle(pool.filter(function(q){ return !ids[q.id]; }));
    out = out.concat(rest.slice(0, k - out.length));
  }
  return out.slice(0, k);
}

function buildPaper(n, balanced){
  n = Math.min(n, BANK.length);
  var q = quotas(n);
  var byType = { s: [], m: [], j: [] };
  BANK.forEach(function(x){ var t = typeOf(x); (byType[t] = byType[t] || []).push(x); });
  var chosen = [];
  chosen = chosen.concat(pickFrom(byType.s, q.s, balanced));
  chosen = chosen.concat(pickFrom(byType.m, q.m, balanced));
  chosen = chosen.concat(pickFrom(byType.j, q.j, balanced));
  var seenG = {}, uniq = [];
  chosen.forEach(function(x){ var g = x.g || x.id; if (!seenG[g]){ seenG[g] = 1; uniq.push(x); } });
  chosen = uniq;
  if (chosen.length < n){
    var ids = {};
    chosen.forEach(function(x){ ids[x.id] = 1; });
    var rest = shuffle(BANK.filter(function(x){
      var g = x.g || x.id;
      return !ids[x.id] && !seenG[g];
    }));
    chosen = chosen.concat(rest.slice(0, n - chosen.length));
  }
  return shuffle(chosen.slice(0, n));
}

/* ---------- 断点续做 ---------- */
var SESSION_KEY = 'xf_session_v1';
function saveSession(){
  if (S.screen !== 'exam' || !S.paper.length) return;
  save(SESSION_KEY, {
    ids: S.paper.map(function(q){ return q.id; }),
    stems: S.paper.map(function(q){ return q.stem; }),
    ans: S.ans, locked: S.locked, idx: S.idx,
    practice: S.practice, t0: S.t0
  });
}
function clearSession(){ try { localStorage.removeItem(SESSION_KEY); } catch(e){} }
function loadSession(){
  var d = load(SESSION_KEY, null);
  if (!d || !d.ids || !d.ids.length) return null;
  var map = {};
  BANK.forEach(function(q){ map[q.id] = q; });
  var paper = [], ans = [], locked = [];
  for (var i = 0; i < d.ids.length; i++){
    var q = map[d.ids[i]];
    if (!q || q.stem !== d.stems[i]) return null;
    paper.push(q);
    ans.push(d.ans && d.ans[i] !== undefined ? d.ans[i] : (typeOf(q) === 'm' ? [] : null));
    locked.push(d.locked ? !!d.locked[i] : false);
  }
  return { paper: paper, ans: ans, locked: locked, idx: Math.min(d.idx || 0, paper.length - 1),
           practice: !!d.practice, t0: d.t0 || Date.now() };
}
function resumeSession(){
  var s = loadSession();
  if (!s) return;
  S.paper = s.paper; S.ans = s.ans; S.locked = s.locked; S.idx = s.idx;
  S.practice = s.practice; S.t0 = s.t0;
  S.screen = 'exam'; S.sheet = false; S.confirm = false; S.result = null;
  stopClock(); render(); startClock(); window.scrollTo(0,0);
}

function exportData(){
  var data = { v: 1, wrong: load(LS.wrong, []), hist: load(LS.hist, []), seen: load(LS.seen, []) };
  var blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '消防刷题数据_' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}
function importData(file){
  var reader = new FileReader();
  reader.onload = function(){
    try {
      var d = JSON.parse(reader.result);
      if (d && Array.isArray(d.wrong)) save(LS.wrong, d.wrong);
      if (d && Array.isArray(d.hist)) save(LS.hist, d.hist);
      if (d && Array.isArray(d.seen)) save(LS.seen, d.seen);
      render();
    } catch(e){}
  };
  reader.readAsText(file);
}

/* ---------- 视图 ---------- */
function typeStat(){
  var c = { s: 0, m: 0, j: 0 };
  BANK.forEach(function(x){ c[typeOf(x)] = (c[typeOf(x)] || 0) + 1; });
  return c;
}

function viewSetup(){
  var hist = load(LS.hist, []);
  var wrongBook = load(LS.wrong, []);
  var ts = typeStat();
  var h = '';
  h += '<div class="card">';
  h += '<h1>消防设施操作员（中级·监控方向）模拟考试</h1>';
  h += '<p class="sub">题库共 <b>' + BANK.length + '</b> 道：单选 ' + ts.s + ' · 多选 ' + ts.m + ' · 判断 ' + ts.j + '　｜　按知识点分组去重</p>';
  h += '<div class="rule"></div>';

  var sess = loadSession();
  if (sess){
    var sDone = sess.ans.filter(answered).length;
    h += '<div class="explain ok" style="margin:0 0 16px">';
    h += '<div class="head">上次没做完，可以接着答</div>';
    h += '<div>' + (sess.practice ? '练习模式' : '考试模式') + ' · ' + sess.paper.length + ' 题 · 做到第 ' + (sess.idx + 1) + ' 题 · 已答 ' + sDone + ' 题</div>';
    h += '<div class="row mt8"><button class="btn primary" data-act="resume">继续上次</button><button class="btn" data-act="discard">放弃这份</button></div>';
    h += '</div>';
  }

  h += '<h2>模式</h2><div class="row"><div class="seg">';
  h += '<button data-act="pmode" data-p="0" class="' + (!S.practice?'on':'') + '">考试模式</button>';
  h += '<button data-act="pmode" data-p="1" class="' + (S.practice?'on':'') + '">练习模式</button>';
  h += '</div></div>';
  h += '<p class="muted mt8">' + (S.practice
      ? '练习模式：选完立刻判对错并显示解析，答过不能改，适合边做边记。'
      : '考试模式：全部做完交卷后统一评分，交卷后可在答题卡里逐题看解析。') + '</p>';

  var sizes = [20,50,100,150,200].filter(function(n){ return n <= BANK.length; });
  if (!sizes.length) sizes = [BANK.length];
  var curSize = sizes.indexOf(S.size) >= 0 ? S.size : sizes[sizes.length - 1];
  h += '<h2 class="mt24">题量</h2><div class="row"><div class="seg">';
  sizes.forEach(function(n){
    h += '<button data-act="size" data-n="' + n + '" class="' + (curSize===n?'on':'') + '">' + n + ' 题</button>';
  });
  h += '</div></div>';

  var qq = quotas(curSize);
  h += '<p class="muted mt8">试卷结构：单选 ' + qq.s + ' 题 · 多选 ' + qq.m + ' 题 · 判断 ' + qq.j + ' 题（6 : 2 : 2）</p>';
  h += '<p class="muted">计分：单选 1 分 · 多选 2 分 · 判断 1 分，按全卷折算百分制；练习模式没做完整套只显示正确率。</p>';

  h += '<h2 class="mt24">抽题方式</h2><div class="row"><div class="seg">';
  h += '<button data-act="mode" data-m="balanced" class="' + (S.mode==='balanced'?'on':'') + '">模块均衡</button>';
  h += '<button data-act="mode" data-m="random" class="' + (S.mode==='random'?'on':'') + '">完全随机</button>';
  h += '</div></div>';
  h += '<div class="row mt16"><label class="muted"><input type="checkbox" id="fresh" ' + (S.fresh?'checked':'') + '> 优先抽取没做过的题（降低重复度）</label></div>';
  h += '<div class="mt24"><button class="btn primary" data-act="start"' + (BANK.length ? '' : ' disabled') + '>' + (S.practice ? '开始练习' : '开始考试') + '</button>';
  if (wrongBook.length) h += ' <button class="btn" data-act="redo">重做错题本（' + wrongBook.length + ' 题）</button>';
  h += '</div>';

  var cats = {};
  BANK.forEach(function(x){ cats[x.cat] = (cats[x.cat] || 0) + 1; });
  h += '<div class="rule"></div><h2>题库构成</h2><ul class="list">';
  Object.keys(cats).sort().forEach(function(c){
    h += '<li><span>' + esc(c) + '</span><span>' + cats[c] + ' 道</span></li>';
  });
  h += '</ul>';
  if (hist.length){
    h += '<div class="rule"></div><h2>最近成绩</h2><ul class="list">';
    hist.slice(-5).reverse().forEach(function(r){
      var d = new Date(r.t);
      h += '<li><span>' + d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate() + ' ' + (d.getHours()<10?'0':'') + d.getHours() + ':' + (d.getMinutes()<10?'0':'') + d.getMinutes() + ' · ' + r.n + ' 题</span><span>' + r.score + ' 分</span></li>';
    });
    h += '</ul>';
  }
  h += '<div class="rule"></div><h2>数据</h2><div class="row">';
